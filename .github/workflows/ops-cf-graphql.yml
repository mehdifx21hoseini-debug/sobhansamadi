# یک پرسشِ دلخواه از API تحلیلِ کلادفلر - فقط خواندن.
#
# چرا جدا از ops-cf-usage: آن یکی گزارشِ ثابتِ روزانه است. این یکی برای
# وقتی است که سؤالِ تازه‌ای پیش می‌آید (مثلاً «کدام نوع درخواست CPU
# بیشتری می‌برد؟») و نمی‌خواهیم برای هر سؤال گزارشِ روزانه را عوض کنیم.
#
# متغیرهای آماده داخلِ پرسش: $a (شناسه‌ی حساب)، $s و $u (زمانِ شروع و
# پایان، ISO)، $sd و $ud (همان‌ها به شکلِ تاریخ). فقط متغیرهایی فرستاده
# می‌شوند که در متنِ پرسش آمده‌اند، چون کلادفلر متغیرِ اعلام‌نشده را رد
# می‌کند.
name: Ops CF GraphQL

on:
  workflow_dispatch:
    inputs:
      query:
        description: "GraphQL query (may use $a, $s, $u, $sd, $ud)"
        required: true
      hours:
        description: "How many hours back $s starts"
        required: false
        default: "24"
      rest:
        description: "Instead of GraphQL: REST path under /accounts/<id>/ (POST with the query input as JSON body)"
        required: false
        default: ""
      jq:
        description: "jq filter applied to the response (default: .)"
        required: false
        default: "."

permissions: {}

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the Cloudflare analytics API
        env:
          ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          Q: ${{ inputs.query }}
          HOURS: ${{ inputs.hours }}
          JQF: ${{ inputs.jq }}
          REST: ${{ inputs.rest }}
        run: |
          set -u
          TOKEN="${ANALYTICS_TOKEN:-$FALLBACK_TOKEN}"
          test -n "$TOKEN" || { echo "::error::هیچ توکنی تنظیم نشده"; exit 1; }
          case "$HOURS" in ''|*[!0-9]*) HOURS=24 ;; esac
          S=$(date -u -d "$HOURS hours ago" +%Y-%m-%dT%H:%M:%SZ)
          U=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SD=${S:0:10}
          UD=${U:0:10}
          echo "بازه: $S تا $U"
          mask() { sed -E "s/$ACCOUNT/<حساب>/g; s/[A-Za-z0-9_-]{30,}/<پنهان>/g"; }
          VARS=$(jq -nc --arg a "$ACCOUNT" --arg s "$S" --arg u "$U" --arg sd "$SD" --arg ud "$UD" --arg q "$Q" '
            {a:$a, s:$s, u:$u, sd:$sd, ud:$ud}
            | with_entries(select(.key as $k | $q | test("\\$" + $k + "\\b")))')
          if [ -n "$REST" ]; then
            case "$REST" in *..*|/*) echo "::error::مسیرِ نامعتبر"; exit 1 ;; esac
            # بدنه‌ی REST متغیرِ GraphQL ندارد؛ جای‌گذاری با نشانه‌های ثابت:
            # __S__ و __U__ (ISO)، __SMS__ و __UMS__ (میلی‌ثانیه).
            SMS=$(( $(date -u -d "$S" +%s) * 1000 ))
            UMS=$(( $(date -u -d "$U" +%s) * 1000 ))
            BODY=$(printf '%s' "$Q" | sed -e "s/__SMS__/$SMS/g; s/__UMS__/$UMS/g; s/__S__/$S/g; s/__U__/$U/g")
            curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/$REST" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              --data "$BODY" | mask | jq -r "${JQF:-.}"
            exit 0
          fi
          BODY=$(jq -nc --arg q "$Q" --argjson v "$VARS" '{query:$q, variables:$v}')
          curl -sS -X POST https://api.cloudflare.com/client/v4/graphql \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY" | mask | jq -r "${JQF:-.}"
