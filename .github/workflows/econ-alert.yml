# هشدارِ پیش از خبر را به همه‌ی مشترکین می‌رساند.
#
# ─── چرا این فایل هست ─────────────────────────────────────────────
#
# هر پیامِ تلگرام یک subrequest است و سقفش در هر فراخوانیِ ورکر است،
# نه در روز - پس کرانِ هر پنج دقیقه حداکثر ۴۵ پیام می‌فرستد. خلاصه و
# اطلاعیه و سلام هر سه ورک‌فلوی موازیِ خودشان را داشتند. هشدار نداشت.
#
# اندازه‌گیریِ ۸ اکتبر این را دقیق نشان داد: ۳٬۳۸۴ مشترکِ فعال، و هر
# خبرِ مهم به **۵۴۰** نفر رسیده بود. سخنرانی ترامپ ۵۴۰، صورت‌جلسه‌ی
# فدرال‌رزرو ۵۴۰، سخنرانی والر ۵۴۰. آن عدد ۱۲ تیک × ۴۵ است - یعنی
# سقفِ بودجه و نه یک نفر بیشتر. ۸۴٪ مشترکین هیچ‌وقت هشدار نگرفتند.
#
# و بدترش ترتیب بود: پنجره‌ی ۶۰ دقیقه زودتر باز می‌شود و بودجه را
# می‌برد، پس ۴۱۵ نفری که «۵ دقیقه قبل» را انتخاب کرده بودند عملاً
# هرگز چیزی نگرفتند - و همین گزارش شد.
#
# ─── چرا زمان‌بندی ندارد ──────────────────────────────────────────
#
# فقط کرانِ خودِ کلادفلر صدایش می‌زند، سرِ باز شدنِ هر پنجره (۶۰، ۳۰،
# ۱۵ و ۵ دقیقه پیش از خبر). زمان‌بندِ خودِ گیت‌هاب برای این کار بی‌فایده
# است: اندازه‌گیری شد که سلامِ دوشنبه را هر هفته چهار تا هفت ساعت دیر
# اجرا کرده، و هشدار پنجره‌اش دقیقه‌ای است نه ساعتی.
#
# ─── نشانگر در پاسخ، نه در دیتابیس ───────────────────────────────
#
# برخلافِ خلاصه، نشانگرِ هشدار در دیتابیس ذخیره نمی‌شود: هشدار `ref`ِ
# یکتای روزانه ندارد - هر مشترک بسته به فاصله‌ی انتخابی‌اش خبرِ دیگری
# در موعد دارد - پس کلیدِ «نشانگرِ امروز» معنایی ندارد و پاک کردنش هم
# جایی ندارد. هر کارگر `cursor` را از پاسخ می‌گیرد و به دورِ بعد
# می‌دهد، پس هر اجرا یک پیمایشِ کاملِ تازه و بی‌حالت است.
name: Econ News Alert

on:
  workflow_dispatch:

permissions: {}

# دو اجرای هم‌زمان ضرری ندارد - دفترِ ارسال جلوی پیامِ تکراری را
# می‌گیرد - ولی وقتی پنجره‌ی ۱۵ و ۵ دقیقه نزدیکِ هم باز می‌شوند، اجرای
# دوم باید منتظرِ اولی نماند: پنجره‌ی هشدار دقیقه‌ای است و تأخیر یعنی
# خبر از دست رفته. پس لغو هم نمی‌کنیم و صف هم نمی‌بندیم.
concurrency:
  group: econ-alert-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    # پنجره‌ی هشدار حداکثر یک ساعت است؛ اجرایی که بیش از این طول بکشد
    # دیگر به کارِ کسی نمی‌آید.
    timeout-minutes: 10
    steps:
      - name: Drain the alert queue
        env:
          ADMIN_KEY: ${{ secrets.WORKER_ADMIN_KEY }}
          BASE: https://sobhansamadi.mehdifx21hoseini.workers.dev
        run: |
          set -u
          test -n "$ADMIN_KEY" || { echo "::error::WORKER_ADMIN_KEY تنظیم نشده"; exit 1; }

          # هر کارگر تکه‌ی خودش را دارد، بر اساسِ باقی‌ماندهٔ تقسیمِ
          # آیدی. بدونِ این، شش کارگر هر شش‌تا از اولِ فهرست شروع
          # می‌کنند: یکی می‌فرستد و پنج‌تا فقط «قبلاً فرستاده شده»
          # می‌بینند - همان چیزی که در اجرای واقعیِ خلاصه دیده شد.
          WORKERS=6
          # سه‌هزاروچهارصد مشترک، صفحه‌های ۱۲۰تایی، شش کارگر: حدودِ پنج
          # دور برای هر کارگر. سقف با حاشیه‌ی زیاد گذاشته شده تا فهرست
          # بتواند چند برابر شود و این عدد دست نخورد.
          MAX=40

          drain_one() {
            w="$1"
            body="body-alert-$w.json"
            total=0
            after=""
            for i in $(seq 1 $MAX); do
              code=$(curl -sS --max-time 120 -o "$body" -w '%{http_code}' \
                -H "x-admin-key: $ADMIN_KEY" \
                --get \
                --data-urlencode "shards=$WORKERS" \
                --data-urlencode "shard=$((w - 1))" \
                --data-urlencode "after=$after" \
                "$BASE/admin/econ-alert-drain") || code=000

              if [ "$code" != "200" ]; then
                # یک دورِ خراب کشنده نیست: نشانگر دست‌نخورده می‌ماند و
                # دورِ بعد از همان‌جا ادامه می‌دهد، چون کسی تا پیامش
                # واقعاً نرفته باشد «فرستاده شده» علامت نمی‌خورد.
                echo "[alert] کارگر $w دور $i: کد $code - دوباره تلاش می‌شود"
                sleep 3
                continue
              fi

              # هرگز بدنه را خام چاپ نکن: پاسخِ یک مسیرِ مدیر است و
              # لاگِ این مخزن عمومی است.
              flat=$(sed -E 's/[0-9]{6,}:[A-Za-z0-9_-]{30,}/<توکن پنهان شد>/g' "$body" | tr -d ' \n')
              sent=$(echo "$flat" | grep -o '"sent":[0-9]*' | head -1 | cut -d: -f2)
              sent=${sent:-0}
              total=$((total + sent))

              # نشانگرِ دورِ بعد. اگر نبود، یعنی ورکر صفحه‌بندی نکرده و
              # ادامه دادن فقط همان صفحه را دوباره می‌خواند.
              nxt=$(echo "$flat" | grep -o '"cursor":"[0-9]*"' | head -1 | cut -d'"' -f4)
              if [ -z "$nxt" ]; then
                echo "[alert] کارگر $w دور $i: نشانگر برنگشت - ایستاد."
                break
              fi
              after="$nxt"

              echo "[alert] کارگر $w دور $i: $sent پیام (جمع این کارگر: $total)"

              case "$flat" in
                *'"done":true'*|*'"skipped":'*)
                  echo "[alert] کارگر $w تمام کرد - $total پیام در $i دور."
                  break
                  ;;
              esac
            done
            echo "$total" > "count-alert-$w.txt"
          }

          for w in $(seq 1 $WORKERS); do
            drain_one "$w" &
          done
          wait

          grand=0
          for w in $(seq 1 $WORKERS); do
            n=$(cat "count-alert-$w.txt" 2>/dev/null || echo 0)
            grand=$((grand + n))
          done
          echo "✅ [alert] مجموع این اجرا: $grand هشدار"
