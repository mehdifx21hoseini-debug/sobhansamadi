# مصرفِ امروزِ حسابِ کلادفلر - فقط خواندن.
#
# چرا لازم است: سقف‌های پلنِ رایگان (درخواستِ ورکر، و مهم‌تر از آن
# ردیف‌خوانی D1) جایی دیده نمی‌شوند مگر در داشبورد. یک بار همین سقفِ
# ردیف‌خوانی پر شد و ربات تا نیمه‌شب ۵۰۲ می‌داد، بدونِ اینکه هیچ‌جا
# نوشته شود چرا. این جاب همان عددها را می‌آورد تا پیش از رسیدن به سقف
# دیده شوند.
#
# هیچ چیزی نمی‌نویسد و هیچ تنظیمی را عوض نمی‌کند.
name: Ops CF Usage

on:
  workflow_dispatch:

permissions: {}

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the Cloudflare analytics API
        env:
          # توکنِ جدا و فقط-خواندنی، با دسترسیِ Account Analytics: Read.
          #
          # چرا جدا از CLOUDFLARE_API_TOKEN: آن یکی کارهای دیگری می‌کند و
          # عوض کردنش می‌توانست بی‌صدا چیزی را بشکند. این یکی فقط عدد
          # می‌خواند و هیچ‌چیز را عوض نمی‌کند، پس حتی اگر لو برود کاری
          # از دستش برنمی‌آید.
          #
          # توکنِ قدیمی به‌عنوان جای‌گزین می‌ماند: اگر روزی Secretِ تازه
          # پاک شود، این جاب به‌جای خطای گیج‌کننده، همان رفتارِ قبلی را
          # دارد.
          ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          TOKEN="${ANALYTICS_TOKEN:-$FALLBACK_TOKEN}"
          if [ -n "${ANALYTICS_TOKEN:-}" ]; then
            echo "توکن: CLOUDFLARE_ANALYTICS_TOKEN"
          else
            echo "توکن: CLOUDFLARE_API_TOKEN (جای‌گزین)"
          fi
          test -n "$TOKEN" || { echo "::error::هیچ توکنی تنظیم نشده"; exit 1; }
          test -n "$ACCOUNT" || { echo "::error::CLOUDFLARE_ACCOUNT_ID تنظیم نشده"; exit 1; }

          TODAY=$(date -u +%Y-%m-%d)
          # هفت روز، نه فقط امروز.
          #
          # «امروز» وقتی جاب صبح اجرا شود چند ساعت است و با روزِ کامل
          # قابلِ مقایسه نیست - و تصمیمِ «پلن پولی لازم است یا نه» دقیقاً
          # روی همین مقایسه می‌چرخد. با هفت روز، هم روزهای کاملِ قبل
          # دیده می‌شوند هم اثرِ هر تغییری که وسطِ هفته رفته.
          FROM=$(date -u -d '6 days ago' +%Y-%m-%d)
          SINCE="${FROM}T00:00:00Z"
          UNTIL=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "بازه: $SINCE تا $UNTIL (UTC)"
          echo "سقفِ رایگان: ۵٬۰۰۰٬۰۰۰ خواندن و ۱۰۰٬۰۰۰ نوشتن در هر روز"
          echo

          # شناسه‌ی حساب هرگز چاپ نمی‌شود: مخزن عمومی است.
          mask() { sed -E "s/$ACCOUNT/<حساب>/g; s/[A-Za-z0-9_-]{30,}/<پنهان>/g"; }

          ask() {
            curl -sS -X POST https://api.cloudflare.com/client/v4/graphql \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              --data "$1"
          }

          # ── D1: ردیف‌های خوانده و نوشته‌شده ──────────────────────────
          # سقفِ رایگان: ۵ میلیون خواندن و ۱۰۰ هزار نوشتن در روز.
          D1_Q=$(jq -nc --arg a "$ACCOUNT" --arg s "$FROM" --arg u "$TODAY" '{
            query: "query($a:String!,$s:Date!,$u:Date!){viewer{accounts(filter:{accountTag:$a}){d1AnalyticsAdaptiveGroups(limit:100,filter:{date_geq:$s,date_leq:$u}){sum{readQueries writeQueries rowsRead rowsWritten}dimensions{date databaseId}}}}}",
            variables: {a:$a, s:$s, u:$u}
          }')
          echo "─── D1 ───"
          ask "$D1_Q" | mask | jq -r '
            if .errors then "خطا: " + (.errors | map(.message) | join("; "))
            else (.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups // [])
              | if length == 0 then "داده‌ای برنگشت"
                else sort_by(.dimensions.date)
          | map("\(.dimensions.date)  خواندن \(.sum.rowsRead)\(if .sum.rowsRead > 5000000 then "  ❌ از سقف رد شد" else "  ✅" end)  ·  نوشتن \(.sum.rowsWritten)\(if .sum.rowsWritten > 100000 then " ❌" else "" end)  ·  کوئری \(.sum.readQueries)/\(.sum.writeQueries)")
          | join("\n")
                end
            end'
          echo

          # ── کدام کوئری‌ها بیشترین ردیف را می‌خوانند ─────────────────
          #
          # چرا لازم شد: مجموعِ روزانه می‌گوید «زیاد است» ولی نمی‌گوید
          # «از کجا». یک بار بهینه‌سازی بر اساسِ حدس انجام شد و هیچ
          # اثری نداشت - چون جایی را بست که مقصر نبود. این بخش همان
          # حدس را با داده جای‌گزین می‌کند.
          Q_Q=$(jq -nc --arg a "$ACCOUNT" --arg s "$TODAY" --arg u "$TODAY" '{
            query: "query($a:String!,$s:Date!,$u:Date!){viewer{accounts(filter:{accountTag:$a}){d1QueriesAdaptiveGroups(limit:1000,filter:{date_geq:$s,date_leq:$u}){sum{rowsRead rowsWritten}count dimensions{query}}}}}",
            variables: {a:$a, s:$s, u:$u}
          }')
          echo "─── سنگین‌ترین کوئری‌ها - فقط امروز (UTC)، بر اساس ردیف‌خوانی ───"
          ask "$Q_Q" | mask | jq -r '
            if .errors then "خطا: " + (.errors | map(.message) | join("; "))
            else (.data.viewer.accounts[0].d1QueriesAdaptiveGroups // [])
              | if length == 0 then "داده‌ای برنگشت"
                else (map(.sum.rowsRead) | add) as $all
                  | length as $n
                  | sort_by(-.sum.rowsRead) | .[0:12]
                  | map("\(.sum.rowsRead) ردیف  ·  \(.count) بار  ·  \(.dimensions.query | gsub("\\s+"; " ") | .[0:150])")
                  | join("\n")
                    + "\n--- جمعِ همه‌ی \($n) شکلِ کوئری: \($all) ردیف (با عددِ کلِ روز در بالا مقایسه کن) ---"
                end
            end'
          echo

          # ── کدام کوئری‌ها بیشترین ردیف را می‌نویسند ─────────────────
          #
          # چرا لازم شد: سقفِ نوشتن (۱۰۰ هزار) به هدفِ ۷۰ هزار نزدیک
          # شده، ولی فهرستِ بالا فقط خواندن را مرتب می‌کند. همان
          # پاسخِ Q_Q ردیف‌های نوشته‌شده را هم دارد؛ فقط مرتب‌سازی عوض
          # می‌شود.
          echo "─── سنگین‌ترین کوئری‌ها - فقط امروز (UTC)، بر اساس ردیف‌نوشتن ───"
          ask "$Q_Q" | mask | jq -r '
            if .errors then "خطا: " + (.errors | map(.message) | join("; "))
            else (.data.viewer.accounts[0].d1QueriesAdaptiveGroups // [])
              | if length == 0 then "داده‌ای برنگشت"
                else (map(.sum.rowsWritten) | add) as $all
                  | sort_by(-.sum.rowsWritten) | .[0:12]
                  | map("\(.sum.rowsWritten) ردیف  ·  \(.count) بار  ·  \(.dimensions.query | gsub("\\s+"; " ") | .[0:150])")
                  | join("\n")
                    + "\n--- جمعِ نوشتنِ همه‌ی شکل‌ها: \($all) ردیف ---"
                end
            end'
          echo

          # ── نوشتن ساعت‌به‌ساعت، و کوئری‌های دیروز ───────────────────
          #
          # چرا لازم شد: جمعِ نوشتنِ شکل‌های کوئری هر روز فقط نیمی از
          # عددِ کلِ روز است و ۸ نوامبر بخشِ نامعلوم دو برابر شد. سه
          # پرسش جوابش را می‌دهند: نوشتن در کدام ساعت رخ داده، چند
          # دیتابیس داریم، و آیا شکافِ روزِ کامل هم همین‌قدر است.
          YDAY=$(date -u -d '1 day ago' +%Y-%m-%d)
          H_Q=$(jq -nc --arg a "$ACCOUNT" --arg s "${YDAY}T00:00:00Z" --arg u "$UNTIL" '{
            query: "query($a:String!,$s:Time!,$u:Time!){viewer{accounts(filter:{accountTag:$a}){d1AnalyticsAdaptiveGroups(limit:200,filter:{datetimeHour_geq:$s,datetimeHour_leq:$u}){sum{rowsRead rowsWritten writeQueries}dimensions{datetimeHour databaseId}}}}}",
            variables: {a:$a, s:$s, u:$u}
          }')
          echo "─── نوشتن ساعت‌به‌ساعت (دیروز و امروز، UTC) ───"
          ask "$H_Q" | mask | jq -r '
            if .errors then "خطا: " + (.errors | map(.message) | join("; "))
            else (.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups // [])
              | (map(.dimensions.databaseId) | unique | length) as $dbs
              | "شمار دیتابیس‌ها: \($dbs)",
                (sort_by(.dimensions.datetimeHour) | .[]
                 | "\(.dimensions.datetimeHour)  نوشتن \(.sum.rowsWritten)  ·  کوئریِ نوشتن \(.sum.writeQueries)  ·  خواندن \(.sum.rowsRead)  ·  db \(.dimensions.databaseId[0:6])")
            end'
          echo
          Y_Q=$(jq -nc --arg a "$ACCOUNT" --arg s "$YDAY" --arg u "$YDAY" '{
            query: "query($a:String!,$s:Date!,$u:Date!){viewer{accounts(filter:{accountTag:$a}){d1QueriesAdaptiveGroups(limit:1000,filter:{date_geq:$s,date_leq:$u}){sum{rowsRead rowsWritten}count dimensions{query}}}}}",
            variables: {a:$a, s:$s, u:$u}
          }')
          echo "─── دیروز (روزِ کامل): سنگین‌ترین کوئری‌ها بر اساس ردیف‌نوشتن ───"
          ask "$Y_Q" | mask | jq -r '
            if .errors then "خطا: " + (.errors | map(.message) | join("; "))
            else (.data.viewer.accounts[0].d1QueriesAdaptiveGroups // [])
              | if length == 0 then "داده‌ای برنگشت"
                else (map(.sum.rowsWritten) | add) as $w
                  | (map(.sum.rowsRead) | add) as $r
                  | (sort_by(-.sum.rowsWritten) | .[0:10]
                     | map("\(.sum.rowsWritten) ردیف  ·  \(.count) بار  ·  \(.dimensions.query | gsub("\\s+"; " ") | .[0:150])")
                     | join("\n"))
                    + "\n--- دیروز: جمعِ نوشتنِ شکل‌ها \($w)، جمعِ خواندنِ شکل‌ها \($r) ---"
                end
            end'
          echo

          # ── Workers: درخواست و subrequest ───────────────────────────
          # سقفِ رایگان: ۱۰۰ هزار درخواست در روز.
          W_Q=$(jq -nc --arg a "$ACCOUNT" --arg s "$SINCE" --arg u "$UNTIL" '{
            query: "query($a:String!,$s:Time!,$u:Time!){viewer{accounts(filter:{accountTag:$a}){workersInvocationsAdaptive(limit:100,filter:{datetime_geq:$s,datetime_leq:$u}){sum{requests errors subrequests}dimensions{scriptName}}}}}",
            variables: {a:$a, s:$s, u:$u}
          }')
          echo "─── Workers ───"
          ask "$W_Q" | mask | jq -r '
            if .errors then "خطا: " + (.errors | map(.message) | join("; "))
            else (.data.viewer.accounts[0].workersInvocationsAdaptive // [])
              | if length == 0 then "داده‌ای برنگشت"
                else map("\(.dimensions.scriptName): درخواست \(.sum.requests)  ·  subrequest \(.sum.subrequests)  ·  خطا \(.sum.errors)") | join("\n")
                end
            end'

          # ── Workers: بر حسب «وضعیت» و CPU ───────────────────────────
          # ۵۰۳ در ورک‌فلوها: از خودِ ورکر نیست. status اینجا می‌گوید
          # کلادفلر چرا رد کرده (exceededCpu، exceededResources، ...).
          S_Q=$(jq -nc --arg a "$ACCOUNT" --arg s "$SINCE" --arg u "$UNTIL" '{
            query: "query($a:String!,$s:Time!,$u:Time!){viewer{accounts(filter:{accountTag:$a}){workersInvocationsAdaptive(limit:100,filter:{datetime_geq:$s,datetime_leq:$u}){sum{requests subrequests}quantiles{cpuTimeP50 cpuTimeP99 wallTimeP99}dimensions{status}}}}}",
            variables: {a:$a, s:$s, u:$u}
          }')
          echo
          echo "─── Workers به تفکیک وضعیت ───"
          ask "$S_Q" | mask | jq -r '
            if .errors then "خطا: " + (.errors | map(.message) | join("; "))
            else (.data.viewer.accounts[0].workersInvocationsAdaptive // [])
              | if length == 0 then "داده‌ای برنگشت"
                else map("\(.dimensions.status): درخواست \(.sum.requests)  ·  CPU p50 \(.quantiles.cpuTimeP50)µs  p99 \(.quantiles.cpuTimeP99)µs  ·  wall p99 \(.quantiles.wallTimeP99)ms") | join("\n")
                end
            end'

          # ── CPU به تفکیکِ نوعِ اجرا، روز به روز ─────────────────────
          # برای پلنِ رایگان (حدودِ ۱۰ میلی‌ثانیه CPU در هر اجرا): fetch
          # یعنی پیام‌های کاربر و درخواست‌های ورک‌فلو، cron یعنی کران‌های
          # خودِ ورکر. هر روز جدا، تا اثرِ یک تغییر از روزِ قبلش دیده شود.
          # exceededCpu / exceededResources یعنی کلادفلر آن اجرا را کشت.
          T_Q=$(jq -nc --arg a "$ACCOUNT" --arg s "$SINCE" --arg u "$UNTIL" '{
            query: "query($a:String!,$s:Time!,$u:Time!){viewer{accounts(filter:{accountTag:$a}){workersInvocationsAdaptive(limit:500,filter:{datetime_geq:$s,datetime_leq:$u}){sum{requests}quantiles{cpuTimeP50 cpuTimeP90 cpuTimeP99}dimensions{date eventType status}}}}}",
            variables: {a:$a, s:$s, u:$u}
          }')
          echo
          echo "─── CPU به تفکیکِ روز و نوع (میلی‌ثانیه) ───"
          ask "$T_Q" | mask | jq -r '
            if .errors then "خطا: " + (.errors | map(.message) | join("; "))
            else (.data.viewer.accounts[0].workersInvocationsAdaptive // [])
              | if length == 0 then "داده‌ای برنگشت"
                else sort_by(.dimensions.date, .dimensions.eventType, .dimensions.status)
                  | map("\(.dimensions.date)  \(.dimensions.eventType) \(.dimensions.status): \(.sum.requests)  ·  p50 \((.quantiles.cpuTimeP50/1000*10|floor)/10)  p90 \((.quantiles.cpuTimeP90/1000*10|floor)/10)  p99 \((.quantiles.cpuTimeP99/1000*10|floor)/10)")
                  | join("\n")
                end
            end'
