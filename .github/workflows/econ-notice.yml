# اطلاعیه‌ی موردی را تا آخر می‌راند.
#
# چرا هست: هر پیامِ تلگرام یک subrequest است و سقفش در هر فراخوانیِ
# ورکر است، نه در روز. کرانِ داخلیِ ورکر تک‌رشته‌ای است و ۴۵ پیام در هر
# تیکِ پنج‌دقیقه‌ای می‌فرستد - برای سیزده هزار نفر یعنی حدود بیست‌وسه
# ساعت. این کار همان اندپوینت را پشتِ سرِ هم و شش‌تا هم‌زمان صدا می‌زند،
# و هر فراخوانی بودجه‌ی تازه می‌گیرد.
#
# دقیقاً همان شکلِ econ-digest.yml است و همان دلیل. اگر روزی یکی‌شان
# عوض شد، آن یکی هم باید.
#
# موازی بودن بی‌خطر است: ورکر پیش از ارسال، گیرنده را با درجِ
# «تکراری‌ها را نادیده بگیر» در دفترِ ارسال می‌نویسد. دو فراخوانی که یک
# نفر را بردارند هر دو نمی‌فرستند؛ بازنده رد می‌شود.
name: Econ Notice

on:
  schedule:
    # ۰۴:۴۵ UTC یعنی ۸:۱۵ تهران، هر روز.
    #
    # هر روز و نه فقط روزهای اطلاعیه: تاریخ‌ها در کد هستند و ورکر خودش
    # می‌داند امروز روزش هست یا نه. در روزی که نیست، اولین فراخوانی
    # «امروز روزِ اطلاعیه نیست» برمی‌گرداند و کار در چند ثانیه تمام
    # می‌شود - همان الگوی econ-holiday.
    #
    # ۸:۱۵ و نه ۸:۰۰: خلاصه‌ی صبح ۷:۳۰ شروع می‌شود و حدود بیست دقیقه
    # طول می‌کشد. ورکر تا پیش از ۹ منتظرِ تمام شدنش می‌ماند، پس زودتر
    # آمدن فقط دورِ بی‌فایده است.
    - cron: '45 4 * * *'
    # سه بار و نه یک بار. صبحِ ۱۵ سپتامبر هیچ‌کدام از کارهای
    # زمان‌بندی‌شده‌ی گیت‌هاب سرِ ساعت نیامد و اطلاعیه افتاد روی کرانِ
    # خودِ ورکر - یعنی ۴۵ پیام در هر پنج دقیقه، که برای سیزده هزار نفر
    # یعنی تا شب. زمان‌بندیِ گیت‌هاب «بهترین کوشش» است و زیرِ بار جا
    # می‌اندازد؛ یک بار صدا زدن یعنی یک نقطه‌ی شکست.
    #
    # تکرار بی‌خطر است: دفترِ ارسال پیش از هر پیام گیرنده را قفل
    # می‌کند، پس دورِ دوم و سوم فقط باقی‌مانده را برمی‌دارند و اگر
    # چیزی نمانده باشد در چند ثانیه تمام می‌شوند.
    - cron: '15 5 * * *'
    - cron: '45 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: econ-notice
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Drain the greeting queue
        env:
          ADMIN_KEY: ${{ secrets.WORKER_ADMIN_KEY }}
          BASE: https://sobhansamadi.mehdifx21hoseini.workers.dev
        run: |
          set -u
          test -n "$ADMIN_KEY" || { echo "::error::WORKER_ADMIN_KEY تنظیم نشده"; exit 1; }

          WORKERS=6
          MAX=80
          ENDPOINT="econ-notice-drain"

          # force=1 پرچمِ «امروز تمام شد» را نادیده می‌گیرد. لازم است
          # چون کرانِ ورکر ممکن است پیش از این کار پرچم را زده باشد -
          # مثلاً وقتی همان لحظه کسی تازه عضو شده. دوباره نمی‌فرستد:
          # دفترِ ارسال همچنان تصمیم می‌گیرد چه کسی پیام می‌گیرد.
          FORCE="force=1"

          drain_one() {
            w="$1"
            body="body-$w.json"
            total=0
            for i in $(seq 1 $MAX); do
              code=$(curl -sS -o "$body" -w '%{http_code}' \
                -H "x-admin-key: $ADMIN_KEY" \
                "$BASE/admin/$ENDPOINT?$FORCE&shards=$WORKERS&shard=$((w - 1))") || code=000

              if [ "$code" != "200" ]; then
                echo "[اطلاعیه] کارگر $w دور $i: کد $code - دوباره تلاش می‌شود"
                sleep 5
                continue
              fi

              # پاسخ خام هرگز چاپ نمی‌شود: از یک مسیرِ ادمین می‌آید و هر
              # چیزِ توکن‌شکلی در آن نباید به لاگِ عمومی برسد.
              flat=$(sed -E 's/[0-9]{6,}:[A-Za-z0-9_-]{30,}/<توکن پنهان شد>/g' "$body" | tr -d ' \n')
              sent=$(echo "$flat" | grep -o '"sent":[0-9]*' | head -1 | cut -d: -f2)
              sent=${sent:-0}
              total=$((total + sent))
              echo "[اطلاعیه] کارگر $w دور $i: $sent پیام (جمع این کارگر: $total)"

              case "$flat" in
                *'"done":true'*|*'"skipped":'*)
                  echo "$total" > "count-$w.txt"
                  echo "[اطلاعیه] کارگر $w تمام کرد - $total پیام در $i دور."
                  return 0
                  ;;
              esac

              sleep 1
            done
            echo "$total" > "count-$w.txt"
            echo "::warning::[اطلاعیه] کارگر $w بعد از $MAX دور هنوز تمام نکرده."
          }

          for w in $(seq 1 $WORKERS); do
            drain_one "$w" &
          done
          wait

          grand=0
          for w in $(seq 1 $WORKERS); do
            n=$(cat "count-$w.txt" 2>/dev/null || echo 0)
            grand=$((grand + n))
          done
          echo "✅ مجموع: $grand پیام"
