# Drives the 8 AM Tehran calendar digest to completion.
#
# Why this exists: every Telegram message the Worker sends is one
# subrequest, and the Cloudflare free plan allows roughly 50 of them per
# invocation. The digest now goes to every bot member — about 8,500
# people — so no single invocation can come close to finishing it.
#
# The ceiling is per invocation, not per day. So each fresh HTTP request
# to the Worker gets a fresh budget. This job calls the drain endpoint
# over and over — six calls at a time — until the Worker reports there is
# nobody left.
#
# Running them in parallel is safe: before sending, the Worker writes the
# recipient into its sent log with an insert that ignores duplicates. Two
# calls that pick the same person cannot both send; the loser skips.
#
# This is the same shape as ff-calendar.yml: GitHub Actions is already the
# pipe that feeds the Worker its calendar data, because Cloudflare cannot
# do the job itself. Same reason here, different ceiling.
#
# The Worker's own */5 cron still drains too. That is the safety net for
# the days GitHub delays or disables scheduled runs — slower, but nobody
# is ever silently skipped.
name: Econ Daily Digest

on:
  schedule:
    # 04:30 UTC is 08:00 Tehran, all year: Iran has no daylight saving.
    # GitHub can delay scheduled runs by several minutes under load, which
    # is fine for a morning digest — and the Worker's own cron fires at
    # the same minute regardless, so the first chunk is never late.
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions: {}

# Two overlapping runs would each send their own chunks. That is not
# harmful — the sent log stops anyone getting the message twice — but it
# doubles the calls for no gain.
concurrency:
  group: econ-digest
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    # ~8,500 people at 45 a call is around 190 calls. Six at a time, each
    # taking about half a minute, puts the run near twenty minutes. The
    # limit is set well above that so a growing list does not get cut off
    # mid-send.
    timeout-minutes: 50
    steps:
      - name: Drain the digest queue
        env:
          ADMIN_KEY: ${{ secrets.WORKER_ADMIN_KEY }}
          BASE: https://sobhansamadi.mehdifx21hoseini.workers.dev
        run: |
          set -u
          test -n "$ADMIN_KEY" || { echo "::error::WORKER_ADMIN_KEY تنظیم نشده"; exit 1; }

          # Six in parallel is about 11 messages a second — a third of what
          # Telegram tolerates, and far enough below it that a slow round
          # cannot push the average over.
          WORKERS=6
          # Enough rounds per worker for well over twice the current list,
          # so it can grow a long way before this needs touching. A worker
          # stops the moment the Worker says there is nobody left, so the
          # cap only matters when something is wrong.
          MAX=80

          # The first call of a run passes force=1: it ignores the
          # "today is finished" flag. That matters on any day the audience
          # grows after the flag was set — the day the digest moved from
          # subscribers to every member, or simply people who joined after
          # the morning run. It cannot double-send: the sent log still
          # decides who gets a message.
          FORCE="?force=1"

          drain_one() {
            w="$1"
            body="body-$w.json"
            total=0
            for i in $(seq 1 $MAX); do
              code=$(curl -sS -o "$body" -w '%{http_code}' \
                -H "x-admin-key: $ADMIN_KEY" "$BASE/admin/econ-digest$FORCE") || code=000

              if [ "$code" != "200" ]; then
                # A single bad round is not fatal: the next one picks up
                # exactly where this stopped, because nobody is marked as
                # sent unless the message actually went out.
                echo "کارگر $w دور $i: کد $code - دوباره تلاش می‌شود"
                sleep 5
                continue
              fi

              # Never print the body raw: it is JSON from an admin route and
              # anything token-shaped in it must not reach a public log.
              # The Worker indents its JSON ("done": true), so match on a
              # space-stripped copy — patterns without the space silently
              # never fired, and the loop ran until the job timed out.
              flat=$(sed -E 's/[0-9]{6,}:[A-Za-z0-9_-]{30,}/<توکن پنهان شد>/g' "$body" | tr -d ' \n')
              sent=$(echo "$flat" | grep -o '"sent":[0-9]*' | head -1 | cut -d: -f2)
              sent=${sent:-0}
              total=$((total + sent))
              echo "کارگر $w دور $i: $sent پیام (جمع این کارگر: $total)"

              case "$flat" in
                *'"done":true'*|*'"skipped":'*)
                  echo "$total" > "count-$w.txt"
                  echo "کارگر $w تمام کرد - $total پیام در $i دور."
                  return 0
                  ;;
              esac

              sleep 1
            done
            echo "$total" > "count-$w.txt"
            echo "::warning::کارگر $w بعد از $MAX دور هنوز تمام نکرده."
          }

          for w in $(seq 1 $WORKERS); do
            drain_one "$w" &
          done
          wait

          grand=0
          for w in $(seq 1 $WORKERS); do
            n=$(cat "count-$w.txt" 2>/dev/null || echo 0)
            grand=$((grand + n))
          done
          echo "✅ مجموع پیام‌های فرستاده‌شده در این اجرا: $grand"
