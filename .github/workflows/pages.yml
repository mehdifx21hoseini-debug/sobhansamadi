# Publishes the CRM to GitHub Pages.
#
# Replaces GitHub's own branch-based Pages build, which began failing with
# startup_failure and zero jobs created while every other workflow in this
# repository still ran fine — so the site froze on an old build. Deploying
# through a workflow we control puts the publish back under our own,
# re-runnable pipeline.
#
# Requires Settings -> Pages -> Source to be set to "GitHub Actions".
name: Deploy CRM to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a publish that is already running: a cancelled deploy leaves
# the live site on the previous build, which is exactly the failure mode
# this workflow exists to avoid.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
