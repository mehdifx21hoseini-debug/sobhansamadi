# نگهبانِ مینی‌اپ.
#
# دو چیز را می‌شود فراموش کرد و هیچ‌کدام سر و صدا نمی‌کنند:
#
#   ۱. منبع src/econ-app/ عوض شود ولی econ-app.html ساخته نشود - آن‌وقت
#      کاربر تغییر را اصلاً نمی‌بیند و فایل منبع بی‌صدا از خروجی جدا
#      می‌افتد.
#   ۲. اپ عوض شود ولی appVersion.js عقب بماند - آن‌وقت وب‌ویوی تلگرام
#      نسخه‌ی کش‌شده را نگه می‌دارد و باز هم کاربر تغییر را نمی‌بیند.
#
# هر دو یک نشانه دارند: «چیزی عوض نشد». این جاب همان سکوت را به یک بیلد
# قرمز تبدیل می‌کند.
name: econ mini-app

on:
  push:
    paths:
      - "src/econ-app/**"
      - "econ-app.html"
      - "bot/src/econ/appVersion.js"
      - "bot/src/econ/appHtml.js"
      # تصویرها هم منبع‌اند: CSS آن‌ها را با data: URI درون خروجی می‌برد،
      # پس عوض شدنِ یک بنر هم خروجی را کهنه می‌کند.
      - "assets/img/**"
      - "scripts/build-econ-app.mjs"
      - ".github/workflows/econ-app.yml"
  pull_request:
    paths:
      - "src/econ-app/**"
      - "econ-app.html"
      - "bot/src/econ/appVersion.js"
      - "bot/src/econ/appHtml.js"
      # تصویرها هم منبع‌اند: CSS آن‌ها را با data: URI درون خروجی می‌برد،
      # پس عوض شدنِ یک بنر هم خروجی را کهنه می‌کند.
      - "assets/img/**"
      - "scripts/build-econ-app.mjs"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: خروجی و نسخه با منبع یکی است؟
        run: node scripts/build-econ-app.mjs --check

      # و این یکی می‌پرسد «اصلاً کار می‌کند؟».
      #
      # سوالِ بالا فقط یکی بودنِ خروجی با منبع را می‌سنجد، و آن جواب هیچ
      # ربطی به بالا آمدنِ اپ ندارد: یک متغیرِ محلی که تابعی هم‌نام را
      # بپوشاند، کلِ یک تب را سفید می‌کند بی‌آنکه بیلد قرمز شود. یک بار
      # همین اتفاق افتاد و تا وقتی دستی عکس نگرفتیم پیدا نشد.
      - name: نصبِ مرورگر
        run: npm i --no-save playwright-core@1.48.0 && npx --yes playwright@1.48.0 install --with-deps chromium

      - name: مینی‌اپ واقعاً بالا می‌آید؟
        run: node scripts/smoke-econ-app.mjs

      # عکس‌ها ادعا نیستند - برای وقتی است که بیلد قرمز شد و باید دید چه
      # شکلی بوده.
      - name: عکس‌ها
        if: always()
        run: node scripts/smoke-econ-app.mjs --shots /tmp/shots || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: econ-app-shots
          path: /tmp/shots
          if-no-files-found: ignore
