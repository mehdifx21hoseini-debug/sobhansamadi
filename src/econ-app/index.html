<!doctype html>
<!--
	این فایل ساخته می‌شود. دستی ویرایشش نکنید - با اولین ساخت پاک می‌شود.

	منبعش اینجاست:
	  src/econ-app/index.html   قالب و نشانه‌گذارها
	  src/econ-app/app.css      استایل
	  src/econ-app/lib/*.js     منطقِ خالص
	  src/econ-app/app.js       نما و اتصال‌ها

	بعد از هر تغییر:
	  node scripts/build-econ-app.mjs

	خروجی عمداً تک‌فایل است تا مینی‌اپ با یک درخواست بالا بیاید.
-->
<html lang="fa" dir="rtl">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>رصد — آکادمی سبحان صمدی</title>
	<script src="https://telegram.org/js/telegram-web-app.js"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<!--
		سه نقش، سه خانواده.

		وزیرمتن هرچه فارسی است. JetBrains Mono هر عددی که خوانده می‌شود -
		ساعت، نرخ، شمارشِ معکوس. رقم‌های هم‌عرضش یعنی ستون نمی‌لرزد و
		ثانیه‌شمار سرِ جایش می‌ماند.

		IBM Plex Sans نامِ لاتینِ شاخص‌ها را می‌گیرد - «Core CPI m/m»،
		«Nonfarm Employment Change». این‌ها تا امروز با گلیفِ لاتینِ
		وزیرمتن نوشته می‌شدند که برای فارسی طراحی شده نه برای یک نامِ
		فنیِ انگلیسی. پلکس با همان مونو یک خانواده‌ی فکری است و کنارش
		می‌نشیند.

		سریف عمداً نیست: این محصول یک روزنامه نیست، یک ابزارِ بازار است.
	-->
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
	<style>
		<!-- build:css -->
	</style>
</head>

<body>

use href="#fi-nz-nz-a" transform="scale(-1 1)rotate(72)"/></g></defs><path fill="#00247d" fill-rule="evenodd" d="M0 0h512v512H0z"/><g transform="translate(-148.7 90.5)scale(.60566)"><use href="#fi-nz-nz-b" width="100%" height="100%" fill="#fff" transform="translate(900 120)scale(45.4)"/><use href="#fi-nz-nz-b" width="100%" height="100%" fill="#cc142b" transform="matrix(30 0 0 30 900 120)"/></g><g transform="rotate(82 418.7 105.1)scale(.60566)"><use href="#fi-nz-nz-b" width="100%" height="100%" fill="#fff" transform="rotate(-82 519 -457.7)scale(40.4)"/><use href="#fi-nz-nz-b" width="100%" height="100%" fill="#cc142b" transform="rotate(-82 519 -457.7)scale(25)"/></g><g transform="rotate(82 418.7 105.1)scale(.60566)"><use href="#fi-nz-nz-b" width="100%" height="100%" fill="#fff" transform="rotate(-82 668.6 -327.7)scale(45.4)"/><use href="#fi-nz-nz-b" width="100%" height="100%" fill="#cc142b" transform="rotate(-82 668.6 -327.7)scale(30)"/></g><g transform="translate(-148.7 90.5)scale(.60566)"><use href="#fi-nz-nz-b" width="100%" height="100%" fill="#fff" transform="translate(900 480)scale(50.4)"/><use href="#fi-nz-nz-b" width="100%" height="100%" fill="#cc142b" transform="matrix(35 0 0 35 900 480)"/></g><path fill="#012169" d="M0 0h256v256H0z"/><path fill="#fff" d="M256 0v32l-95 96 95 93.5V256h-33.5L127 162l-93 94H0v-34l93-93.5L0 37V0h31l96 94 93-94z"/><path fill="#c8102e" d="m92 162 5.5 17L21 256H0v-1.5zm62-6 27 4 75 73.5V256zM256 0l-96 98-2-22 75-76zM0 .5 96.5 95 67 91 0 24.5z"/><path fill="#fff" d="M88 0v256h80V0zM0 88v80h256V88z"/><path fill="#c8102e" d="M0 104v48h256v-48zM104 0v256h48V0z"/></symbol><symbol id="fi-ch" viewBox="0 0 512 512"><g fill-rule="evenodd" stroke-width="1pt"><path fill="red" d="M0 0h512v512H0z"/><g fill="#fff"><path d="M96 208h320v96H96z"/><path d="M208 96h96v320h-96z"/></g></g></symbol></defs></svg>

	<!--
		چیدمان: یک نوارِ باریکِ بالا، یک صحنه که عوض می‌شود، و یک داکِ
		شناورِ پایین که با شست می‌رسد.

		نوارِ بالا عمداً نامِ برند را نمی‌گیرد. برند یک نشانِ کوچک در گوشه
		است؛ بقیه‌ی نوار برای چیزی است که کاربر واقعاً لازم دارد - منطقه‌ی
		زمانی و بروزرسانی.
	-->
	<!-- نشانِ آکادمی، خیلی کم‌رنگ، پشتِ همه‌چیز. شکلش از ماسکِ CSS
	     می‌آید و رنگش از تمِ کاربر - جزئیاتش در app.css. -->
	<div class="brandmark" aria-hidden="true"></div>

	<div class="shell">
		<header class="bar">
			<span class="mark" aria-label="آکادمی سبحان صمدی">صمدی</span>
			<button class="zone" type="button" id="btnZone">
				<span id="zoneName">تهران</span>
				<span class="zone-off n" id="zoneOff">GMT+3:30</span>
			</button>
			<span class="bar-gap"></span>
			<button class="ghost" type="button" id="btnRefresh" aria-label="بروزرسانی">
				<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
					stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="M21 12a9 9 0 1 1-2.64-6.36" />
					<path d="M21 3v6h-6" />
				</svg>
			</button>
		</header>

		<main id="stage" class="stage"></main>

		<!--
			داک به‌جای تب.

			تبِ بالای صفحه در گوشیِ بلند با شست نمی‌رسد. این نوار پایین
			می‌نشیند، از لبه‌ی امنِ دستگاه فاصله می‌گیرد، و نشانگرش زیرِ
			گزینه‌ی فعال می‌لغزد به‌جای اینکه بپرد.
		-->
		<nav class="dock" role="tablist" aria-label="بخش‌ها">
			<span class="dock-pill" id="dockPill" aria-hidden="true"></span>
			<button role="tab" id="navNow" aria-selected="true">
				<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
					stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
					<circle cx="12" cy="12" r="8.5" />
					<path d="M12 7.5V12l3 1.8" />
				</svg>
				<span>اکنون</span>
			</button>
			<button role="tab" id="navCal" aria-selected="false">
				<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
					stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
					<rect x="4" y="6" width="16" height="14" rx="2.5" />
					<path d="M4 10.5h16M8.5 4v3.5M15.5 4v3.5" />
				</svg>
				<span>تقویم</span>
			</button>
			<button role="tab" id="navMe" aria-selected="false">
				<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
					stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
					<path d="M4 7h9M18.5 7H20M4 12h3.5M13 12h7M4 17h8M17.5 17H20" />
					<circle cx="15.5" cy="7" r="2.1" />
					<circle cx="10" cy="12" r="2.1" />
					<circle cx="14.5" cy="17" r="2.1" />
				</svg>
				<span>تنظیمات</span>
			</button>
		</nav>
	</div>

	<!--
		ورقِ پایین: جزئیاتِ سشن، انتخابِ منطقه، و هر چیزی که نباید جای
		همیشگی روی صفحه بگیرد. یک نمونه است نه چند تا، چون هم‌زمان بیش از
		یکی باز نمی‌شود.
	-->
	<div class="scrim" id="scrim" hidden></div>
	<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
		<span class="sheet-grab" aria-hidden="true"></span>
		<header class="sheet-bar">
			<h2 id="sheetTitle"></h2>
			<button class="ghost" type="button" id="sheetClose" aria-label="بستن">
				<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
					stroke-width="2" stroke-linecap="round" aria-hidden="true">
					<path d="M6 6l12 12M18 6L6 18" />
				</svg>
			</button>
		</header>
		<div class="sheet-body" id="sheetBody"></div>
	</section>

	<script>
		<!-- build:js -->
	</script>
	<!-- Printed so a stale copy can be identified at a glance: the WebView
	     caches this page and the URL is otherwise constant. Written by
	     scripts/build-econ-app.mjs. -->
	<span class="build" hidden>نسخه <!-- build:version --></span>
</body>

</html>
