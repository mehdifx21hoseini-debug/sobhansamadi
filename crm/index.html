<!doctype html>
<html class="no-js" lang="fa" dir="rtl">

<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<title>CRM آکادمی — لیدهای مشاوره</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
	<link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
	<link rel="stylesheet" href="assets/nozha-main.css">
	<link rel="stylesheet" href="assets/app.css">
</head>

<body>

	<div class="app-shell">

		<aside class="app-sidebar">
			<div class="sidebar-brand">
				<div class="sidebar-brand-icon"><i class="fas fa-graduation-cap"></i></div>
				<div class="sidebar-brand-text">
					<span class="sidebar-brand-title">CRM آکادمی</span>
					<span class="sidebar-brand-sub">مدیریت لیدهای مشاوره</span>
				</div>
			</div>

			<nav class="sidebar-nav">
				<a href="index.html" class="sidebar-link active">
					<i class="fas fa-address-book"></i><span>لیدهای مشاوره</span>
				</a>
			</nav>

			<div class="sidebar-user">
				<div class="sidebar-user-avatar">م.ف</div>
				<div class="sidebar-user-info">
					<span class="sidebar-user-name">مشاور فروش</span>
					<span class="sidebar-user-role">پشتیبان مجموعه</span>
				</div>
				<button class="sidebar-user-logout" title="خروج"><i class="fas fa-sign-out-alt"></i></button>
			</div>
		</aside>

		<div class="app-main">
			<header class="app-topbar">
				<div class="breadcrumb-nav">
					<i class="fas fa-home"></i>
					<span class="breadcrumb-sep">/</span>
					<span class="breadcrumb-current">لیدهای مشاوره</span>
				</div>
				<div class="topbar-search">
					<i class="fas fa-search"></i>
					<input type="text" id="searchInput" placeholder="جستجوی نام یا شماره...">
				</div>
			</header>

			<main class="app-content">

				<div class="page-title-row">
					<div>
						<h1>لیدهای مشاوره</h1>
						<p>افرادی که از طریق ربات تلگرام درخواست مشاوره ثبت کرده‌اند</p>
					</div>
					<button class="btn btn-accent btn-sm" id="exportBtn">
						<i class="fas fa-file-download ml-1"></i>خروجی Excel
					</button>
				</div>

				<div class="stat-grid">
					<div class="stat-card">
						<div class="stat-icon tone-blue"><i class="fas fa-users"></i></div>
						<div>
							<div class="stat-value" id="stat-total">0</div>
							<div class="stat-label">کل لیدها</div>
						</div>
					</div>
					<div class="stat-card">
						<div class="stat-icon tone-amber"><i class="fas fa-clock"></i></div>
						<div>
							<div class="stat-value" id="stat-pending">0</div>
							<div class="stat-label">پاسخ‌داده‌نشده</div>
						</div>
					</div>
					<div class="stat-card">
						<div class="stat-icon tone-emerald"><i class="fas fa-phone"></i></div>
						<div>
							<div class="stat-value" id="stat-called">0</div>
							<div class="stat-label">تماس گرفته شد</div>
						</div>
					</div>
					<div class="stat-card">
						<div class="stat-icon tone-rose"><i class="fas fa-phone-slash"></i></div>
						<div>
							<div class="stat-value" id="stat-noanswer">0</div>
							<div class="stat-label">پاسخ نداد</div>
						</div>
					</div>
				</div>

				<div class="panel">
					<div class="panel-toolbar">
						<div class="filter-tabs" id="filterTabs">
							<button class="filter-tab active" data-status="همه">همه</button>
							<button class="filter-tab" data-status="پاسخ‌داده‌نشده">پاسخ‌داده‌نشده</button>
							<button class="filter-tab" data-status="تماس گرفته شد">تماس گرفته شد</button>
							<button class="filter-tab" data-status="پاسخ نداد">پاسخ نداد</button>
						</div>
					</div>

					<div class="table-responsive">
						<table class="data-table">
							<thead>
								<tr>
									<th>نام</th>
									<th>شماره تماس</th>
									<th>سطح علمی</th>
									<th>ساعت مناسب تماس</th>
									<th>وضعیت</th>
									<th>ثبت‌شده</th>
								</tr>
							</thead>
							<tbody id="leadsTableBody"></tbody>
						</table>
					</div>
				</div>

			</main>
		</div>
	</div>

	<script src="assets/vendor/jquery.min.js"></script>
	<script src="js/data.js"></script>
	<script src="js/app.js"></script>
</body>

</html>
