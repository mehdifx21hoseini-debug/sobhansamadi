<!doctype html>
<html class="no-js rtl" lang="fa" dir="rtl">

<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<title>CRM آکادمی — لیدهای مشاوره</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
	<link rel="stylesheet" href="assets/vendor/bootstrap-material-design.min.css">
	<link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
	<link rel="stylesheet" href="assets/nozha-main.css">
	<link rel="stylesheet" href="assets/app.css">
</head>

<body>

	<div class="bmd-layout-container bmd-drawer-f-l avam-container bmd-drawer-in">
		<header class="bmd-layout-header">
			<div class="navbar navbar-light bg-faded">
				<button class="navbar-toggler" type="button" data-toggle="drawer" data-target="#dw-s1">
					<span class="navbar-toggler-icon"></span>
				</button>
				<ul class="nav navbar-nav">
					<li class="nav-item">
						<div class="dropdown">
							<button class="btn dropdown-toggle m-0" type="button" id="userMenu" data-toggle="dropdown"
								aria-haspopup="true" aria-expanded="false">
								<i class="far fa-user-circle fa-lg ml-1"></i> مشاور فروش
							</button>
							<div class="dropdown-menu dropdown-menu-right" aria-labelledby="userMenu">
								<span class="dropdown-item dropdown-header">پشتیبان مجموعه</span>
								<div class="dropdown-divider"></div>
								<button class="dropdown-item" type="button"><i
										class="fas fa-sign-out-alt fa-sm c-main mr-2"></i>خروج</button>
							</div>
						</div>
					</li>
				</ul>
			</div>
		</header>

		<div id="dw-s1" class="bmd-layout-drawer bg-faded">
			<div class="container-fluid side-bar-container">
				<header class="pb-0">
					<a class="navbar-brand" href="index.html">
						<div class="brand-logo">
							<i class="fas fa-graduation-cap"></i>
							<span>CRM آکادمی</span>
						</div>
					</a>
				</header>
				<p class="side-comment">منو</p>
				<ul class="side a-collapse">
					<div class="side-item-container">
						<li class="side-item selected"><a href="index.html"><i
									class="fas fa-users mr-2"></i>لیدهای مشاوره</a></li>
					</div>
				</ul>
			</div>
		</div>

		<main class="bmd-layout-content">
			<div class="container-fluid">

				<div class="row m-1 pb-4 mb-2">
					<div class="col-12 p-2">
						<div class="page-header breadcrumb-header">
							<div class="row align-items-end">
								<div class="col-lg-8">
									<div class="page-header-title text-left-rtl">
										<h3 class="lite-text">لیدهای مشاوره</h3>
										<span class="lite-text text-gray">افرادی که از طریق ربات تلگرام درخواست
											مشاوره ثبت کرده‌اند</span>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

				<div class="row m-1 mb-2">
					<div class="col-xl-3 col-md-6 col-sm-6 p-2">
						<div class="box-card mini">
							<i class="fas fa-users b-first" aria-hidden="true"></i>
							<span class="c-first">کل لیدها</span>
							<span id="stat-total">0</span>
						</div>
					</div>
					<div class="col-xl-3 col-md-6 col-sm-6 p-2">
						<div class="box-card mini">
							<i class="fas fa-clock b-second" aria-hidden="true"></i>
							<span class="c-second">پاسخ‌داده‌نشده</span>
							<span id="stat-pending">0</span>
						</div>
					</div>
					<div class="col-xl-3 col-md-6 col-sm-6 p-2">
						<div class="box-card mini">
							<i class="fas fa-phone b-third" aria-hidden="true"></i>
							<span class="c-third">تماس گرفته شد</span>
							<span id="stat-called">0</span>
						</div>
					</div>
					<div class="col-xl-3 col-md-6 col-sm-6 p-2">
						<div class="box-card mini">
							<i class="fas fa-phone-slash b-forth" aria-hidden="true"></i>
							<span class="c-forth">پاسخ نداد</span>
							<span id="stat-noanswer">0</span>
						</div>
					</div>
				</div>

				<div class="row m-1">
					<div class="col-12 p-2">
						<div class="card shade">
							<div class="card-body">

								<div class="toolbar-row">
									<div class="filter-tabs" id="filterTabs">
										<button class="filter-tab active" data-status="همه">همه</button>
										<button class="filter-tab" data-status="پاسخ‌داده‌نشده">پاسخ‌داده‌نشده</button>
										<button class="filter-tab" data-status="تماس گرفته شد">تماس گرفته شد</button>
										<button class="filter-tab" data-status="پاسخ نداد">پاسخ نداد</button>
									</div>
									<div class="toolbar-actions">
										<input type="text" id="searchInput" class="form-control search-input"
											placeholder="جستجوی نام یا شماره...">
										<button class="btn btn-outline-secondary btn-sm" id="exportBtn">
											<i class="fas fa-file-download mr-1"></i>خروجی Excel
										</button>
									</div>
								</div>

								<hr>

								<div class="table-responsive">
									<table class="table table-striped table-hover">
										<thead>
											<tr>
												<th>نام</th>
												<th>شماره تماس</th>
												<th>سطح علمی</th>
												<th>ساعت مناسب تماس</th>
												<th>وضعیت</th>
												<th>ثبت‌شده</th>
											</tr>
										</thead>
										<tbody id="leadsTableBody"></tbody>
									</table>
								</div>

							</div>
						</div>
					</div>
				</div>

			</div>
		</main>
	</div>

	<script src="assets/vendor/jquery.min.js"></script>
	<script src="assets/vendor/popper.min.js"></script>
	<script src="assets/vendor/bootstrap-material-design.min.js"></script>
	<script>
		$(document).ready(function () { $('body').bootstrapMaterialDesign(); });
	</script>
	<script src="js/data.js"></script>
	<script src="js/app.js"></script>
</body>

</html>
