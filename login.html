<!doctype html>
<html class="no-js rtl" lang="fa" dir="rtl">

<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<title>ورود — CRM آکادمی</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
	<link rel="stylesheet" href="assets/vendor/bootstrap-material-design.min.css">
	<link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
	<link rel="stylesheet" href="assets/nozha-main.css">
	<link rel="stylesheet" href="assets/app.css">
</head>

<body>
	<script>document.body.className = localStorage.getItem("crmTheme") === "dark" ? "dark" : "";</script>

	<div class="login-page">
		<div class="login-card card shade animate-in">
			<div class="card-body">
				<img src="assets/img/logo.png" alt="آکادمی سبحان صمدی" class="login-logo">
				<h5 class="login-title">ورود به سیستم</h5>
				<p class="login-subtitle">CRM آکادمی سبحان صمدی</p>
				<form id="loginForm">
					<div class="login-field">
						<input type="text" id="usernameInput" autocomplete="username" placeholder="نام کاربری" autofocus>
						<i class="far fa-user"></i>
					</div>
					<div class="login-field">
						<input type="password" id="passwordInput" autocomplete="current-password" placeholder="رمز عبور">
						<i class="fas fa-lock"></i>
					</div>
					<div id="loginError" class="text-danger text-sm mb-2 d-none">نام کاربری یا رمز عبور اشتباه است.</div>
					<button type="submit" class="btn btn-brand btn-block" id="btnLogin">ورود</button>
				</form>
			</div>
		</div>
	</div>

	<script src="assets/vendor/jquery.min.js"></script>
	<script>
		var API_BASE = "https://96825.7host.cloud/webhook";

		document.getElementById("loginForm").addEventListener("submit", function (e) {
			e.preventDefault();
			var username = document.getElementById("usernameInput").value.trim();
			var password = document.getElementById("passwordInput").value;
			var $btn = document.getElementById("btnLogin");
			var $error = document.getElementById("loginError");
			$error.classList.add("d-none");
			$btn.disabled = true;
			$btn.textContent = "در حال بررسی...";

			fetch(API_BASE + "/crm/auth/login", {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify({ username: username, password: password })
			})
				.then(function (res) { return res.json(); })
				.then(function (data) {
					if (data && data.success) {
						sessionStorage.setItem("crmAuthed", "1");
						window.location.href = "index.html";
					} else {
						$error.classList.remove("d-none");
					}
				})
				.catch(function () {
					$error.textContent = "خطا در برقراری ارتباط با سرور. دوباره تلاش کنید.";
					$error.classList.remove("d-none");
				})
				.finally(function () {
					$btn.disabled = false;
					$btn.textContent = "ورود";
				});
		});
	</script>
</body>

</html>
