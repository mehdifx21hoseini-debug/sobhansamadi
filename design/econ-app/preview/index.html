<!doctype html>
<html lang="fa" dir="rtl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>داشبورد بازار — آکادمی سبحان صمدی</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
	<style>/* build:css */</style>
</head>
<body>
	<div class="shell">

		<!-- سطح ۱ — وضعیت بازار و ساعت -->
		<header class="status">
			<div class="status-l">
				<div class="brand">آکادمی سبحان صمدی</div>
				<div class="state"><span id="led" class="led off"></span><span id="stateText">—</span></div>
				<div class="next-up" id="nextUp">—</div>
			</div>
			<div class="clock">
				<div class="t mono" id="clockT">—</div>
				<div class="z">به وقت تهران</div>
			</div>
		</header>

		<nav class="nav">
			<button aria-selected="true">خانه</button>
			<button aria-selected="false">این هفته</button>
		</nav>

		<div class="rotate-hint">برای نمای کامل بازارها، گوشی را بچرخانید</div>

		<div class="split">
			<div>
				<!-- سطح ۲ — تایم‌لاین جهانی، قهرمان محصول -->
				<div class="tl-wrap">
					<div class="tl-head">
						<h2>سشن‌های جهانی</h2>
						<div class="hint">۴ ساعت گذشته تا ۲۰ ساعت آینده</div>
					</div>
					<div class="tl">
						<div class="tl-labels">
							<div class="lab-pad"></div>
							<div class="labs" id="labs"></div>
							<div class="lab-tail"></div>
						</div>
						<div class="tl-axis">
							<svg id="map" class="tl-map" aria-hidden="true"></svg>
							<div class="ruler" id="ruler"></div>
							<div class="tracks" id="tracks"></div>
							<div class="evlane" id="evlane"></div>
							<div class="now" id="now"></div>
						</div>
					</div>
				</div>

				<!-- سطح ۲ب — خلاصه‌ی هم‌تراز سشن‌ها -->
				<div class="sessions" id="sessions"></div>
			</div>

			<div>
				<!-- سطح ۳ — رویدادهای امروز، روی همان محور زمان -->
				<div class="sec-head">
					<h2>رویدادهای امروز</h2>
					<div class="ln"></div>
					<div class="n" id="evCount">—</div>
				</div>
				<div class="events" id="events"></div>
			</div>
		</div>

	</div>
	<script>/* build:js */</script>
</body>
</html>
