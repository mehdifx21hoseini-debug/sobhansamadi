		سه نقش، سه خانواده.

		وزیرمتن هرچه فارسی است. JetBrains Mono هر عددی که خوانده می‌شود -
		ساعت، نرخ، شمارشِ معکوس. رقم‌های هم‌عرضش یعنی ستون نمی‌لرزد و

		می‌نشیند.

	-->

/* ═══════════════════════════════════════════════════════════════════
   «رصد» — سیستمِ طراحی

   جهت: یک ابزارِ رصدِ بازار، نه یک تقویمِ اقتصادی.

   سه تصمیمِ ریشه‌ای که همه‌چیز از آن‌ها می‌آید:

   ۱. یک رنگِ اکسنت، و آن رنگ فقط معنیِ «زنده» می‌دهد.
      سبز و قرمز فقط برای عدد. اهمیت هم یک نقطه‌ی رنگی دارد - قرمز،
      نارنجی، طلایی - ولی رنگش از همان نقطه بیرون نمی‌زند: عنوان،
      زمینه و عددها هیچ‌کدام رنگِ اهمیت نمی‌گیرند. چیزی که صفحه را
      شلوغ می‌کند سطحِ رنگی است، نه خودِ رنگ.

   ۲. کارت تقریباً وجود ندارد.
      جدا کردن با سطحِ زمینه و فاصله انجام می‌شود. لبه فقط جایی است
      که واقعاً چیزی را قاب می‌گیرد.

   ۳. عدد و متن دو خانواده‌اند.
      وزیرمتن برای فارسی، JetBrains Mono برای هر عددی که خوانده
      می‌شود. رقم‌های هم‌عرض یعنی ستون نمی‌لرزد.
   ═══════════════════════════════════════════════════════════════════ */

	--f-ui: Vazirmatn, -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
	/* وزیرمتن انتهای این زنجیره هست چون بعضی برچسب‌ها رقم و واژه‌ی
	   فارسی را با هم دارند - «تا 17:30»، «۲ روز 04:20» - و بدونِ آن،
	   واژه به فونتِ پیش‌فرضِ سیستم می‌افتاد. پیش از monospace می‌آید،
	   چون خانواده‌ی عام همیشه match می‌شود و هرچه بعدش بیاید خوانده
	   نمی‌شود. */

	/* نامِ لاتینِ شاخص. وزیرمتن اینجا نمی‌ماند چون گلیفِ لاتینش
	   همراهِ فارسی طراحی شده، نه برای عنوانِ فنیِ انگلیسی. اگر عنوان
	   فارسی بود - وقتی en خالی است - همان وزیرمتنِ فالبک می‌گیردش. */
	--f-en: "IBM Plex Sans", Vazirmatn, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

	/* ── سطح‌ها ─────────────────────────────────────────────────────
	   خنثای گرم با انحرافِ خیلی کمِ سبز-آبی به سمتِ اکسنت. خاکسترِ
	   کاملاً خنثی بی‌تصمیم به‌نظر می‌رسد. */
	--bg: #f4f5f4;
	--s1: #ffffff;
	--s2: #eceeed;
	--s3: #e2e5e4;
	--ink: #141817;
	--text: #141817;
	--dim: #5c6663;
	--faint: #8e9694;
	--hair: rgba(20, 24, 23, .09);
	--hair-2: rgba(20, 24, 23, .16);

	/* ── اکسنت: «زنده» ────────────────────────────────────────────
	   یک رنگ، یک معنی. هیچ کنترلی، هیچ سرتیتری، هیچ دکمه‌ای این رنگ
	   را نمی‌گیرد - فقط چیزی که همین حالا در جریان است. */
	--live: #00857a;
	--live-ink: #ffffff;
	--live-wash: rgba(0, 133, 122, .1);

	/* ── عدد ──────────────────────────────────────────────────────
	   جهتِ «به نفعِ ارز»، نه بالا/پایینِ خام. */
	--up: #16785a;
	--down: #b03a3a;

	/* ── اهمیت ────────────────────────────────────────────────────
	   جدا از --up/--down عمداً: آن‌ها می‌گویند عدد به نفعِ ارز بود یا
	   نه، این‌ها می‌گویند خبر چقدر مهم است. یک قرمز برای هر دو کار،
	   دو معنیِ متفاوت را یکی نشان می‌داد. */
	--imp-3: #d64545;
	--imp-2: #e08b2e;
	--imp-1: #b8912a;

	/* ── سشن‌ها ───────────────────────────────────────────────────
	   هر بازار یک ته‌رنگ دارد تا در دیال از هم جدا شوند. اشباعشان
	   عمداً پایین است: این‌ها هویت‌اند، نه هشدار. */
	--k-sydney: #4a8f86;
	--k-tokyo: #5b74a8;
	--k-london: #7a6aa6;
	--k-newyork: #a8794a;
	--k-nyse: #a05a52;

	--r: 14px;
	--r-sm: 9px;
	--r-xs: 5px;

	/* فاصله‌ی یکسان همه‌جا. سیستمِ چهارتایی. */
	--sp-1: 4px;
	--sp-2: 8px;
	--sp-3: 12px;
	--sp-4: 16px;
	--sp-5: 24px;
	--sp-6: 32px;
	--sp-7: 48px;

	--ease: cubic-bezier(.32, .72, 0, 1);
	--lift: 0 1px 2px rgba(20, 24, 23, .04), 0 8px 24px -16px rgba(20, 24, 23, .3);

	color-scheme: light;
}

/* حالتِ تیره، طراحی‌شده نه وارونه.
   زمینه یک خنثای عمیقِ سبز-آبی است نه سیاهِ مطلق: سیاهِ مطلق روی
   OLED لبه‌ها را می‌بلعد و صفحه بی‌عمق می‌شود. */
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #000000;
		--s1: #0d100f;
		--s2: #151918;
		--s3: #1f2423;
		--ink: #e8edec;
		--text: #e8edec;
		--dim: #9aa4a2;
		--faint: #6b7573;
		--hair: rgba(232, 237, 236, .08);
		--hair-2: rgba(232, 237, 236, .15);
		--brand-gold: #d2ae6d;
		--brand-gold: #d2ae6d;
	--live: #2dd4bf;
		--live-ink: #04211e;
		--live-wash: rgba(45, 212, 191, .12);
		--up: #4ade8c;
		--down: #f87171;
		--imp-3: #f06a6a;
		--imp-2: #f0a850;
		--imp-1: #c9a83f;
		--k-sydney: #5fbfb2;
		--k-tokyo: #7d9ae0;
		--k-london: #a48cdc;
		--k-newyork: #dda76a;
		--k-nyse: #e08a80;
		--lift: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px -18px rgba(0, 0, 0, .9);
		color-scheme: dark;
	}
}

:root[data-theme="dark"] {
	--bg: #000000;
	--s1: #0d100f;
	--s2: #151918;
	--s3: #1f2423;
	--ink: #e8edec;
	--text: #e8edec;
	--dim: #9aa4a2;
	--faint: #6b7573;
	--hair: rgba(232, 237, 236, .08);
	--hair-2: rgba(232, 237, 236, .15);
	--live: #2dd4bf;
	--live-ink: #04211e;
	--live-wash: rgba(45, 212, 191, .12);
	--up: #4ade8c;
	--down: #f87171;
	--imp-3: #f06a6a;
	--imp-2: #f0a850;
	--imp-1: #c9a83f;
	--k-sydney: #5fbfb2;
	--k-tokyo: #7d9ae0;
	--k-london: #a48cdc;
	--k-newyork: #dda76a;

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

body {
	margin: 0;
	background: var(--bg);
	color: var(--text);
	font-family: var(--f-ui);
	font-size: 15px;
	line-height: 1.6;
	-webkit-font-smoothing: antialiased;
	overscroll-behavior-y: none;
}

/* هر عددی که خوانده می‌شود. هم‌عرض و همیشه چپ‌به‌راست، تا داخلِ خطِ
   فارسی وارونه نشود. */
.n {
	font-family: var(--f-num);
	font-variant-numeric: tabular-nums;
	direction: ltr;
	unicode-bidi: isolate;
	letter-spacing: -.02em;
}

.flag-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
/* ───────────────────────────────────────────────────────────────────
   نقشه‌ی جهان در پس‌زمینه

   مثلِ نشانِ برند ثابت است و با اسکرول حرکت نمی‌کند، ولی جای دیگری
   می‌نشیند: بالای صفحه، پشتِ دیال. دلیلش معنایی است نه تزئینی - دیال
   ساعتِ بازارهای جهان را نشان می‌دهد و نقشه همان جهان است.

   محو شدنِ لبه‌ها با ماسکِ گرادیانی انجام می‌شود، نه با کم کردنِ
   شفافیتِ کل: نقشه‌ی یک‌دستِ کم‌رنگ مثلِ لکه دیده می‌شود، ولی وقتی
   لبه‌ها در زمینه حل شوند، انگار از دلِ صفحه درآمده.
   ─────────────────────────────────────────────────────────────────── */
.worldmap {
	position: fixed;
	z-index: 0;
	pointer-events: none;
	inset-inline: 0;
	top: 0;
	height: 46vh;
	max-height: 380px;
	overflow: hidden;
	opacity: .07;
	-webkit-mask-image: radial-gradient(120% 95% at 50% 34%, #000 26%, transparent 72%);
	mask-image: radial-gradient(120% 95% at 50% 34%, #000 26%, transparent 72%);
}
.worldmap svg { width: 100%; height: 100%; display: block; }
.worldmap path { fill: var(--text); }


/* ───────────────────────────────────────────────────────────────────
   نشانِ برند در پس‌زمینه

   تصویر عمداً به‌شکلِ ماسک می‌آید نه عکس. لوگو دو رنگ دارد - سرمه‌ای و
   طلایی - و هر دو در حالتِ تیره روی زمینه‌ی تیره گم می‌شوند و در روشن
   لکه‌ی رنگی می‌سازند. ماسک فقط شکل را نگه می‌دارد و رنگش از توکنِ متن
   می‌آید، پس در هر دو تم درست می‌نشیند و با تمِ کاربر عوض می‌شود.

   ثابت است نه اسکرولی: با صفحه بالا و پایین نمی‌رود، پس پشتِ محتوا
   می‌ماند و حرکت نمی‌سازد. شفافیتش عمداً در مرزِ دیده‌شدن است.
   ─────────────────────────────────────────────────────────────────── */
.brandmark {
	position: fixed;
	z-index: 0;
	pointer-events: none;
	inset-inline-start: 50%;
	top: 62%;
	width: min(62vw, 330px);
	aspect-ratio: 1;
	transform: translate(50%, -50%);
	background: var(--text);
	/* پایین‌تر و کوچک‌تر از قبل: نقشه‌ی جهان حالا بالای صفحه را گرفته و
	   دو واترمارکِ هم‌اندازه روی هم فقط نویز می‌ساختند. */
	opacity: .028;
	-webkit-mask: var(--mark) center/contain no-repeat;
	mask: var(--mark) center/contain no-repeat;
}
/* روی زمینه‌ی تیره همان شفافیت کم‌رنگ‌تر دیده می‌شود، پس کمی بالاتر. */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brandmark { opacity: .045; } }
:root[data-theme="dark"] .brandmark { opacity: .045; }

/* محتوا بالای نشان. بدونِ این، نشان روی متن می‌افتد. */
.shell { position: relative; z-index: 1; }


/* ───────────────────────────────────────────────────────────────────
   چیدمان
   ─────────────────────────────────────────────────────────────────── */

.shell {
	min-height: 100%;
	max-width: 520px;
	margin: 0 auto;
	padding-inline: var(--sp-4);
	/* داکِ شناور نباید روی آخرین ردیف بیفتد. */
	padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
}

.bar {
	display: flex;
	align-items: center;
	gap: var(--sp-3);
	height: 56px;
	padding-top: env(safe-area-inset-top, 0px);
	box-sizing: content-box;
	position: relative;
}
/* خطِ زیرِ هدر: طلایی در سمتِ برند و محوشونده به سمتِ دیگر.
   یک خطِ تخت، نوار را به یک جداکننده‌ی معمولی تبدیل می‌کرد؛ این یکی
   وزنش را از همان‌جایی می‌گیرد که نشان نشسته. */
.bar::after {
	content: "";
	position: absolute;
	inset-inline: 0;
	bottom: 0;
	height: 1px;
	background: linear-gradient(to left,
		color-mix(in srgb, var(--brand-gold) 55%, transparent),
		var(--hair) 42%, transparent);
}
.bar-gap { flex: 1; }

/* برند: نشان + نامِ کامل، بدونِ جعبه.
   چیپِ خاکستریِ قبلی زمینه داشت و به‌همین خاطر سنگین‌تر از نقشش
   دیده می‌شد. حالا وزن از خودِ نشان می‌آید نه از یک مستطیلِ پررنگ.
   نام دو سطری است تا در ۵۶ پیکسلِ نوار جا شود و جای منطقه‌ی زمانی را
   نگیرد: «آکادمی» ریز و طلایی، «سبحان صمدی» زیرش با وزنِ بیشتر. */
.brand { display: flex; align-items: center; gap: 7px; flex: none; }
.brand-i {
	width: 22px;
	height: 22px;
	flex: none;
	/* همان ماسکی که پس‌زمینه هم از آن می‌خواند - شکل یک بار در فایل
	   است. رنگش طلاییِ برند، که در هر دو تم روی زمینه می‌نشیند؛ خودِ
	   سرمه‌ای روی زمینه‌ی تیره تقریباً نامرئی می‌شد. */
	background: var(--brand-gold);
	-webkit-mask: var(--mark) center/contain no-repeat;
	mask: var(--mark) center/contain no-repeat;
}
/* نامِ کامل در یک خط. «آکادمی» به رنگِ برند، «سبحان صمدی» به رنگِ متن
   - همان تقسیمی که در خودِ لوگو هست: طلایی دورِ سرمه‌ای. */
.brand-n {
	font-size: 13px;
	font-weight: 700;
	line-height: 1.2;
	letter-spacing: -.015em;
	color: var(--text);
	white-space: nowrap;
}
.brand-n b { font-weight: 700; color: var(--brand-gold); }

.zone {
	appearance: none;
	border: 0;
	background: none;
	font-family: inherit;
	color: var(--dim);
	font-size: 12.5px;
	font-weight: 600;
	display: flex;
	align-items: baseline;
	gap: 6px;
	padding: 6px 2px;
	cursor: pointer;
}
.zone-off { font-size: 11px; opacity: .75; }

/* نوارِ بالا در عرض‌های خیلی باریک.
   تلگرامِ دسکتاپ پنجره‌ی مینی‌اپ را تا حدودِ ۳۰۰ پیکسل هم باریک
   می‌کند و آنجا برند + منطقه + بروزرسانی جا نمی‌شدند: دکمه‌ی
   بروزرسانی از لبه بیرون می‌زد. اول اختلافِ ساعت کنار می‌رود - که
   حالا زیرِ تراشه‌ها هم نوشته می‌شود - و اگر باز کم بیاید، نامِ برند
   کوتاه می‌شود نه اینکه چیزی از صفحه بیفتد. */
.bar > * { min-width: 0; }
@media (max-width: 359px) { .zone-off { display: none; } }
@media (max-width: 319px) {
	.brand-n { overflow: hidden; text-overflow: ellipsis; }
}

.ghost {
	appearance: none;
	width: 38px;
	height: 38px;
	display: grid;
	place-items: center;
	border: 0;
	border-radius: 50%;
	background: none;
	color: var(--dim);
	cursor: pointer;
	transition: background .18s var(--ease), color .18s var(--ease);
}
.ghost:active { background: var(--s2); color: var(--text); }
.ghost.is-busy svg { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(-360deg); } }

.stage { display: block; }

/* ───────────────────────────────────────────────────────────────────
   داک — ناوبریِ شست
   ─────────────────────────────────────────────────────────────────── */

.dock {
	position: fixed;
	inset-inline: 0;
	bottom: calc(12px + env(safe-area-inset-bottom, 0px));
	z-index: 40;
	width: min(360px, calc(100% - 32px));
	margin: 0 auto;
	display: grid;
	grid-template-columns: repeat(3, 1fr);
	padding: 5px;
	border-radius: 999px;
	background: var(--s1);
	border: 1px solid var(--hair);
	box-shadow: var(--lift);
	/* نشانگر زیرِ دکمه‌ها می‌لغزد. */
	position: fixed;
}
.dock-pill {
	position: absolute;
	top: 5px;
	bottom: 5px;
	width: calc((100% - 10px) / 3);
	border-radius: 999px;
	background: var(--s3);
	transition: transform .34s var(--ease);
	pointer-events: none;
}
.dock button {
	position: relative;
	appearance: none;
	border: 0;
	background: none;
	font-family: inherit;
	color: var(--faint);
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 2px;
	padding: 7px 0 6px;
	font-size: 10.5px;
	font-weight: 600;
	cursor: pointer;
	border-radius: 999px;
	transition: color .22s var(--ease);
	/* هدفِ لمسی: کمتر از این با شست خطا می‌خورد. */
	min-height: 48px;
	justify-content: center;
}
.dock button[aria-selected="true"] { color: var(--text); }
.dock button svg { transition: transform .28s var(--ease); }
.dock button[aria-selected="true"] svg { transform: translateY(-1px); }

/* ───────────────────────────────────────────────────────────────────
   بلوکِ «اکنون» — دیالِ ۲۴ ساعته
   ─────────────────────────────────────────────────────────────────── */

.now {
	position: relative;
	display: grid;
	place-items: center;
	padding: var(--sp-3) 0 var(--sp-5);
	/* اندازه‌ی دیال یک بار اینجا تعریف می‌شود و هرچه رویش می‌نشیند از
	   همین می‌خواند. تا امروز دیال با min(272px, 74vw) کوچک می‌شد ولی
	   ساعتِ وسطش روی ۴۰ پیکسلِ ثابت مانده بود - در پنجره‌ی باریکِ
	   تلگرامِ دسکتاپ، دیال جمع می‌شد و ساعت همان‌جا می‌ماند و روی
	   کمان‌ها می‌افتاد. */
	--dial: min(272px, 74vw);
}
.dial { width: var(--dial); height: auto; display: block; overflow: visible; }
.dial-ring { fill: none; stroke: var(--hair); stroke-width: 1; }
.dial-tick { stroke: var(--hair-2); stroke-width: 1; }
.dial-hour {
	font-family: var(--f-num);
	font-size: 8.5px;
	fill: var(--faint);
	text-anchor: middle;
	dominant-baseline: middle;
}
.dial-arc { fill: none; stroke-linecap: round; opacity: .34; transition: opacity .3s var(--ease); }
.dial-arc.is-open { opacity: 1; }
.dial-hand { stroke: var(--live); stroke-width: 1.5; stroke-linecap: round; }
.dial-dot { fill: var(--live); }
/* رویدادها روی حلقه‌ی بیرونی: هر خبر یک خط‌چه، و هرچه مهم‌تر بلندتر.
   اهمیت با اندازه گفته می‌شود نه با رنگ. */
.dial-ev { stroke: var(--faint); stroke-linecap: round; }
.dial-ev.is-high { stroke: var(--text); }
.dial-ev.is-done { opacity: .3; }

/* خوانشِ مرکزِ دیال */
.now-read {
	position: absolute;
	inset: 0;
	display: grid;
	place-content: center;
	justify-items: center;
	text-align: center;
	pointer-events: none;
}
.now-time {
	font-family: var(--f-num);
	font-size: calc(var(--dial) * .13);
	font-weight: 500;
	line-height: 1;
	letter-spacing: -.04em;
}
.now-state {
	margin-top: var(--sp-2);
	font-size: calc(var(--dial) * .04);
	font-weight: 700;
	letter-spacing: .06em;
	color: var(--live);
	display: flex;
	align-items: center;
	gap: 6px;
}
.now-state::before {
	content: "";
	width: 6px;
	height: 6px;
	border-radius: 50%;
	background: var(--live);
	animation: breathe 2.6s var(--ease) infinite;
}
.now-state.is-shut { color: var(--faint); }
.now-state.is-shut::before { background: var(--faint); animation: none; }
@keyframes breathe { 50% { opacity: .3; } }

/* یک جمله زیرِ دیال، به‌جای پنج ردیفِ نوار. */
.now-line {
	margin-top: var(--sp-4);
	text-align: center;
	font-size: 13px;
	color: var(--dim);
	line-height: 1.85;
	max-width: 30ch;
}
.now-line b { color: var(--text); font-weight: 600; }

/* لژِ سشن‌ها: نقطه‌های رنگی با نام، زیرِ دیال. کلیک‌شان ورق را باز
   می‌کند. این جای «پنج ردیفِ نواری» را گرفته. */
/* شبکه، نه wrapِ وسط‌چین.
   پنج تراشه با نام‌های نابرابر در wrap به ۳+۲ می‌شکستند و لبه‌ها
   دندانه‌دار می‌شد. اینجا دو ستونِ هم‌عرض است و تراشه‌ی تنهای آخر کلِ
   ردیف را می‌گیرد - یعنی چیدمان عمدی به‌نظر می‌رسد، نه شکسته. */
.lede {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: var(--sp-2);
	margin-top: var(--sp-4);
}
.lede button:last-child:nth-child(odd) { grid-column: 1 / -1; }
.lede button {
	appearance: none;
	border: 1px solid var(--hair);
	background: var(--s1);
	font-family: inherit;
	color: var(--dim);
	font-size: 11.5px;
	font-weight: 600;
	border-radius: 999px;
	padding: 6px 11px;
	display: flex;
	align-items: center;
	gap: 6px;
	cursor: pointer;
	min-height: 40px;
	min-width: 0;
	/* بدونِ این، «بورس نیویورک» دو خطی می‌شد و کلِ ردیفِ شبکه را بلند
	   می‌کرد - یعنی دو تراشه‌ی کنارِ هم دو ارتفاعِ متفاوت می‌گرفتند. */
	white-space: nowrap;
}
/* نام فضای باقی‌مانده را می‌گیرد و ساعت به لبه می‌چسبد، پس ساعت‌ها در
   هر دو ستون زیرِ هم می‌افتند. */
.lede button > span:nth-child(2) { flex: 1; min-width: 0; text-align: start; }
.lede button .kdot { width: 7px; height: 7px; border-radius: 50%; background: var(--k); }
.lede button.is-open { color: var(--text); border-color: var(--hair-2); }
.lede button.is-open .kdot { box-shadow: 0 0 0 3px color-mix(in srgb, var(--k) 22%, transparent); }
.lede button.is-hol { opacity: .55; }
/* ساعتِ تراشه. رقمِ لاتینِ مونو تا با ساعتِ بالای صفحه و برچسبِ زمانِ
   گره یک زبان بماند؛ نازک‌تر از نام، چون جوابِ دوم است نه اول. */
.lede button .kt {
	flex: none;
	font-family: var(--f-num);
	font-size: 10.5px;
	font-weight: 500;
	color: var(--faint);
	padding-inline-start: 7px;
	border-inline-start: 1px solid var(--hair);
	/* بدونِ direction: ltr. متن اینجا گاهی «تا 17:30» است - فارسی و
	   رقم با هم - و راست‌به‌چپ بودنِ ظرف همان چیزی است که ترتیبش را
	   درست نگه می‌دارد. isolate فقط از متنِ بغل جدایش می‌کند. */
	unicode-bidi: isolate;
}
.lede button.is-open .kt { color: var(--live); }

/* «ساعت‌ها به وقتِ …» زیرِ تراشه‌ها.
   دکمه است نه برچسب: همان‌جایی که کاربر متوجه می‌شود ساعت‌ها به وقتِ
   کجاست، همان‌جا هم باید بتواند عوضش کند. ظاهرش عمداً سبک است تا با
   خودِ ساعت‌ها رقابت نکند. */
.tz-note {
	display: block;
	margin: var(--sp-3) auto 0;
	appearance: none;
	border: 0;
	background: none;
	font-family: inherit;
	font-size: 11.5px;
	color: var(--faint);
	padding: 6px 8px;
	cursor: pointer;
	min-height: 32px;
}
.tz-note b { color: var(--dim); font-weight: 600; }
.tz-note .n { font-size: 10.5px; }
.tz-note:active { color: var(--dim); }

/* ───────────────────────────────────────────────────────────────────
   بلوکِ «رویدادِ بعدی»
   ─────────────────────────────────────────────────────────────────── */

.upnext {
	margin-top: var(--sp-5);
	padding: var(--sp-4);
	border-radius: var(--r);
	background: var(--s1);
	border: 1px solid var(--hair);
}
.upnext-k {
	font-size: 10px;
	font-weight: 700;
	letter-spacing: .12em;
	color: var(--faint);
}
.upnext-cd {
	font-family: var(--f-num);
	font-size: 30px;
	font-weight: 500;
	line-height: 1.1;
	letter-spacing: -.03em;
	margin-top: var(--sp-1);
	color: var(--live);
	transition: font-weight .2s var(--ease);
}
/* دقیقه‌ی آخر: وزن بالا می‌رود و یک نفسِ خیلی کند می‌گیرد.
   رنگ عوض نمی‌شود چون همین حالا هم --live است؛ چیزی که اضافه می‌شود
   حرکت است، و حرکت تنها چیزی است که چشم در حاشیه‌ی دید می‌گیرد. */
.upnext-cd.is-hot { font-weight: 700; animation: breathe 2s var(--ease) infinite; }
@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .62; } }
@media (prefers-reduced-motion: reduce) {
	.upnext-cd.is-hot { animation: none; }
}
.upnext-name {
	margin-top: var(--sp-2);
	font-family: var(--f-en);
	font-size: 15.5px;
	font-weight: 600;
	line-height: 1.35;
	letter-spacing: -.011em;
	direction: ltr;
	text-align: start;
	unicode-bidi: isolate;
}
.upnext-fa { font-size: 12.5px; color: var(--dim); margin-top: 1px; }
.upnext-meta {
	margin-top: var(--sp-3);
	padding-top: var(--sp-3);
	border-top: 1px solid var(--hair);
	display: flex;
	align-items: center;
	gap: var(--sp-2);
	font-size: 12px;
	color: var(--dim);
}

/* ───────────────────────────────────────────────────────────────────
   جریانِ رویدادها — گره روی یک خطِ زمان
   ─────────────────────────────────────────────────────────────────── */

.sec-h {
	display: flex;
	align-items: baseline;
	justify-content: space-between;
	gap: var(--sp-3);
	margin: var(--sp-6) 0 var(--sp-3);
}
.sec-h h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .01em; }
.sec-h .aside { font-size: 11px; color: var(--faint); font-weight: 600; }

 /* هندسه‌ی جریان، در یک جا.
   ستونِ ساعت از صفر تا ۳۸، خطِ زمان روی ۴۴، و متنِ خبر از ۶۴ شروع
   می‌شود. اولین بار ساعت و گره روی هم افتادند («۱۷●۳۰») چون هر دو
   داخلِ همان ۵۸ پیکسل بودند - این سه عدد باید با هم خوانده شوند. */
.stream { position: relative; padding-inline-start: 64px; }
/* خطِ زمان. یک خط برای همه‌ی گره‌ها، نه یکی برای هر کدام. */
.stream::before {
	content: "";
	position: absolute;
	inset-inline-start: 44px;
	top: 6px;
	bottom: 6px;
	width: 1px;
	background: var(--hair-2);
}

.node { position: relative; padding: var(--sp-3) 0; }
.node + .node { border-top: 1px solid var(--hair); }
/* ساعتِ گره، بیرونِ خط. */
/* ساعتِ گره، بیرونِ خط.
   عمداً direction روی خودِ این عنصر ست نمی‌شود: خصوصیت‌های منطقیِ
   موقعیت (inset-inline-start) با جهتِ *خودِ عنصر* حل می‌شوند، نه با
   جهتِ صفحه. با direction:ltr اینجا، inset-inline-start به left تبدیل
   می‌شد و ساعت ۴۲ پیکسل بیرونِ صفحه می‌افتاد.

   خودِ «۱۷:۳۰» بدونِ آن هم درست خوانده می‌شود: رقم‌ها قویِ چپ‌به‌راست‌اند
   و دونقطه بینشان خنثی می‌ماند. isolate برای جدا نگه داشتن از متنِ
   دورش کافی است. */
.node-t {
	position: absolute;
	inset-inline-start: -64px;
	top: calc(var(--sp-3) + 1px);
	width: 38px;
	text-align: center;
	font-family: var(--f-num);
	font-size: 12.5px;
	font-weight: 500;
	color: var(--dim);
	unicode-bidi: isolate;
}
/* گرهِ روی خط. اندازه‌اش اهمیت را می‌گوید - نه رنگش. */
.node::after {
	content: "";
	position: absolute;
	inset-inline-start: -23.5px;
	top: calc(var(--sp-3) + 6px);
	width: 7px;
	height: 7px;
	border-radius: 50%;
	background: var(--s3);
	box-shadow: 0 0 0 3px var(--bg);
}
.node.imp-medium::after { width: 9px; height: 9px; inset-inline-start: -24.5px; background: var(--dim); }
.node.imp-high::after {
	width: 11px;
	height: 11px;
	inset-inline-start: -25.5px;
	top: calc(var(--sp-3) + 4px);
	background: var(--text);
}
.node.is-done::after { background: var(--s3); }
.node.is-live::after { background: var(--live); box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--live-wash); }

.node-head {
	appearance: none;
	border: 0;
	background: none;
	padding: 0;
	width: 100%;
	text-align: start;
	font-family: inherit;
	color: inherit;
	cursor: pointer;
	display: block;
}
.node-top { display: flex; align-items: center; gap: var(--sp-2); }
.node-cur {
	font-family: var(--f-num);
	font-size: 10.5px;
	font-weight: 500;
	letter-spacing: .06em;
	color: var(--faint);
}
.node-gap { flex: 1; }
/* جای پرچم و کدِ ارزِ تکراری. هم‌عرضِ همان دوتا - ۱۸ پرچم + ۸ فاصله +
   حدودِ ۲۶ کد - تا نقطه‌ی اهمیت و عنوان‌ها زیرِ هم بمانند و فهرست
   دندانه‌دار نشود. متنِ داخلش فقط برای صفحه‌خوان است. */
.node-cur-echo { flex: none; width: 52px; height: 12px; }
.sr {
	color: transparent;
	font-size: 1px;
	line-height: 1;
	overflow: hidden;
	user-select: none;
}

/* نشانِ اهمیت: یک نقطه‌ی رنگی.
   کوچک می‌ماند و رنگ فقط همین‌جاست. هاله‌ی خیلی کم‌رنگِ دورش کارِ
   جدا کردنِ نقطه از هر زمینه‌ای را می‌کند بی‌آنکه لکه‌ی رنگی بسازد. */
.sig {
	display: inline-block;
	flex: none;
	width: 8px;
	height: 8px;
	border-radius: 50%;
	background: var(--imp-1);
}
.sig.lv-2 { background: var(--imp-2); box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--imp-2) 15%, transparent); }
.sig.lv-3 { background: var(--imp-3); box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--imp-3) 18%, transparent); }
/* خبرِ گذشته کم‌رنگ می‌شود - .node.is-done روی کلِ گره opacity
   می‌گذارد، ولی نقطه‌ی قرمز آن‌قدر قوی است که همچنان جلب‌توجه کند. */
.node.is-done .sig { opacity: .55; box-shadow: none; }
.node-tag { font-size: 10.5px; font-weight: 600; color: var(--faint); }
.node-tag.is-live { color: var(--live); }

/* عنوان: اهمیت با اندازه و وزن. خبرِ مهم بزرگ‌تر است، نه قرمزتر. */
.node-name {
	margin-top: 3px;
	font-family: var(--f-en);
	font-size: 14.5px;
	font-weight: 450;
	line-height: 1.35;
	letter-spacing: -.006em;
	direction: ltr;
	text-align: start;
	unicode-bidi: isolate;
	overflow-wrap: anywhere;
}
.node.imp-high .node-name { font-size: 16.5px; font-weight: 600; letter-spacing: -.018em; }
.node.imp-low .node-name { font-size: 13.5px; font-weight: 400; color: var(--dim); }
.node-fa { font-size: 12px; color: var(--dim); margin-top: 1px; }
.node.is-done { opacity: .62; }
.node.is-done.has-actual { opacity: 1; }

/* نتیجه، وقتی منتشر شده: عدد بزرگ و یک اختلافِ کوچک. */
.node-out {
	margin-top: var(--sp-2);
	display: flex;
	align-items: baseline;
	gap: var(--sp-2);
}
.node-actual { font-family: var(--f-num); font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
.node-actual.is-up { color: var(--up); }
.node-actual.is-down { color: var(--down); }
.node-delta { font-family: var(--f-num); font-size: 11.5px; font-weight: 500; color: var(--faint); }
/* «مطابق پیش‌بینی» عدد نیست، جمله است.
   با فونتِ مونو هر حرفِ فارسی در یک خانه‌ی هم‌عرض می‌افتد و اتصالِ
   حروف می‌شکند - «مطا بق پیش‌بـیـنـی». فونتِ متن این را درست می‌کند. */
.node-delta.is-flat { font-family: var(--f-ui); letter-spacing: 0; }

/* ── بازشده ────────────────────────────────────────────────────── */
.node-more { overflow: hidden; }
.node-more[hidden] { display: none !important; }
.node-body {
	margin-top: var(--sp-3);
	padding: var(--sp-3);
	border-radius: var(--r-sm);
	background: var(--s2);
}

/* پیش‌بینی در برابر واقعی، به‌شکلِ یک محور - نه یک جدول.
   جدولِ سه‌ستونی همان زبانِ تقویم‌های سنتی است؛ این یکی نسبت را نشان
   می‌دهد، نه فقط سه عدد کنارِ هم. */
.gauge { position: relative; height: 34px; margin: var(--sp-2) 0 var(--sp-3); }
.gauge-rail {
	position: absolute;
	inset-inline: 0;
	top: 15px;
	height: 3px;
	border-radius: 2px;
	background: var(--s3);
}
.gauge-fill { position: absolute; top: 15px; height: 3px; border-radius: 2px; background: var(--dim); }
.gauge-fill.is-up { background: var(--up); }
.gauge-fill.is-down { background: var(--down); }
.gauge-pin {
	position: absolute;
	top: 9px;
	width: 2px;
	height: 15px;
	border-radius: 1px;
	background: var(--faint);
}
.gauge-lab {
	position: absolute;
	top: 0;
	transform: translateX(50%);
	font-family: var(--f-num);
	font-size: 9.5px;
	color: var(--faint);
	white-space: nowrap;
}
.gauge-val {
	position: absolute;
	bottom: 0;
	transform: translateX(50%);
	font-family: var(--f-num);
	font-size: 11px;
	font-weight: 600;
	white-space: nowrap;
}

.facts { display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-4); font-size: 11.5px; color: var(--dim); }
.facts b { font-family: var(--f-num); color: var(--text); font-weight: 600; }
.facts .rev { color: var(--faint); font-size: 10.5px; }

.effect { margin-top: var(--sp-3); font-size: 12px; line-height: 1.75; color: var(--dim); }
.effect.is-good { color: var(--up); }
.effect.is-bad { color: var(--down); }

/* تاریخچه: میله‌های ریز، بی‌محور و بی‌قاب. */
.spark { display: flex; align-items: flex-end; gap: 3px; height: 30px; margin-top: var(--sp-3); direction: ltr; }
.spark i { flex: 1; min-height: 3px; border-radius: 2px; background: var(--s3); }
.spark i.up { background: color-mix(in srgb, var(--up) 55%, transparent); }
.spark i.down { background: color-mix(in srgb, var(--down) 55%, transparent); }
.spark i:last-child { background: var(--dim); }
.spark i.up:last-child { background: var(--up); }
.spark i.down:last-child { background: var(--down); }
.spark-k { margin-top: 5px; font-size: 10px; color: var(--faint); }

/* سرصفحه‌ی روز در جریانِ چندروزه. */
.daymark {
	position: relative;
	margin: var(--sp-5) 0 var(--sp-2);
	padding-inline-start: 0;
	font-size: 12px;
	font-weight: 700;
	color: var(--dim);
	display: flex;
	align-items: baseline;
	gap: var(--sp-2);
}
.daymark .g { font-family: var(--f-num); font-size: 10.5px; color: var(--faint); font-weight: 500; }
.daymark .today { color: var(--live); font-size: 10px; letter-spacing: .08em; }

/* ───────────────────────────────────────────────────────────────────
   کنترل‌ها
   ─────────────────────────────────────────────────────────────────── */

/* کنترلِ قطعه‌ای - برای بازه و هر انتخابِ کوتاه. */
.seg {
	display: inline-flex;
	padding: 3px;
	border-radius: 999px;
	background: var(--s2);
	gap: 2px;
}
.seg button {
	appearance: none;
	border: 0;
	background: none;
	font-family: inherit;
	font-size: 12.5px;
	font-weight: 600;
	color: var(--dim);
	padding: 7px 15px;
	border-radius: 999px;
	cursor: pointer;
	min-height: 36px;
	transition: background .2s var(--ease), color .2s var(--ease);
}
.seg button[aria-pressed="true"] { background: var(--s1); color: var(--text); box-shadow: var(--lift); }

.find {
	display: flex;
	align-items: center;
	gap: var(--sp-2);
	background: var(--s2);
	border-radius: 999px;
	padding: 0 var(--sp-4);
	margin-top: var(--sp-3);
}
.find svg { flex: none; color: var(--faint); }
.find input {
	flex: 1;
	min-width: 0;
	border: 0;
	outline: 0;
	background: none;
	font-family: inherit;
	font-size: 13.5px;
	color: var(--text);
	padding: 12px 0;
}
.find input::placeholder { color: var(--faint); }

.btn {
	appearance: none;
	width: 100%;
	border: 0;
	border-radius: var(--r-sm);
	background: var(--ink);
	color: var(--bg);
	font-family: inherit;
	font-size: 14px;
	font-weight: 600;
	padding: 14px;
	cursor: pointer;
	min-height: 48px;
}
:root[data-theme="dark"] .btn { background: var(--s3); color: var(--text); }
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) .btn { background: var(--s3); color: var(--text); }
}
.btn:active { transform: scale(.99); }
.btn[disabled] { opacity: .55; }

/* کلید. بزرگ‌تر از حدِ معمول چون با شست زده می‌شود. */
.sw {
	appearance: none;
	flex: none;
	width: 50px;
	height: 30px;
	border-radius: 999px;
	border: 0;
	background: var(--s3);
	position: relative;
	cursor: pointer;
	transition: background .24s var(--ease);
}
.sw::after {
	content: "";
	position: absolute;
	top: 3px;
	right: 3px;
	width: 24px;
	height: 24px;
	border-radius: 50%;
	background: var(--s1);
	box-shadow: 0 1px 3px rgba(0, 0, 0, .22);
	transition: transform .24s var(--ease);
}
.sw[aria-checked="true"] { background: var(--live); }
.sw[aria-checked="true"]::after { transform: translateX(-20px); }

/* ───────────────────────────────────────────────────────────────────
   تنظیمات — گروه‌بندی، نه کارتِ پشتِ کارت
   ─────────────────────────────────────────────────────────────────── */

.group { margin-top: var(--sp-5); }
.group-k {
	font-size: 10.5px;
	font-weight: 700;
	letter-spacing: .1em;
	color: var(--faint);
	padding-inline-start: var(--sp-3);
	margin-bottom: var(--sp-2);
}
.group-box { background: var(--s1); border-radius: var(--r); overflow: hidden; }
.line {
	display: flex;
	align-items: center;
	gap: var(--sp-3);
	padding: var(--sp-3) var(--sp-4);
	min-height: 56px;
}
.line + .line { border-top: 1px solid var(--hair); }
.line-main { flex: 1; min-width: 0; }
.line-t { font-size: 14px; font-weight: 500; }
.line-s { font-family: var(--f-en); font-size: 11.5px; color: var(--dim); margin-top: 1px; line-height: 1.5; }
.line.is-tap { cursor: pointer; }
.line-val { font-size: 13px; color: var(--dim); font-weight: 500; }
.line-chev { color: var(--faint); flex: none; }
/* ردیفِ سطحِ اهمیت: همان نقطه‌ای که در فهرستِ خبرها هم هست، تا سوییچ
   و آنچه کنترل می‌کند یک شکل داشته باشند. کمی بزرگ‌تر، چون اینجا
   موضوعِ ردیف است نه برچسبی کنارِ چیزِ دیگر. */
.line .sig { width: 11px; height: 11px; }

/* شبکه‌ی ارزها */
.cur-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-2); padding: var(--sp-3); }
.cur {
	appearance: none;
	border: 1px solid var(--hair);
	background: var(--s1);
	border-radius: var(--r-sm);
	padding: var(--sp-2) 2px;
	font-family: inherit;
	color: var(--dim);
	cursor: pointer;
	min-height: 56px;
	display: grid;
	place-items: center;
	gap: 4px;
	transition: border-color .2s var(--ease), color .2s var(--ease);
}
.cur[aria-pressed="true"] { border-color: var(--live); color: var(--text); background: var(--live-wash); }
.cur .fl { width: 20px; height: 14px; border-radius: 2px; overflow: hidden; box-shadow: 0 0 0 1px var(--hair-2); }
.cur .fl svg { width: 100%; height: 100%; display: block; }
.cur .code { font-family: var(--f-num); font-size: 10.5px; font-weight: 500; letter-spacing: .04em; }

.mins { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-2); padding: 0 var(--sp-4) var(--sp-4); }
.mins button {
	appearance: none;
	border: 1px solid var(--hair);
	background: var(--s1);
	border-radius: var(--r-sm);
	font-family: var(--f-num);
	font-size: 14px;
	font-weight: 500;
	color: var(--dim);
	padding: 11px 0;
	cursor: pointer;
	min-height: 46px;
}
.mins button[aria-pressed="true"] { border-color: var(--live); color: var(--text); background: var(--live-wash); }

/* ───────────────────────────────────────────────────────────────────
   ورقِ پایین
   ─────────────────────────────────────────────────────────────────── */

.scrim {
	position: fixed;
	inset: 0;
	z-index: 50;
	background: rgba(6, 10, 9, .5);
	backdrop-filter: blur(2px);
	animation: fade .22s var(--ease);
}
@keyframes fade { from { opacity: 0; } }

.sheet {
	position: fixed;
	inset-inline: 0;
	bottom: 0;
	z-index: 60;
	max-width: 520px;
	margin: 0 auto;
	max-height: 82vh;
	display: flex;
	flex-direction: column;
	background: var(--s1);
	border-radius: 20px 20px 0 0;
	padding-bottom: env(safe-area-inset-bottom, 0px);
	animation: rise .3s var(--ease);
}
@keyframes rise { from { transform: translateY(100%); } }
.sheet-grab {
	width: 36px;
	height: 4px;
	border-radius: 2px;
	background: var(--s3);
	margin: 8px auto 0;
}
.sheet-bar {
	display: flex;
	align-items: center;
	gap: var(--sp-3);
	padding: var(--sp-3) var(--sp-4) var(--sp-2);
}
.sheet-bar h2 { margin: 0; flex: 1; font-size: 15px; font-weight: 700; }
.sheet-body { overflow-y: auto; padding: 0 var(--sp-4) var(--sp-5); -webkit-overflow-scrolling: touch; }

/* ردیف‌های انتخاب داخلِ ورق */
.pick {
	appearance: none;
	width: 100%;
	display: flex;
	align-items: center;
	gap: var(--sp-3);
	border: 0;
	background: none;
	font-family: inherit;
	color: inherit;
	text-align: start;
	padding: var(--sp-3) 0;
	min-height: 52px;
	cursor: pointer;
	font-size: 14px;
}
.pick + .pick { border-top: 1px solid var(--hair); }
.pick-off { font-family: var(--f-num); font-size: 11.5px; color: var(--faint); }
/* زیرنویسِ گزینه، جایی که نام به‌تنهایی گویا نیست - «بروکر» شهر نیست. */
.pick-sub { display: block; font-style: normal; font-size: 10.5px; color: var(--faint); margin-top: 1px; }
.pick-now { font-family: var(--f-num); font-size: 13px; color: var(--dim); margin-inline-start: auto; }
.pick[aria-checked="true"] .pick-now { color: var(--live); }
.pick-tick { color: var(--live); flex: none; opacity: 0; }
.pick[aria-checked="true"] .pick-tick { opacity: 1; }

/* جدولِ ریزِ جزئیاتِ سشن داخلِ ورق */
.sess-facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-3); margin-top: var(--sp-3); }
.sess-fact { background: var(--s2); border-radius: var(--r-sm); padding: var(--sp-3) var(--sp-2); text-align: center; }
.sess-fact .k { font-size: 10px; color: var(--faint); font-weight: 600; }
.sess-fact .v { font-family: var(--f-num); font-size: 14px; font-weight: 500; margin-top: 3px; direction: ltr; unicode-bidi: isolate; }
.sess-fact .v.is-live { color: var(--live); }

/* ───────────────────────────────────────────────────────────────────
   حالت‌ها
   ─────────────────────────────────────────────────────────────────── */

.state { text-align: center; padding: var(--sp-7) var(--sp-4); }
.state-glyph {
	width: 44px;
	height: 44px;
	margin: 0 auto var(--sp-3);
	border-radius: 50%;
	display: grid;
	place-items: center;
	background: var(--s2);
	color: var(--faint);
}
.state h3 { margin: 0 0 var(--sp-2); font-size: 15px; font-weight: 700; }
.state p { margin: 0 auto; max-width: 32ch; font-size: 13px; color: var(--dim); line-height: 1.9; }
.state .btn { margin-top: var(--sp-4); max-width: 220px; margin-inline: auto; }

.skel { height: 62px; border-radius: var(--r-sm); background: var(--s2); margin-bottom: var(--sp-2); animation: pulse 1.4s var(--ease) infinite; }
@keyframes pulse { 50% { opacity: .5; } }

/* توضیحِ هوش مصنوعیِ یک خبر، داخلِ بازشده‌ی همان خبر.
   بلوکِ «تحلیل امروز» تهِ صفحه بود و با دکمه‌ی مشکیِ تمام‌عرضش
   سنگین‌ترین چیزِ صفحه؛ اینجا دکمه سبک است چون در جایِ خودش نشسته و
   لازم نیست کسی را صدا بزند. */
.xai { margin-top: var(--sp-3); padding-top: var(--sp-3); border-top: 1px solid var(--hair); }
.xai-b {
	appearance: none;
	border: 1px solid var(--hair-2);
	background: none;
	border-radius: 999px;
	font-family: inherit;
	font-size: 12px;
	font-weight: 600;
	color: var(--dim);
	padding: 0 14px;
	min-height: 36px;
	cursor: pointer;
}
.xai-b:active { background: var(--s3); }
.xai-b[disabled] { opacity: .55; }
.xai-out {
	margin-top: var(--sp-3);
	font-size: 13px;
	line-height: 2;
	color: var(--dim);
	white-space: pre-wrap;
}
.xai-out b { color: var(--text); font-weight: 600; }
.xai-stamp { display: block; margin-top: var(--sp-2); font-size: 10.5px; color: var(--faint); }

/* یک خطِ توضیحیِ کم‌رنگ، جایی که فهرست خالی است ولی روز خالی نیست. */
.thin { font-size: 12.5px; color: var(--faint); padding: var(--sp-2) 0; }

.build { display: none; }

/* ───────────────────────────────────────────────────────────────────
   دسترسی‌پذیری و حرکت
   ─────────────────────────────────────────────────────────────────── */

:where(button, input, [role="tab"]):focus-visible {
	outline: 2px solid var(--live);
	outline-offset: 3px;
	border-radius: var(--r-xs);
}

@media (prefers-reduced-motion: reduce) {
	*, *::before, *::after { animation: none !important; transition: none !important; }
}
	</style>
</head>

<body>
	<!-- Flag artwork from flag-icons (MIT, Panayiotis Lipiridis), inlined

var BREAK_START_UTC = 21 * 60;
var BREAK_END_UTC = 22 * 60;

	var d = new Date(instant);

}

function breakEndAfter(instant) {
	var d = new Date(instant);
	var end = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 0, BREAK_END_UTC);
	return end > instant ? end : end + 86400000;
}

function breakStartAfter(instant) {
	var d = new Date(instant);
	var start = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 0, BREAK_START_UTC);

	var p = tzParts(date, timeZone);

	return Math.round((asUTC - date.getTime()) / 60000);

// The UTC instant of a wall-clock time on a local calendar date. Two
// passes settle the case where the first guess lands on the far side
// of a DST transition.
function instantAt(y, m, d, hour, minute, timeZone) {
	var guess = Date.UTC(y, m - 1, d, hour, minute);
	for (var i = 0; i < 2; i++) {

	}
	return guess;
}

	var p = tzParts(now, timeZone);
	var shifted = new Date(Date.UTC(+p.year, +p.month - 1, +p.day) + offset * 86400000);
	return {
		y: shifted.getUTCFullYear(), m: shifted.getUTCMonth() + 1,
		d: shifted.getUTCDate(), dow: shifted.getUTCDay()

function occurrences(session, now, fromDay, toDay) {
	var out = [];
	for (var off = fromDay; off <= toDay; off++) {
		var dt = localDatePlus(now, session.zone, off);
		if (dt.dow === 0 || dt.dow === 6) continue; // markets rest at the weekend
		out.push({
			open: instantAt(dt.y, dt.m, dt.d, session.open, session.openMin || 0, session.zone),
			close: instantAt(dt.y, dt.m, dt.d, session.close, session.closeMin || 0, session.zone),
			dow: dt.dow
		});
	}
	return out.sort(function (a, b) { return a.open - b.open; });
}

	var t = now.getTime();
	var occ = occurrences(session, now, -2, 5);
	for (var i = 0; i < occ.length; i++) {

}

// The forex week runs from the Sydney open on Monday to the New York
// close on Friday. Quiet gaps between sessions inside that week are
// not closures, so they must not be reported as one.
function marketState(now) {

	// time and a shifted index would silently redefine the week.
	// The week does not begin with the Sydney bell: the first hour
	// of Monday's server day is the daily settlement window, so the
	// broker starts quoting when that window ends - 01:30 Tehran -
	// even though Sydney itself rings in earlier.
	var mondayOpens = occurrences(sessionByKey("sydney"), now, -9, 9)

		.map(function (o) { return { open: Math.max(o.open, breakEndAfter(o.open - 1)), dow: o.dow }; });

	for (var j = 0; j < fridayCloses.length; j++) {

				});
			}
		} catch (e) { /* ترجیح است، نه داده */ }
	}

	// ── شبکه ────────────────────────────────────────────────────────
	function call(payload) {
		payload.initData = tg ? tg.initData : "";
		return fetch(API, {
			method: "POST",
			headers: { "Content-Type": "application/json" },
			body: JSON.stringify(payload)
		}).then(function (res) {
			return res.json().catch(function () { return {}; }).then(function (body) {
				if (!res.ok || body.success === false) {
					var err = new Error(body.error || ("خطای سرور (" + res.status + ")"));
					err.status = res.status;
					throw err;
				}
				return body;
			});
		});
	}

	function load() {
		return call({ action: "data" })
			.then(function (body) {
				state.data = body;
				state.failure = null;
				state.lastOk = Date.now();
				render();
			})
			.catch(function (err) {
				state.failure = err.status === 401
					? { msg: "تلگرام نتونست هویتت رو تأیید کنه. برنامه رو ببند و از دکمه‌ی داخل ربات دوباره بازش کن.", retry: false }
					: { msg: "دریافت اطلاعات ناموفق بود.", retry: true };
				render();
			});
	}

	// ── داده‌ی رویداد ───────────────────────────────────────────────
	function atOf(e) { return e.at ? new Date(e.at).getTime() : null; }
	function isPast(e) { var t = atOf(e); return t !== null && t < Date.now(); }

	function todays() {
		if (!state.data) return [];
		var d = state.data.today;
		return state.data.events.filter(function (e) { return e.date === d; });
	}

	function matches(e) {
		var q = state.query.trim().toLowerCase();
		if (!q) return true;
		return ((e.en || "") + " " + (e.title || "") + " " + (e.short || "") + " " + (e.currency || ""))
			.toLowerCase().indexOf(q) !== -1;
	}

	function visible() {
		if (!state.data) return [];
		var today = state.data.today;
		var weekEnd = new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10);
		return state.data.events.filter(function (e) {
			if (!levelOn(e.importance)) return false;
			if (state.query) return matches(e);
			if (state.range === "today" && e.date !== today) return false;
			if (state.range === "week" && e.date > weekEnd) return false;
			return true;
		});
	}

	function nextEvent() {
		var now = Date.now();
		return todays().filter(function (e) {
			var t = atOf(e);
			return t !== null && t > now && levelOn(e.importance);
		}).sort(function (a, b) { return atOf(a) - atOf(b); })[0] || null;
	}

	// ── عدد ─────────────────────────────────────────────────────────
	function numOf(v) {
		var m = /^\s*([+-]?[\d.,]+)/.exec(String(v || ""));
		if (!m) return null;
		var n = parseFloat(m[1].replace(/,/g, ""));
		return isNaN(n) ? null : n;
	}
	function unitOf(v) {
		var m = /([%KMBT])\s*$/i.exec(String(v || ""));
		return m ? m[1].toUpperCase() : "";
	}
	function decOf(v) {
		var s = String(v || "").replace(/[^0-9.]/g, "").split(".")[1];
		return s ? s.length : 0;
	}

	/** اختلافِ واقعی با پیش‌بینی. رقمِ اعشار از خودِ ورودی می‌آید. */
	function deltaOf(e) {
		var a = numOf(e.actual), f = numOf(e.forecast);
		if (a === null || f === null) return null;
		var d = a - f;
		var dec = Math.max(decOf(e.actual), decOf(e.forecast));
		if (Math.abs(d) < Math.pow(10, -dec) / 2) return { flat: true, text: "مطابق پیش‌بینی" };
		var unit = unitOf(e.forecast) === "%" ? "" : unitOf(e.forecast);
		// رقمِ لاتین، عمداً. هر عددی که «خوانده» می‌شود - نرخ، اختلاف،
		// ساعت - در یک زبانِ رقمی می‌ماند تا چشم بینشان جابه‌جا نشود.
		return { flat: false, text: (d > 0 ? "+" : "−") + Math.abs(d).toFixed(dec) + unit };
	}

	/** رنگِ عدد از قضاوتِ سرور می‌آید، نه بالا/پایینِ خام. */
	function tone(e) { return e.read ? (e.read.good ? "is-up" : "is-down") : ""; }

	function until(ms) {
		var m = Math.max(0, Math.round((ms - Date.now()) / 60000));
		if (m < 1) return "همین حالا";
		if (m < 60) return fa(m) + " دقیقه";
		var h = Math.floor(m / 60), r = m % 60;
		if (h < 24) return fa(h) + " ساعت" + (r ? " و " + fa(r) + " دقیقه" : "");
		return fa(Math.round(h / 24)) + " روز";
	}
	function countdown(ms) {
		var s = Math.max(0, Math.floor((ms - Date.now()) / 1000));
		var d = Math.floor(s / 86400);
		if (d > 0) return fa(d) + " روز " + pad(Math.floor(s % 86400 / 3600)) + ":" + pad(Math.floor(s % 3600 / 60));
		return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s % 3600 / 60)) + ":" + pad(s % 60);
	}

	function flagNode(ccy) {
		var id = FLAG_BY_CCY[String(ccy || "").toUpperCase()];
		var box = el("span", "fl");
		var svg = svgEl("svg", { viewBox: "0 0 512 512", "aria-hidden": "true" });
		if (id) {
			svg.appendChild(svgEl("use", { href: "#fi-" + id }));
		} else {
			svg.setAttribute("viewBox", "0 0 24 24");
			svg.setAttribute("fill", "none");
			svg.setAttribute("stroke", "currentColor");
			svg.setAttribute("stroke-width", "1.6");
			["M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18", "M3 12h18", "M12 3c2.6 2.4 2.6 15.6 0 18", "M12 3c-2.6 2.4-2.6 15.6 0 18"]
				.forEach(function (d) { svg.appendChild(svgEl("path", { d: d })); });
		}
		box.appendChild(svg);
		return box;
	}

	// ═══════════════════════════════════════════════════════════════
	// دیالِ ۲۴ ساعته
	//
	// چرا دیال و نه پنج نوارِ افقی: نوارها همان زبانِ تقویم‌های سنتی‌اند
	// و روی عرضِ گوشی هر کدام چند پیکسل می‌شوند. روز *دوره‌ای* است -
	// دایره شکلِ طبیعیِ آن است، هم‌پوشانی‌ها به‌شکلِ کمان‌های هم‌مرکز خودشان
	// را نشان می‌دهند، و عقربه بدونِ هیچ برچسبی می‌گوید کجای روزیم.
	// ═══════════════════════════════════════════════════════════════
	var DIAL = { size: 260, cx: 130, cy: 130, r0: 118 };

	function polar(min, r) {
		// دقیقه‌ی صفر بالای دیال، و ساعت‌ها ساعتگرد.
		var a = (min / 1440) * Math.PI * 2 - Math.PI / 2;
		return [DIAL.cx + r * Math.cos(a), DIAL.cy + r * Math.sin(a)];
	}
	function arcPath(from, to, r) {
		var span = to - from;
		if (span <= 0) return "";
		// کمانِ کامل با یک path کشیده نمی‌شود؛ کمی کوتاهش می‌کنیم.
		if (span >= 1439) span = 1438;
		var a = polar(from, r), b = polar(from + span, r);
		return "M" + a[0].toFixed(2) + " " + a[1].toFixed(2) +
			" A" + r + " " + r + " 0 " + (span > 720 ? 1 : 0) + " 1 " + b[0].toFixed(2) + " " + b[1].toFixed(2);
	}

	function buildDial(now) {
		var svg = svgEl("svg", {
			class: "dial", viewBox: "0 0 " + DIAL.size + " " + DIAL.size,
			role: "img", "aria-label": "دیال ۲۴ ساعته‌ی بازارها"
		});

		// حلقه‌ی بیرونی و نشانه‌ی هر شش ساعت.
		svg.appendChild(svgEl("circle", { class: "dial-ring", cx: DIAL.cx, cy: DIAL.cy, r: DIAL.r0 }));
		[0, 6, 12, 18].forEach(function (h) {
			var p1 = polar(h * 60, DIAL.r0 - 5), p2 = polar(h * 60, DIAL.r0 + 2);
			svg.appendChild(svgEl("line", { class: "dial-tick", x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1] }));
			var lp = polar(h * 60, DIAL.r0 + 11);
			var t = svgEl("text", { class: "dial-hour", x: lp[0], y: lp[1] });
			t.textContent = pad(h);
			svg.appendChild(t);
		});

		// خبرهای امروز روی حلقه‌ی بیرونی: هرچه مهم‌تر، بلندتر.
		todays().forEach(function (e) {
			if (!e.at || !levelOn(e.importance)) return;
			var m = minutesInZone(atOf(e), VIEW());
			var len = e.importance === "high" ? 11 : e.importance === "medium" ? 7 : 4;
			var w = e.importance === "high" ? 2.4 : 1.6;
			var p1 = polar(m, DIAL.r0 - 3), p2 = polar(m, DIAL.r0 - 3 - len);
			svg.appendChild(svgEl("line", {
				class: "dial-ev" + (e.importance === "high" ? " is-high" : "") + (isPast(e) ? " is-done" : ""),
				x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], "stroke-width": w
			}));
		});

		// یک کمان برای هر سشن، هرکدام روی شعاعِ خودش.
		var r = DIAL.r0 - 24;
		SESSIONS.forEach(function (s) {
			var st = sessionState(s, now);
			var hol = holidayToday(s);
			var ref = st.open ? { open: st.since, close: st.until }
				: (st.nextOpen ? { open: st.nextOpen, close: st.nextClose } : null);
			if (ref) {
				var from = minutesInZone(ref.open, VIEW());
				var span = Math.round((ref.close - ref.open) / 60000);
				var arc = svgEl("path", {
					class: "dial-arc" + (st.open && !hol ? " is-open" : ""),
					d: arcPath(from, from + span, r),
					stroke: "var(--k-" + s.key + ")",
					"stroke-width": st.open && !hol ? 7 : 5
				});
				svg.appendChild(arc);
			}
			r -= 12;
		});

		// عقربه‌ی «حالا».
		var nowMin = minutesInZone(now.getTime(), VIEW());
		var h1 = polar(nowMin, DIAL.r0 - 2), h2 = polar(nowMin, DIAL.r0 - 78);
		svg.appendChild(svgEl("line", { class: "dial-hand", x1: h1[0], y1: h1[1], x2: h2[0], y2: h2[1] }));
		svg.appendChild(svgEl("circle", { class: "dial-dot", cx: h1[0], cy: h1[1], r: 3.4 }));
		return svg;
	}

	function holidayToday(s) {
		if (!state.data || !state.data.holidays || !state.data.holidays.length) return null;
		// تعطیلیِ منتشرشده مالِ بازارهای آمریکاست؛ فید کشور نمی‌دهد.
		if (s.key !== "newyork" && s.key !== "nyse") return null;
		var d = state.data.today;
		for (var i = 0; i < state.data.holidays.length; i++) {
			if (state.data.holidays[i].date === d) return state.data.holidays[i];
		}
		return null;
	}

	// ═══════════════════════════════════════════════════════════════
	// صحنه‌ها
	// ═══════════════════════════════════════════════════════════════

	function render() {
		var stage = $("stage");
		stage.textContent = "";
		$("zoneName").textContent = viewZone.name;
		$("zoneOff").textContent = offsetLabel(VIEW());

		if (state.failure) { stage.appendChild(failureView()); return; }
		if (!state.data) { stage.appendChild(loadingView()); return; }

		if (state.route === "now") stage.appendChild(viewNow());
		else if (state.route === "cal") stage.appendChild(viewCal());
		else stage.appendChild(viewMe());

		syncDock();
	}

	function loadingView() {
		var w = el("div", null);
		w.style.paddingTop = "24px";
		for (var i = 0; i < 4; i++) w.appendChild(el("div", "skel"));
		return w;
	}

	function stateBlock(glyph, title, body, action) {
		var w = el("div", "state");
		var g = el("div", "state-glyph");
		var svg = svgEl("svg", { viewBox: "0 0 24 24", width: "20", height: "20", fill: "none", stroke: "currentColor", "stroke-width": "1.7", "stroke-linecap": "round" });
		(glyph || []).forEach(function (d) { svg.appendChild(svgEl("path", { d: d })); });
		g.appendChild(svg);
		w.appendChild(g);
		w.appendChild(el("h3", null, title));
		var p = el("p", null);
		p.innerHTML = body;
		w.appendChild(p);
		if (action) w.appendChild(action);
		return w;
	}

	function failureView() {
		var body = state.failure.msg;
		if (state.lastOk) {
			body += "<br>آخرین بروزرسانیِ موفق: " +
				'<span class="n">' + hhmmInZone(state.lastOk, VIEW()) + "</span>";
		}
		var btn = null;
		if (state.failure.retry) {
			btn = el("button", "btn", "تلاش دوباره");
			btn.type = "button";
			btn.addEventListener("click", function () { state.failure = null; render(); load(); });
		}
		return stateBlock(["M12 3v9", "M6.6 6.6a9 9 0 1 0 10.8 0"], "داده در دسترس نیست", body, btn);
	}

	// ── اکنون ───────────────────────────────────────────────────────
	var tickers = [];

	function viewNow() {
		tickers = [];
		var now = new Date();
		var market = marketState(now);
		var weekend = !market.open && !market.onBreak && !!market.nextOpen;

		var wrap = el("div", null);

		var dialBox = el("div", "now");
		dialBox.appendChild(buildDial(now));

		var read = el("div", "now-read");
		var t = el("div", "now-time n", hhmmInZone(now.getTime(), VIEW()));
		read.appendChild(t);
		tickers.push(function () { t.textContent = hhmmInZone(Date.now(), VIEW()); });
		var stateWord = market.onBreak ? "تسویه" : (market.open ? "باز" : (weekend ? "آخر هفته" : "بسته"));
		read.appendChild(el("div", "now-state" + (market.open ? "" : " is-shut"), stateWord));
		dialBox.appendChild(read);
		wrap.appendChild(dialBox);

		// جمله‌ی زیرِ دیال: تغییرِ بعدی، نه فهرستِ بازِ فعلی.
		//
		// تا حالا اینجا نوشته می‌شد «لندن و نیویورک هم‌زمان باز» و بعد
		// تراشه‌ها همان نام‌ها را دوباره می‌گفتند - یک حرف، دو بار، پشتِ
		// هم. تنها چیزی که تراشه‌ها نمی‌گویند این است که *بعدی* کِی
		// اتفاق می‌افتد؛ حالا جمله همان را می‌گوید.
		var line = el("div", "now-line");
		line.style.marginInline = "auto";
		if (weekend && market.nextOpen) {
			line.innerHTML = "بازارها تا <b>" + dayInZone(market.nextOpen, VIEW()) + " " +
				'<span class="n">' + hhmmInZone(market.nextOpen, VIEW()) + "</span></b> بسته‌اند.";
		} else if (market.onBreak && market.resumesAt) {
			line.innerHTML = "تسویه‌ی روزانه — از سر گرفته می‌شود <b>" +
				'<span class="n">' + hhmmInZone(market.resumesAt, VIEW()) + "</span></b>";
		} else {
			var nt = nextTurn(now);
			if (nt) {
				line.innerHTML = "<b>" + until(nt.at) + "</b> تا " +
					(nt.closing ? "بسته شدنِ " : "باز شدنِ ") + "<b>" + nt.name + "</b>";
			} else if (market.nextOpen) {
				line.innerHTML = "بازارِ بعدی <b>" + '<span class="n">' +
					hhmmInZone(market.nextOpen, VIEW()) + "</span></b> باز می‌شود.";
			}
		}
		if (line.innerHTML) wrap.appendChild(line);

		// لژِ سشن‌ها: تراشه‌های کوچک، هرکدام درِ ورودیِ جزئیات.
		//
		// چیدمان شبکه است نه wrapِ وسط‌چین. با wrap، پنج تراشه با نام‌های
		// نابرابر به ۳+۲ می‌شکستند و بلوک دندانه‌دار می‌شد؛ در شبکه هر
		// ستون یک عرض دارد و تراشه‌ی پنجم عمداً کلِ ردیف را می‌گیرد.
		//
		// بازها اول می‌آیند. در حالتِ wrap ترتیب ثابت بود و کاربر باید
		// بینِ پنج‌تا دنبالِ روشن‌ها می‌گشت.
		var lede = el("div", "lede");
		SESSIONS.slice().sort(function (a, b2) {
			var oa = sessionState(a, now).open && !holidayToday(a) ? 0 : 1;
			var ob = sessionState(b2, now).open && !holidayToday(b2) ? 0 : 1;
			return oa - ob;
		}).forEach(function (s) {
			var st = sessionState(s, now);
			var hol = holidayToday(s);
			var b = el("button", null);
			b.type = "button";
			b.className = (st.open && !hol ? "is-open" : "") + (hol ? " is-hol" : "");
			b.style.setProperty("--k", "var(--k-" + s.key + ")");
			b.appendChild(el("span", "kdot"));
			b.appendChild(el("span", null, s.name));
			// ساعت روی خودِ تراشه.
			//
			// تا حالا تراشه فقط یک نقطه‌ی رنگی و یک نام بود: می‌گفت باز
			// است یا نه، ولی نمی‌گفت «تا کِی». آن جواب یک ضربه پایین‌تر،
			// داخلِ ورق، پنهان بود - درحالی‌که دقیقاً همان چیزی است که
			// کاربر برای برنامه‌ریزیِ ساعتِ بعدی‌اش می‌خواهد.
			var t = "";
			if (hol) t = "تعطیل";
			else if (st.open && st.until) t = "تا " + hhmmInZone(st.until, VIEW());
			else if (st.nextOpen) t = hhmmInZone(st.nextOpen, VIEW());
			if (t) b.appendChild(el("span", "kt n", t));
			b.addEventListener("click", function () { openSession(s); });
			lede.appendChild(b);
		});
		wrap.appendChild(lede);

		// ساعت‌ها به وقتِ کدام منطقه‌اند.
		//
		// تراشه‌ها ساعتِ باز و بسته شدن را می‌گویند ولی هیچ‌جا نمی‌گفت
		// این ساعت‌ها به وقتِ کجاست. کسی که منطقه را عوض کرده - یا
		// نکرده و فرض کرده وقتِ بروکر است - عددها را اشتباه می‌خواند.
		// خودِ این خط دکمه است، پس همان‌جا هم می‌شود عوضش کرد.
		var tzNote = el("button", "tz-note");
		tzNote.type = "button";
		tzNote.innerHTML = "ساعت‌ها به وقتِ <b>" + viewZone.name + "</b> " +
			'<span class="n">' + offsetLabel(VIEW(), now) + "</span>";
		tzNote.addEventListener("click", openZones);
		wrap.appendChild(tzNote);

		// رویدادِ بعدی — بزرگ‌ترین چیزِ صفحه بعد از ساعت.
		var nx = nextEvent();
		if (nx) {
			var card = el("div", "upnext");
			card.appendChild(el("div", "upnext-k", "رویداد بعدی"));
			var cd = el("div", "upnext-cd n", countdown(atOf(nx)));
			card.appendChild(cd);
			// دقیقه‌ی آخر.
			//
			// زیر یک دقیقه هیچ اتفاقی در رفتارِ شمارنده نمی‌افتاد -
			// همان رقم‌ها، همان رنگ. ولی این دقیقاً لحظه‌ای است که
			// کاربر باید بداند باید نگاه کند. رنگ به «زنده» می‌رود و
			// یک ضربانِ خیلی ملایم می‌گیرد.
			var lastMin = null;
			function beat() {
				cd.textContent = countdown(atOf(nx));
				var left = atOf(nx) - Date.now();
				var hot = left > 0 && left <= 60000;
				if (hot !== lastMin) { cd.classList.toggle("is-hot", hot); lastMin = hot; }
			}
			beat();
			tickers.push(beat);
			card.appendChild(el("div", "upnext-name", nx.en || nx.title || nx.short || ""));
			if (nx.title) card.appendChild(el("div", "upnext-fa", nx.title));
			var meta = el("div", "upnext-meta");
			meta.appendChild(el("span", "n", hhmmInZone(atOf(nx), VIEW())));
			meta.appendChild(el("span", "node-cur", nx.currency || ""));
			meta.appendChild(impMark(nx.importance));
			meta.appendChild(el("span", null, impWord(nx.importance)));
			card.appendChild(meta);
			wrap.appendChild(card);
		}

		// جریانِ امروز.
		//
		// رویدادِ بعدی از این فهرست کنار می‌رود. nextEvent خودش از
		// todays می‌آید، پس تا امروز همان خبر دو بار روی صفحه بود - یک
		// بار در کارتِ بزرگ، یک بار چند سانت پایین‌تر در فهرست. حالا
		// کارت همان «بعدی» است و فهرست «بقیه».
		var todayShown = todays().filter(function (e) {
			return levelOn(e.importance) && !(nx && e.event_id === nx.event_id);
		});
		var h = el("div", "sec-h");
		h.appendChild(el("h2", null, nx ? "بقیه‌ی امروز" : "امروز"));
		h.appendChild(el("span", "aside", state.data ? jalaliLabel(state.data.today) : ""));
		wrap.appendChild(h);

		if (todayShown.length) {
			wrap.appendChild(buildStream(todayShown, false));
		} else if (nx) {
			// فهرست خالی است ولی روز خالی نیست: کارتِ بالا تنها رویدادِ
			// امروز بود. حالتِ خالیِ کاملِ «امروز خبری نیست» اینجا دروغ
			// می‌گفت.
			wrap.appendChild(el("div", "thin", "رویدادِ دیگری برای امروز نمانده."));
		} else {
			wrap.appendChild(emptyToday(weekend, market));
		}
		return wrap;
	}

	/**
	 * نزدیک‌ترین تغییرِ وضعیتِ بازارها - باز شدن یا بسته شدن.
	 *
	 * بینِ همه‌ی سشن‌ها می‌گردد و زودترین لحظه را برمی‌گرداند. تعطیلیِ
	 * بانکی کنار گذاشته می‌شود: بازاری که امروز تعطیل است «باز» نمی‌شود.
	 */
	function nextTurn(now) {
		var best = null;
		SESSIONS.forEach(function (s) {
			if (holidayToday(s)) return;
			var st = sessionState(s, now);
			var at = st.open ? st.until : st.nextOpen;
			if (!at) return;
			if (!best || at < best.at) best = { at: at, name: s.name, closing: !!st.open };
		});
		return best;
	}

	function impWord(imp) {
		return imp === "high" ? "مهم" : imp === "medium" ? "متوسط" : "کم‌اهمیت";
	}

	/**
	 * نشانِ اهمیت: یک دایره‌ی رنگی - قرمز، نارنجی، طلایی.
	 *
	 * اول با سه میله‌ی بی‌رنگ ساخته شد تا از زبانِ رنگیِ فارکس‌فکتوری
	 * فاصله بگیرد، ولی در عمل کافی نبود: سطحِ خبر باید در یک نگاه و از
	 * فاصله خوانده شود، و رنگ این کار را می‌کند که شکل نمی‌کند.
	 *
	 * چیزی که از آن پرهیز می‌شود پُر شدنِ صفحه از قرمز است، نه خودِ
	 * رنگ. پس دایره کوچک می‌ماند و رنگ فقط همین‌جاست: عنوان و عددها
	 * رنگِ اهمیت نمی‌گیرند. دو نشانه‌ی موازی هم سرِ جایشان‌اند -
	 * اندازه‌ی گره روی خط و بزرگیِ عنوان - تا اگر کسی رنگ را تشخیص
	 * نمی‌دهد، سطح همچنان دیده شود.
	 */
	function impMark(imp) {
		var s = el("span", "sig lv-" + (imp === "high" ? 3 : imp === "medium" ? 2 : 1));
		s.setAttribute("role", "img");
		s.setAttribute("aria-label", "اهمیت: " + impWord(imp));
		return s;
	}

	function emptyToday(weekend, market) {
		var off = LEVELS.filter(function (l) { return !state.levels[l.key]; });
		if (weekend) {
			var msg = "بازارها بسته‌اند و داده‌ی تازه‌ای منتشر نمی‌شود.";
			if (market.nextOpen) {
				msg += "<br>دوباره " + dayInZone(market.nextOpen, VIEW()) + " ساعت " +
					'<span class="n">' + hhmmInZone(market.nextOpen, VIEW()) + "</span> باز می‌شوند.";
			}
			return stateBlock(["M12 3v2", "M12 19v2", "M5 12H3", "M21 12h-2", "M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8"],
				"آخر هفته", msg, null);
		}
		if (off.length) {
			var b = el("button", "btn", "باز کردن تنظیمات");
			b.type = "button";
			b.addEventListener("click", function () { go("me"); });
			return stateBlock(["M4 6h16", "M4 12h10", "M4 18h6"], "خبری در سطح‌های روشن نیست",
				"سطح " + off.map(function (l) { return l.fa; }).join(" و ") + " خاموش است.", b);
		}
		return stateBlock(["M4 6h16", "M4 12h10", "M4 18h6"], "امروز رویدادی نیست",
			"برای امروز چیزی در تقویم ثبت نشده.", null);
	}

	// ── تقویم ───────────────────────────────────────────────────────
	function viewCal() {

		var wrap = el("div", null);

		var bar = el("div", null);
		bar.style.cssText = "display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px";

	function paintCal(host) {
		var rows = visible();
		if (!rows.length) {
			host.appendChild(stateBlock(["M4 6h16", "M4 12h10", "M4 18h6"],
				state.query ? "چیزی پیدا نشد" : "رویدادی نیست",
				state.query ? "برای این جستجو رویدادی در بازه‌ی بارگذاری‌شده نبود." : "برای این بازه چیزی ثبت نشده.",
				null));
			return;
		}
		// گروه‌بندی به روز، با سرصفحه‌ی سبک.
		var byDay = [];
		var seen = {};
		rows.forEach(function (e) {
			if (!seen[e.date]) { seen[e.date] = []; byDay.push(e.date); }
			seen[e.date].push(e);
		});
		byDay.forEach(function (d) {
			var head = el("div", "daymark");
			head.appendChild(el("span", null, jalaliLabel(d)));
			var g = el("span", "g", gregLabel(d));
			g.dir = "ltr";
			head.appendChild(g);
			if (state.data && d === state.data.today) head.appendChild(el("span", "today", "امروز"));
			host.appendChild(head);
			host.appendChild(buildStream(seen[d], true));
		});
