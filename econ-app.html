	<!--

		وزیرمتن هرچه فارسی است. JetBrains Mono هر عددی که خوانده می‌شود -
		ساعت، نرخ، شمارشِ معکوس. رقم‌های هم‌عرضش یعنی ستون نمی‌لرزد و
		ثانیه‌شمار سرِ جایش می‌ماند.

		سریف عمداً نیست: این محصول یک روزنامه نیست، یک ابزارِ بازار است.
	-->
	<link rel="stylesheet"

	<style>
/* ═══════════════════════════════════════════════════════════════════
   «رصد» — سیستمِ طراحی

   جهت: یک ابزارِ رصدِ بازار، نه یک تقویمِ اقتصادی.

   سه تصمیمِ ریشه‌ای که همه‌چیز از آن‌ها می‌آید:

   ۱. یک رنگِ اکسنت، و آن رنگ فقط معنیِ «زنده» می‌دهد.
      سبز و قرمز فقط برای عدد. اهمیت هیچ رنگی ندارد - با اندازه،
      وزن و فضا گفته می‌شود. این تنها راهی است که یک صفحه‌ی پرداده
      شلوغ به‌نظر نرسد.

   ۲. کارت تقریباً وجود ندارد.
      جدا کردن با سطحِ زمینه و فاصله انجام می‌شود. لبه فقط جایی است
      که واقعاً چیزی را قاب می‌گیرد.

   ۳. عدد و متن دو خانواده‌اند.
      وزیرمتن برای فارسی، JetBrains Mono برای هر عددی که خوانده
      می‌شود. رقم‌های هم‌عرض یعنی ستون نمی‌لرزد.
   ═══════════════════════════════════════════════════════════════════ */

/* [hidden] یک بار، برای همه.
   قاعده‌ی مرورگر برای [hidden] فقط display:none با ویژگی‌مندیِ صفر است،
   پس هر عنصری که display خودش را بگذارد - flex، grid - بی‌صدا آن را
   می‌بازد. */
[hidden] { display: none !important; }

:root {
	--f-ui: Vazirmatn, -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
	--f-num: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

	/* ── سطح‌ها ─────────────────────────────────────────────────────
	   خنثای گرم با انحرافِ خیلی کمِ سبز-آبی به سمتِ اکسنت. خاکسترِ
	   کاملاً خنثی بی‌تصمیم به‌نظر می‌رسد. */
	--bg: #f4f5f4;
	--s1: #ffffff;
	--s2: #eceeed;
	--s3: #e2e5e4;
	--ink: #141817;
	--text: #141817;
	--dim: #5c6663;
	--faint: #8e9694;
	--hair: rgba(20, 24, 23, .09);
	--hair-2: rgba(20, 24, 23, .16);

	/* ── اکسنت: «زنده» ────────────────────────────────────────────
	   یک رنگ، یک معنی. هیچ کنترلی، هیچ سرتیتری، هیچ دکمه‌ای این رنگ
	   را نمی‌گیرد - فقط چیزی که همین حالا در جریان است. */
	--live: #00857a;
	--live-ink: #ffffff;
	--live-wash: rgba(0, 133, 122, .1);

	/* ── عدد ──────────────────────────────────────────────────────
	   جهتِ «به نفعِ ارز»، نه بالا/پایینِ خام. */
	--up: #16785a;
	--down: #b03a3a;

	/* ── سشن‌ها ───────────────────────────────────────────────────
	   هر بازار یک ته‌رنگ دارد تا در دیال از هم جدا شوند. اشباعشان
	   عمداً پایین است: این‌ها هویت‌اند، نه هشدار. */
	--k-sydney: #4a8f86;
	--k-tokyo: #5b74a8;
	--k-london: #7a6aa6;
	--k-newyork: #a8794a;
	--k-nyse: #a05a52;

	--r: 14px;
	--r-sm: 9px;
	--r-xs: 5px;

	/* فاصله‌ی یکسان همه‌جا. سیستمِ چهارتایی. */
	--sp-1: 4px;
	--sp-2: 8px;
	--sp-3: 12px;
	--sp-4: 16px;
	--sp-5: 24px;
	--sp-6: 32px;
	--sp-7: 48px;

	--ease: cubic-bezier(.32, .72, 0, 1);
	--lift: 0 1px 2px rgba(20, 24, 23, .04), 0 8px 24px -16px rgba(20, 24, 23, .3);

	color-scheme: light;
}

/* حالتِ تیره، طراحی‌شده نه وارونه.
   زمینه یک خنثای عمیقِ سبز-آبی است نه سیاهِ مطلق: سیاهِ مطلق روی
   OLED لبه‌ها را می‌بلعد و صفحه بی‌عمق می‌شود. */
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #0c100f;
		--s1: #151a19;
		--s2: #1c2221;
		--s3: #252c2b;
		--ink: #e8edec;
		--text: #e8edec;
		--dim: #9aa4a2;
		--faint: #6b7573;
		--hair: rgba(232, 237, 236, .08);
		--hair-2: rgba(232, 237, 236, .15);
		--live: #2dd4bf;
		--live-ink: #04211e;
		--live-wash: rgba(45, 212, 191, .12);
		--up: #4ade8c;
		--down: #f87171;
		--k-sydney: #5fbfb2;
		--k-tokyo: #7d9ae0;
		--k-london: #a48cdc;
		--k-newyork: #dda76a;
		--k-nyse: #e08a80;
		--lift: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px -18px rgba(0, 0, 0, .9);
		color-scheme: dark;
	}
}

:root[data-theme="dark"] {
	--bg: #0c100f;
	--s1: #151a19;
	--s2: #1c2221;
	--s3: #252c2b;
	--ink: #e8edec;
	--text: #e8edec;
	--dim: #9aa4a2;
	--faint: #6b7573;
	--hair: rgba(232, 237, 236, .08);
	--hair-2: rgba(232, 237, 236, .15);
	--live: #2dd4bf;
	--live-ink: #04211e;
	--live-wash: rgba(45, 212, 191, .12);
	--up: #4ade8c;
	--down: #f87171;
	--k-sydney: #5fbfb2;
	--k-tokyo: #7d9ae0;
	--k-london: #a48cdc;
	--k-newyork: #dda76a;
	--k-nyse: #e08a80;
	--lift: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px -18px rgba(0, 0, 0, .9);
	color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

body {
	margin: 0;
	background: var(--bg);
	color: var(--text);
	font-family: var(--f-ui);
	font-size: 15px;
	line-height: 1.6;
	-webkit-font-smoothing: antialiased;
	overscroll-behavior-y: none;
}

/* هر عددی که خوانده می‌شود. هم‌عرض و همیشه چپ‌به‌راست، تا داخلِ خطِ
   فارسی وارونه نشود. */
.n {
	font-family: var(--f-num);
	font-variant-numeric: tabular-nums;
	direction: ltr;
	unicode-bidi: isolate;
	letter-spacing: -.02em;
}

.flag-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

/* ───────────────────────────────────────────────────────────────────
   چیدمان
   ─────────────────────────────────────────────────────────────────── */

.shell {
	min-height: 100%;
	max-width: 520px;
	margin: 0 auto;
	padding-inline: var(--sp-4);
	/* داکِ شناور نباید روی آخرین ردیف بیفتد. */
	padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
}

.bar {
	display: flex;
	align-items: center;
	gap: var(--sp-3);
	height: 56px;
	padding-top: env(safe-area-inset-top, 0px);
	box-sizing: content-box;
}
.bar-gap { flex: 1; }

/* برند: یک نشانِ کوچک، نه یک سربرگ.
   نامِ کامل جای خبرها را می‌گرفت و هیچ‌کس دو بار نمی‌خواندش. */
.mark {
	font-size: 12.5px;
	font-weight: 800;
	letter-spacing: .02em;
	color: var(--text);
	padding: 5px 10px;
	border-radius: var(--r-xs);
	background: var(--s2);
}

.zone {
	appearance: none;
	border: 0;
	background: none;
	font-family: inherit;
	color: var(--dim);
	font-size: 12.5px;
	font-weight: 600;
	display: flex;
	align-items: baseline;
	gap: 6px;
	padding: 6px 2px;
	cursor: pointer;
}
.zone-off { font-size: 11px; opacity: .75; }

.ghost {
	appearance: none;
	width: 38px;
	height: 38px;
	display: grid;
	place-items: center;
	border: 0;
	border-radius: 50%;
	background: none;
	color: var(--dim);
	cursor: pointer;
	transition: background .18s var(--ease), color .18s var(--ease);
}
.ghost:active { background: var(--s2); color: var(--text); }
.ghost.is-busy svg { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(-360deg); } }

.stage { display: block; }

/* ───────────────────────────────────────────────────────────────────
   داک — ناوبریِ شست
   ─────────────────────────────────────────────────────────────────── */

.dock {
	position: fixed;
	inset-inline: 0;
	bottom: calc(12px + env(safe-area-inset-bottom, 0px));
	z-index: 40;
	width: min(360px, calc(100% - 32px));
	margin: 0 auto;
	display: grid;
	grid-template-columns: repeat(3, 1fr);
	padding: 5px;
	border-radius: 999px;
	background: var(--s1);
	border: 1px solid var(--hair);
	box-shadow: var(--lift);
	/* نشانگر زیرِ دکمه‌ها می‌لغزد. */
	position: fixed;
}
.dock-pill {
	position: absolute;
	top: 5px;
	bottom: 5px;
	width: calc((100% - 10px) / 3);
	border-radius: 999px;
	background: var(--s3);
	transition: transform .34s var(--ease);
	pointer-events: none;
}
.dock button {
	position: relative;
	appearance: none;
	border: 0;
	background: none;
	font-family: inherit;
	color: var(--faint);
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 2px;
	padding: 7px 0 6px;
	font-size: 10.5px;
	font-weight: 600;
	cursor: pointer;
	border-radius: 999px;
	transition: color .22s var(--ease);
	/* هدفِ لمسی: کمتر از این با شست خطا می‌خورد. */
	min-height: 48px;
	justify-content: center;
}
.dock button[aria-selected="true"] { color: var(--text); }
.dock button svg { transition: transform .28s var(--ease); }
.dock button[aria-selected="true"] svg { transform: translateY(-1px); }

/* ───────────────────────────────────────────────────────────────────
   بلوکِ «اکنون» — دیالِ ۲۴ ساعته
   ─────────────────────────────────────────────────────────────────── */

.now {
	position: relative;
	display: grid;
	place-items: center;
	padding: var(--sp-3) 0 var(--sp-5);
}
.dial { width: min(272px, 74vw); height: auto; display: block; overflow: visible; }
.dial-ring { fill: none; stroke: var(--hair); stroke-width: 1; }
.dial-tick { stroke: var(--hair-2); stroke-width: 1; }
.dial-hour {
	font-family: var(--f-num);
	font-size: 8.5px;
	fill: var(--faint);
	text-anchor: middle;
	dominant-baseline: middle;
}
.dial-arc { fill: none; stroke-linecap: round; opacity: .34; transition: opacity .3s var(--ease); }
.dial-arc.is-open { opacity: 1; }
.dial-hand { stroke: var(--live); stroke-width: 1.5; stroke-linecap: round; }
.dial-dot { fill: var(--live); }
/* رویدادها روی حلقه‌ی بیرونی: هر خبر یک خط‌چه، و هرچه مهم‌تر بلندتر.
   اهمیت با اندازه گفته می‌شود نه با رنگ. */
.dial-ev { stroke: var(--faint); stroke-linecap: round; }
.dial-ev.is-high { stroke: var(--text); }
.dial-ev.is-done { opacity: .3; }

/* خوانشِ مرکزِ دیال */
.now-read {
	position: absolute;
	inset: 0;
	display: grid;
	place-content: center;
	justify-items: center;
	text-align: center;
	pointer-events: none;
}
.now-time {
	font-family: var(--f-num);
	font-size: 40px;
	font-weight: 500;
	line-height: 1;
	letter-spacing: -.04em;
}
.now-state {
	margin-top: var(--sp-2);
	font-size: 11px;
	font-weight: 700;
	letter-spacing: .06em;
	color: var(--live);
	display: flex;
	align-items: center;
	gap: 6px;
}
.now-state::before {
	content: "";
	width: 6px;
	height: 6px;
	border-radius: 50%;
	background: var(--live);
	animation: breathe 2.6s var(--ease) infinite;
}
.now-state.is-shut { color: var(--faint); }
.now-state.is-shut::before { background: var(--faint); animation: none; }
@keyframes breathe { 50% { opacity: .3; } }

/* یک جمله زیرِ دیال، به‌جای پنج ردیفِ نوار. */
.now-line {
	margin-top: var(--sp-4);
	text-align: center;
	font-size: 13px;
	color: var(--dim);
	line-height: 1.85;
	max-width: 30ch;
}
.now-line b { color: var(--text); font-weight: 600; }

/* لژِ سشن‌ها: نقطه‌های رنگی با نام، زیرِ دیال. کلیک‌شان ورق را باز
   می‌کند. این جای «پنج ردیفِ نواری» را گرفته. */
.lede {
	display: flex;
	flex-wrap: wrap;
	justify-content: center;
	gap: var(--sp-2);
	margin-top: var(--sp-4);
}
.lede button {
	appearance: none;
	border: 1px solid var(--hair);
	background: var(--s1);
	font-family: inherit;
	color: var(--dim);
	font-size: 11.5px;
	font-weight: 600;
	border-radius: 999px;
	padding: 6px 11px 6px 9px;
	display: inline-flex;
	align-items: center;
	gap: 6px;
	cursor: pointer;
	min-height: 34px;
}
.lede button .kdot { width: 7px; height: 7px; border-radius: 50%; background: var(--k); }
.lede button.is-open { color: var(--text); border-color: var(--hair-2); }
.lede button.is-open .kdot { box-shadow: 0 0 0 3px color-mix(in srgb, var(--k) 22%, transparent); }
.lede button.is-hol { opacity: .55; }

/* ───────────────────────────────────────────────────────────────────
   بلوکِ «رویدادِ بعدی»
   ─────────────────────────────────────────────────────────────────── */

.upnext {
	margin-top: var(--sp-5);
	padding: var(--sp-4);
	border-radius: var(--r);
	background: var(--s1);
	border: 1px solid var(--hair);
}
.upnext-k {
	font-size: 10px;
	font-weight: 700;
	letter-spacing: .12em;
	color: var(--faint);
}
.upnext-cd {
	font-family: var(--f-num);
	font-size: 30px;
	font-weight: 500;
	line-height: 1.1;
	letter-spacing: -.03em;
	margin-top: var(--sp-1);
	color: var(--live);
}
.upnext-name {
	margin-top: var(--sp-2);
	font-size: 15px;
	font-weight: 600;
	line-height: 1.4;
	direction: ltr;
	text-align: start;
	unicode-bidi: isolate;
}
.upnext-fa { font-size: 12.5px; color: var(--dim); margin-top: 1px; }
.upnext-meta {
	margin-top: var(--sp-3);
	padding-top: var(--sp-3);
	border-top: 1px solid var(--hair);
	display: flex;
	align-items: center;
	gap: var(--sp-2);
	font-size: 12px;
	color: var(--dim);
}

/* ───────────────────────────────────────────────────────────────────
   جریانِ رویدادها — گره روی یک خطِ زمان
   ─────────────────────────────────────────────────────────────────── */

.sec-h {
	display: flex;
	align-items: baseline;
	justify-content: space-between;
	gap: var(--sp-3);
	margin: var(--sp-6) 0 var(--sp-3);
}
.sec-h h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .01em; }
.sec-h .aside { font-size: 11px; color: var(--faint); font-weight: 600; }

 /* هندسه‌ی جریان، در یک جا.
   ستونِ ساعت از صفر تا ۳۸، خطِ زمان روی ۴۴، و متنِ خبر از ۶۴ شروع
   می‌شود. اولین بار ساعت و گره روی هم افتادند («۱۷●۳۰») چون هر دو
   داخلِ همان ۵۸ پیکسل بودند - این سه عدد باید با هم خوانده شوند. */
.stream { position: relative; padding-inline-start: 64px; }
/* خطِ زمان. یک خط برای همه‌ی گره‌ها، نه یکی برای هر کدام. */
.stream::before {
	content: "";
	position: absolute;
	inset-inline-start: 44px;
	top: 6px;
	bottom: 6px;
	width: 1px;
	background: var(--hair-2);
}

.node { position: relative; padding: var(--sp-3) 0; }
.node + .node { border-top: 1px solid var(--hair); }
/* ساعتِ گره، بیرونِ خط. */
/* ساعتِ گره، بیرونِ خط.
   عمداً direction روی خودِ این عنصر ست نمی‌شود: خصوصیت‌های منطقیِ
   موقعیت (inset-inline-start) با جهتِ *خودِ عنصر* حل می‌شوند، نه با
   جهتِ صفحه. با direction:ltr اینجا، inset-inline-start به left تبدیل
   می‌شد و ساعت ۴۲ پیکسل بیرونِ صفحه می‌افتاد.

   خودِ «۱۷:۳۰» بدونِ آن هم درست خوانده می‌شود: رقم‌ها قویِ چپ‌به‌راست‌اند
   و دونقطه بینشان خنثی می‌ماند. isolate برای جدا نگه داشتن از متنِ
   دورش کافی است. */
.node-t {
	position: absolute;
	inset-inline-start: -64px;
	top: calc(var(--sp-3) + 1px);
	width: 38px;
	text-align: center;
	font-family: var(--f-num);
	font-size: 12.5px;
	font-weight: 500;
	color: var(--dim);
	unicode-bidi: isolate;
}
/* گرهِ روی خط. اندازه‌اش اهمیت را می‌گوید - نه رنگش. */
.node::after {
	content: "";
	position: absolute;
	inset-inline-start: -23.5px;
	top: calc(var(--sp-3) + 6px);
	width: 7px;
	height: 7px;
	border-radius: 50%;
	background: var(--s3);
	box-shadow: 0 0 0 3px var(--bg);
}
.node.imp-medium::after { width: 9px; height: 9px; inset-inline-start: -24.5px; background: var(--dim); }
.node.imp-high::after {
	width: 11px;
	height: 11px;
	inset-inline-start: -25.5px;
	top: calc(var(--sp-3) + 4px);
	background: var(--text);
}
.node.is-done::after { background: var(--s3); }
.node.is-live::after { background: var(--live); box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--live-wash); }

.node-head {
	appearance: none;
	border: 0;
	background: none;
	padding: 0;
	width: 100%;
	text-align: start;
	font-family: inherit;
	color: inherit;
	cursor: pointer;
	display: block;
}
.node-top { display: flex; align-items: center; gap: var(--sp-2); }
.node-cur {
	font-family: var(--f-num);
	font-size: 10.5px;
	font-weight: 500;
	letter-spacing: .06em;
	color: var(--faint);
}
.node-gap { flex: 1; }
.node-tag { font-size: 10.5px; font-weight: 600; color: var(--faint); }
.node-tag.is-live { color: var(--live); }

/* عنوان: اهمیت با اندازه و وزن. خبرِ مهم بزرگ‌تر است، نه قرمزتر. */
.node-name {
	margin-top: 3px;
	font-size: 14px;
	font-weight: 500;
	line-height: 1.4;
	direction: ltr;
	text-align: start;
	unicode-bidi: isolate;
	overflow-wrap: anywhere;
}
.node.imp-high .node-name { font-size: 16.5px; font-weight: 600; letter-spacing: -.01em; }
.node.imp-low .node-name { font-size: 13px; color: var(--dim); }
.node-fa { font-size: 12px; color: var(--dim); margin-top: 1px; }
.node.is-done { opacity: .62; }
.node.is-done.has-actual { opacity: 1; }

/* نتیجه، وقتی منتشر شده: عدد بزرگ و یک اختلافِ کوچک. */
.node-out {
	margin-top: var(--sp-2);
	display: flex;
	align-items: baseline;
	gap: var(--sp-2);
}
.node-actual { font-family: var(--f-num); font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
.node-actual.is-up { color: var(--up); }
.node-actual.is-down { color: var(--down); }
.node-delta { font-family: var(--f-num); font-size: 11.5px; font-weight: 500; color: var(--faint); }

/* ── بازشده ────────────────────────────────────────────────────── */
.node-more { overflow: hidden; }
.node-more[hidden] { display: none !important; }
.node-body {
	margin-top: var(--sp-3);
	padding: var(--sp-3);
	border-radius: var(--r-sm);
	background: var(--s2);
}

/* پیش‌بینی در برابر واقعی، به‌شکلِ یک محور - نه یک جدول.
   جدولِ سه‌ستونی همان زبانِ تقویم‌های سنتی است؛ این یکی نسبت را نشان
   می‌دهد، نه فقط سه عدد کنارِ هم. */
.gauge { position: relative; height: 34px; margin: var(--sp-2) 0 var(--sp-3); }
.gauge-rail {
	position: absolute;
	inset-inline: 0;
	top: 15px;
	height: 3px;
	border-radius: 2px;
	background: var(--s3);
}
.gauge-fill { position: absolute; top: 15px; height: 3px; border-radius: 2px; background: var(--dim); }
.gauge-fill.is-up { background: var(--up); }
.gauge-fill.is-down { background: var(--down); }
.gauge-pin {
	position: absolute;
	top: 9px;
	width: 2px;
	height: 15px;
	border-radius: 1px;
	background: var(--faint);
}
.gauge-lab {
	position: absolute;
	top: 0;
	transform: translateX(50%);
	font-family: var(--f-num);
	font-size: 9.5px;
	color: var(--faint);
	white-space: nowrap;
}
.gauge-val {
	position: absolute;
	bottom: 0;
	transform: translateX(50%);
	font-family: var(--f-num);
	font-size: 11px;
	font-weight: 600;
	white-space: nowrap;
}

.facts { display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-4); font-size: 11.5px; color: var(--dim); }
.facts b { font-family: var(--f-num); color: var(--text); font-weight: 600; }
.facts .rev { color: var(--faint); font-size: 10.5px; }

.effect { margin-top: var(--sp-3); font-size: 12px; line-height: 1.75; color: var(--dim); }
.effect.is-good { color: var(--up); }
.effect.is-bad { color: var(--down); }

/* تاریخچه: میله‌های ریز، بی‌محور و بی‌قاب. */
.spark { display: flex; align-items: flex-end; gap: 3px; height: 30px; margin-top: var(--sp-3); direction: ltr; }
.spark i { flex: 1; min-height: 3px; border-radius: 2px; background: var(--s3); }
.spark i.up { background: color-mix(in srgb, var(--up) 55%, transparent); }
.spark i.down { background: color-mix(in srgb, var(--down) 55%, transparent); }
.spark i:last-child { background: var(--dim); }
.spark i.up:last-child { background: var(--up); }
.spark i.down:last-child { background: var(--down); }
.spark-k { margin-top: 5px; font-size: 10px; color: var(--faint); }

/* سرصفحه‌ی روز در جریانِ چندروزه. */
.daymark {
	position: relative;
	margin: var(--sp-5) 0 var(--sp-2);
	padding-inline-start: 0;
	font-size: 12px;
	font-weight: 700;
	color: var(--dim);
	display: flex;
	align-items: baseline;
	gap: var(--sp-2);
}
.daymark .g { font-family: var(--f-num); font-size: 10.5px; color: var(--faint); font-weight: 500; }
.daymark .today { color: var(--live); font-size: 10px; letter-spacing: .08em; }

/* ───────────────────────────────────────────────────────────────────
   کنترل‌ها
   ─────────────────────────────────────────────────────────────────── */

/* کنترلِ قطعه‌ای - برای بازه و هر انتخابِ کوتاه. */
.seg {
	display: inline-flex;
	padding: 3px;
	border-radius: 999px;
	background: var(--s2);
	gap: 2px;
}
.seg button {
	appearance: none;
	border: 0;
	background: none;
	font-family: inherit;
	font-size: 12.5px;
	font-weight: 600;
	color: var(--dim);
	padding: 7px 15px;
	border-radius: 999px;
	cursor: pointer;
	min-height: 36px;
	transition: background .2s var(--ease), color .2s var(--ease);
}
.seg button[aria-pressed="true"] { background: var(--s1); color: var(--text); box-shadow: var(--lift); }

.find {
	display: flex;
	align-items: center;
	gap: var(--sp-2);
	background: var(--s2);
	border-radius: 999px;
	padding: 0 var(--sp-4);
	margin-top: var(--sp-3);
}
.find svg { flex: none; color: var(--faint); }
.find input {
	flex: 1;
	min-width: 0;
	border: 0;
	outline: 0;
	background: none;
	font-family: inherit;
	font-size: 13.5px;
	color: var(--text);
	padding: 12px 0;
}
.find input::placeholder { color: var(--faint); }

.btn {
	appearance: none;
	width: 100%;
	border: 0;
	border-radius: var(--r-sm);
	background: var(--ink);
	color: var(--bg);
	font-family: inherit;
	font-size: 14px;
	font-weight: 600;
	padding: 14px;
	cursor: pointer;
	min-height: 48px;
}
:root[data-theme="dark"] .btn { background: var(--s3); color: var(--text); }
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) .btn { background: var(--s3); color: var(--text); }
}
.btn:active { transform: scale(.99); }
.btn[disabled] { opacity: .55; }

/* کلید. بزرگ‌تر از حدِ معمول چون با شست زده می‌شود. */
.sw {
	appearance: none;
	flex: none;
	width: 50px;
	height: 30px;
	border-radius: 999px;
	border: 0;
	background: var(--s3);
	position: relative;
	cursor: pointer;
	transition: background .24s var(--ease);
}
.sw::after {
	content: "";
	position: absolute;
	top: 3px;
	right: 3px;
	width: 24px;
	height: 24px;
	border-radius: 50%;
	background: var(--s1);
	box-shadow: 0 1px 3px rgba(0, 0, 0, .22);
	transition: transform .24s var(--ease);
}
.sw[aria-checked="true"] { background: var(--live); }
.sw[aria-checked="true"]::after { transform: translateX(-20px); }

/* ───────────────────────────────────────────────────────────────────
   تنظیمات — گروه‌بندی، نه کارتِ پشتِ کارت
   ─────────────────────────────────────────────────────────────────── */

.group { margin-top: var(--sp-5); }
.group-k {
	font-size: 10.5px;
	font-weight: 700;
	letter-spacing: .1em;
	color: var(--faint);
	padding-inline-start: var(--sp-3);
	margin-bottom: var(--sp-2);
}
.group-box { background: var(--s1); border-radius: var(--r); overflow: hidden; }
.line {
	display: flex;
	align-items: center;
	gap: var(--sp-3);
	padding: var(--sp-3) var(--sp-4);
	min-height: 56px;
}
.line + .line { border-top: 1px solid var(--hair); }
.line-main { flex: 1; min-width: 0; }
.line-t { font-size: 14px; font-weight: 500; }
.line-s { font-size: 11.5px; color: var(--dim); margin-top: 1px; line-height: 1.5; }
.line.is-tap { cursor: pointer; }
.line-val { font-size: 13px; color: var(--dim); font-weight: 500; }
.line-chev { color: var(--faint); flex: none; }
/* ردیفِ سطحِ اهمیت: وزنِ نقطه اهمیت را می‌گوید، نه رنگش. */
.line-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--text); }
.line-dot.md { width: 8px; height: 8px; background: var(--dim); }
.line-dot.lo { width: 6px; height: 6px; background: var(--faint); }

/* شبکه‌ی ارزها */
.cur-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-2); padding: var(--sp-3); }
.cur {
	appearance: none;
	border: 1px solid var(--hair);
	background: var(--s1);
	border-radius: var(--r-sm);
	padding: var(--sp-2) 2px;
	font-family: inherit;
	color: var(--dim);
	cursor: pointer;
	min-height: 56px;
	display: grid;
	place-items: center;
	gap: 4px;
	transition: border-color .2s var(--ease), color .2s var(--ease);
}
.cur[aria-pressed="true"] { border-color: var(--live); color: var(--text); background: var(--live-wash); }
.cur .fl { width: 20px; height: 14px; border-radius: 2px; overflow: hidden; box-shadow: 0 0 0 1px var(--hair-2); }
.cur .fl svg { width: 100%; height: 100%; display: block; }
.cur .code { font-family: var(--f-num); font-size: 10.5px; font-weight: 500; letter-spacing: .04em; }

.mins { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-2); padding: 0 var(--sp-4) var(--sp-4); }
.mins button {
	appearance: none;
	border: 1px solid var(--hair);
	background: var(--s1);
	border-radius: var(--r-sm);
	font-family: var(--f-num);
	font-size: 14px;
	font-weight: 500;
	color: var(--dim);
	padding: 11px 0;
	cursor: pointer;
	min-height: 46px;
}
.mins button[aria-pressed="true"] { border-color: var(--live); color: var(--text); background: var(--live-wash); }

/* ───────────────────────────────────────────────────────────────────
   ورقِ پایین
   ─────────────────────────────────────────────────────────────────── */

.scrim {
	position: fixed;
	inset: 0;
	z-index: 50;
	background: rgba(6, 10, 9, .5);
	backdrop-filter: blur(2px);
	animation: fade .22s var(--ease);
}
@keyframes fade { from { opacity: 0; } }

.sheet {
	position: fixed;
	inset-inline: 0;
	bottom: 0;
	z-index: 60;
	max-width: 520px;
	margin: 0 auto;
	max-height: 82vh;
	display: flex;
	flex-direction: column;
	background: var(--s1);
	border-radius: 20px 20px 0 0;
	padding-bottom: env(safe-area-inset-bottom, 0px);
	animation: rise .3s var(--ease);
}
@keyframes rise { from { transform: translateY(100%); } }
.sheet-grab {
	width: 36px;
	height: 4px;
	border-radius: 2px;
	background: var(--s3);
	margin: 8px auto 0;
}
.sheet-bar {
	display: flex;
	align-items: center;
	gap: var(--sp-3);
	padding: var(--sp-3) var(--sp-4) var(--sp-2);
}
.sheet-bar h2 { margin: 0; flex: 1; font-size: 15px; font-weight: 700; }
.sheet-body { overflow-y: auto; padding: 0 var(--sp-4) var(--sp-5); -webkit-overflow-scrolling: touch; }

/* ردیف‌های انتخاب داخلِ ورق */
.pick {
	appearance: none;
	width: 100%;
	display: flex;
	align-items: center;
	gap: var(--sp-3);
	border: 0;
	background: none;
	font-family: inherit;
	color: inherit;
	text-align: start;
	padding: var(--sp-3) 0;
	min-height: 52px;
	cursor: pointer;
	font-size: 14px;
}
.pick + .pick { border-top: 1px solid var(--hair); }
.pick-off { font-family: var(--f-num); font-size: 11.5px; color: var(--faint); }
.pick-now { font-family: var(--f-num); font-size: 13px; color: var(--dim); margin-inline-start: auto; }
.pick[aria-checked="true"] .pick-now { color: var(--live); }
.pick-tick { color: var(--live); flex: none; opacity: 0; }
.pick[aria-checked="true"] .pick-tick { opacity: 1; }

/* جدولِ ریزِ جزئیاتِ سشن داخلِ ورق */
.sess-facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-3); margin-top: var(--sp-3); }
.sess-fact { background: var(--s2); border-radius: var(--r-sm); padding: var(--sp-3) var(--sp-2); text-align: center; }
.sess-fact .k { font-size: 10px; color: var(--faint); font-weight: 600; }
.sess-fact .v { font-family: var(--f-num); font-size: 14px; font-weight: 500; margin-top: 3px; direction: ltr; unicode-bidi: isolate; }
.sess-fact .v.is-live { color: var(--live); }

/* ───────────────────────────────────────────────────────────────────
   حالت‌ها
   ─────────────────────────────────────────────────────────────────── */

.state { text-align: center; padding: var(--sp-7) var(--sp-4); }
.state-glyph {
	width: 44px;
	height: 44px;
	margin: 0 auto var(--sp-3);
	border-radius: 50%;
	display: grid;
	place-items: center;
	background: var(--s2);
	color: var(--faint);
}
.state h3 { margin: 0 0 var(--sp-2); font-size: 15px; font-weight: 700; }
.state p { margin: 0 auto; max-width: 32ch; font-size: 13px; color: var(--dim); line-height: 1.9; }
.state .btn { margin-top: var(--sp-4); max-width: 220px; margin-inline: auto; }

.skel { height: 62px; border-radius: var(--r-sm); background: var(--s2); margin-bottom: var(--sp-2); animation: pulse 1.4s var(--ease) infinite; }
@keyframes pulse { 50% { opacity: .5; } }

.ai-out { margin-top: var(--sp-3); font-size: 13px; line-height: 2; color: var(--dim); }
.ai-stamp { display: block; margin-top: var(--sp-2); font-size: 10.5px; color: var(--faint); }

.build { display: none; }

/* ───────────────────────────────────────────────────────────────────
   دسترسی‌پذیری و حرکت
   ─────────────────────────────────────────────────────────────────── */

:where(button, input, [role="tab"]):focus-visible {
	outline: 2px solid var(--live);
	outline-offset: 3px;
	border-radius: var(--r-xs);
}

@media (prefers-reduced-motion: reduce) {
	*, *::before, *::after { animation: none !important; transition: none !important; }
}
	</style>
</head>

66z"/></symbol></defs></svg>

	<!--
		چیدمان: یک نوارِ باریکِ بالا، یک صحنه که عوض می‌شود، و یک داکِ
		شناورِ پایین که با شست می‌رسد.

		نوارِ بالا عمداً نامِ برند را نمی‌گیرد. برند یک نشانِ کوچک در گوشه
		است؛ بقیه‌ی نوار برای چیزی است که کاربر واقعاً لازم دارد - منطقه‌ی
		زمانی و بروزرسانی.
	-->
	<div class="shell">
		<header class="bar">
			<span class="mark" aria-label="آکادمی سبحان صمدی">صمدی</span>
			<button class="zone" type="button" id="btnZone">
				<span id="zoneName">تهران</span>
				<span class="zone-off n" id="zoneOff">GMT+3:30</span>
			</button>
			<span class="bar-gap"></span>
			<button class="ghost" type="button" id="btnRefresh" aria-label="بروزرسانی">
				<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
					stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="M21 12a9 9 0 1 1-2.64-6.36" />
					<path d="M21 3v6h-6" />
				</svg>
			</button>
		</header>

		<main id="stage" class="stage"></main>

		<!--
			داک به‌جای تب.

			تبِ بالای صفحه در گوشیِ بلند با شست نمی‌رسد. این نوار پایین
			می‌نشیند، از لبه‌ی امنِ دستگاه فاصله می‌گیرد، و نشانگرش زیرِ
			گزینه‌ی فعال می‌لغزد به‌جای اینکه بپرد.
		-->
		<nav class="dock" role="tablist" aria-label="بخش‌ها">
			<span class="dock-pill" id="dockPill" aria-hidden="true"></span>
			<button role="tab" id="navNow" aria-selected="true">
				<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
					stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
					<circle cx="12" cy="12" r="8.5" />
					<path d="M12 7.5V12l3 1.8" />
				</svg>
				<span>اکنون</span>
			</button>
			<button role="tab" id="navCal" aria-selected="false">
				<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
					stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
					<rect x="4" y="6" width="16" height="14" rx="2.5" />
					<path d="M4 10.5h16M8.5 4v3.5M15.5 4v3.5" />
				</svg>
				<span>تقویم</span>
			</button>
			<button role="tab" id="navMe" aria-selected="false">
				<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
					stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
					<path d="M4 7h9M18.5 7H20M4 12h3.5M13 12h7M4 17h8M17.5 17H20" />
					<circle cx="15.5" cy="7" r="2.1" />
					<circle cx="10" cy="12" r="2.1" />
					<circle cx="14.5" cy="17" r="2.1" />
				</svg>
				<span>تنظیمات</span>
			</button>
		</nav>
	</div>

	<!--
		ورقِ پایین: جزئیاتِ سشن، انتخابِ منطقه، و هر چیزی که نباید جای

	<script>
// ── lib/sessions.js ──
// موتورِ سشن‌های بازار.
//
// ─── چرا فایلِ جدا ──────────────────────────────────────────────────
//
// این ۱۵۰ خط تنها بخشِ اپ است که هیچ وابستگی‌ای به DOM ندارد: ورودی‌اش

// می‌بُرید و با new Function اجرا می‌کرد. آن ترفند یک بار شکست: وقتی
// بازطراحی برگردانده شد فایلِ منبع جابه‌جا شد و تست ماه‌ها قرمز ماند،
// بی‌آنکه چیزی در محصول خراب باشد.
//
// ─── چطور به اپ می‌رسد ─────────────────────────────────────────────
//
// خروجی هنوز تک‌فایل است: scripts/build-econ-app.mjs این فایل را پیش
// از app.js می‌چسباند و «export » را برمی‌دارد. پس در مرورگر همان یک
// دامنه‌ی قبلی است، و در تست یک ماژولِ واقعی که import می‌شود.
//
// قاعده‌ی این پوشه: هیچ ارجاعی به document و window، و هیچ وابستگی به
// بقیه‌ی اپ. همین است که تست‌پذیرش می‌کند.

var SESSIONS = [
	{ key: "sydney", name: "سیدنی", flag: "au", zone: "Australia/Sydney", open: 7, close: 16 },
	{ key: "tokyo", name: "توکیو", flag: "jp", zone: "Asia/Tokyo", open: 9, close: 18 },
	{ key: "london", name: "لندن", flag: "gb", zone: "Europe/London", open: 8, close: 17 },
	{ key: "newyork", name: "نیویورک", flag: "us", zone: "America/New_York", open: 8, close: 17 },
	// The stock exchange, not the forex session: a narrower window
	// inside it, and where the equity open drives the dollar.
	{ key: "nyse", name: "بورس نیویورک", sub: "NYSE", flag: "us", zone: "America/New_York", open: 9, openMin: 30, close: 16 }
];

function sessionByKey(key) {
	for (var i = 0; i < SESSIONS.length; i++) {
		if (SESSIONS[i].key === key) return SESSIONS[i];
	}
	return null;
}

// Brokers stop trading for one hour at the daily rollover: 00:00–01:00
// on a GMT+3 server, which is 00:30–01:30 Tehran. Both clocks are
// fixed-offset, so the window is 21:00–22:00 UTC all year and does not
// move with anyone's DST.
var BREAK_START_UTC = 21 * 60;
var BREAK_END_UTC = 22 * 60;

function inDailyBreak(instant) {
	var d = new Date(instant);
	var m = d.getUTCHours() * 60 + d.getUTCMinutes();
	return m >= BREAK_START_UTC && m < BREAK_END_UTC;
}

// The end of the break window containing or following `instant`.
function breakEndAfter(instant) {
	var d = new Date(instant);
	var end = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 0, BREAK_END_UTC);
	return end > instant ? end : end + 86400000;
}

function breakStartAfter(instant) {
	var d = new Date(instant);
	var start = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 0, BREAK_START_UTC);
	return start > instant ? start : start + 86400000;
}

function tzParts(date, timeZone) {
	var dtf = new Intl.DateTimeFormat("en-US", {
		timeZone: timeZone, hour12: false,
		year: "numeric", month: "2-digit", day: "2-digit",
		hour: "2-digit", minute: "2-digit", second: "2-digit", weekday: "short"
	});
	var p = {};
	dtf.formatToParts(date).forEach(function (x) { if (x.type !== "literal") p[x.type] = x.value; });
	return p;
}

function tzOffsetMinutes(date, timeZone) {
	var p = tzParts(date, timeZone);
	var asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second);
	return Math.round((asUTC - date.getTime()) / 60000);
}

// The UTC instant of a wall-clock time on a local calendar date. Two
// passes settle the case where the first guess lands on the far side
// of a DST transition.
function instantAt(y, m, d, hour, minute, timeZone) {
	var guess = Date.UTC(y, m - 1, d, hour, minute);
	for (var i = 0; i < 2; i++) {
		guess = Date.UTC(y, m - 1, d, hour, minute) - tzOffsetMinutes(new Date(guess), timeZone) * 60000;
	}
	return guess;
}

function localDatePlus(now, timeZone, offset) {
	var p = tzParts(now, timeZone);
	var shifted = new Date(Date.UTC(+p.year, +p.month - 1, +p.day) + offset * 86400000);
	return {
		y: shifted.getUTCFullYear(), m: shifted.getUTCMonth() + 1,
		d: shifted.getUTCDate(), dow: shifted.getUTCDay()
	};
}

function occurrences(session, now, fromDay, toDay) {
	var out = [];
	for (var off = fromDay; off <= toDay; off++) {
		var dt = localDatePlus(now, session.zone, off);
		if (dt.dow === 0 || dt.dow === 6) continue; // markets rest at the weekend
		out.push({
			open: instantAt(dt.y, dt.m, dt.d, session.open, session.openMin || 0, session.zone),
			close: instantAt(dt.y, dt.m, dt.d, session.close, session.closeMin || 0, session.zone),
			dow: dt.dow
		});
	}
	return out.sort(function (a, b) { return a.open - b.open; });
}

function sessionState(session, now) {
	var t = now.getTime();
	var occ = occurrences(session, now, -2, 5);
	for (var i = 0; i < occ.length; i++) {
		if (t >= occ[i].open && t < occ[i].close) return { open: true, since: occ[i].open, until: occ[i].close };
	}
	for (var j = 0; j < occ.length; j++) {
		if (occ[j].open > t) return { open: false, nextOpen: occ[j].open, nextClose: occ[j].close };
	}
	return { open: false };
}

// The forex week runs from the Sydney open on Monday to the New York
// close on Friday. Quiet gaps between sessions inside that week are
// not closures, so they must not be reported as one.
function marketState(now) {
	var t = now.getTime();
	// Looked up by key, not index: the list is edited from time to
	// time and a shifted index would silently redefine the week.
	// The week does not begin with the Sydney bell: the first hour
	// of Monday's server day is the daily settlement window, so the
	// broker starts quoting when that window ends - 01:30 Tehran -
	// even though Sydney itself rings in earlier.
	var mondayOpens = occurrences(sessionByKey("sydney"), now, -9, 9)
		.filter(function (o) { return o.dow === 1; })
		.map(function (o) { return { open: Math.max(o.open, breakEndAfter(o.open - 1)), dow: o.dow }; });
	var fridayCloses = occurrences(sessionByKey("newyork"), now, -9, 9).filter(function (o) { return o.dow === 5; });

	var lastOpen = null;
	mondayOpens.forEach(function (o) { if (o.open <= t) lastOpen = o.open; });
	var matchingClose = null;
	for (var j = 0; j < fridayCloses.length; j++) {
		if (lastOpen !== null && fridayCloses[j].close > lastOpen) { matchingClose = fridayCloses[j].close; break; }
	}
	if (lastOpen !== null && matchingClose !== null && t >= lastOpen && t < matchingClose) {
		// Inside the trading week, but the broker still shuts for the
		// daily rollover hour. Report that as its own state: it is not
		// the weekend close, and it ends within the hour.
		if (inDailyBreak(t)) {
			return { open: false, onBreak: true, until: matchingClose, resumesAt: breakEndAfter(t) };
		}
		return { open: true, until: matchingClose };
	}
	var nextOpen = null;
	for (var k = 0; k < mondayOpens.length; k++) {
		if (mondayOpens[k].open > t) { nextOpen = mondayOpens[k].open; break; }
	}
	return { open: false, nextOpen: nextOpen };
}

function hhmmInZone(instant, timeZone) {
	var p = tzParts(new Date(instant), timeZone);
	return (p.hour % 24 < 10 ? "0" : "") + (p.hour % 24) + ":" + p.minute;
}

// A real ticking counter rather than prose. Beyond a day the seconds
// stop meaning anything, so the day count leads and the clock follows.

(function () {
	"use strict";

	// ═══════════════════════════════════════════════════════════════
	// «رصد»
	//
	// سه مقصد، نه سه تب: اکنون / تقویم / تنظیمات.
	//
	// «اکنون» جوابِ یک نگاه است - ساعت، وضعیتِ بازار، کدام سشن باز است،
	// خبرِ بعدی و چقدر مانده. سشن‌ها یک دیالِ ۲۴ ساعته‌اند نه پنج ردیفِ
	// نواری، و خبرها گره‌هایی روی یک خطِ زمان‌اند نه ردیف‌های یک جدول.
	//

	// ═══════════════════════════════════════════════════════════════

	var API = "https://sobhansamadi.mehdifx21hoseini.workers.dev/econ/miniapp";
	var tg = window.Telegram && window.Telegram.WebApp;

	// ── سازنده‌ی گره ────────────────────────────────────────────────
	function el(tag, cls, text) {
		var n = document.createElement(tag);
		if (cls) n.className = cls;
		if (text != null) n.textContent = text;

	// ── رقم ─────────────────────────────────────────────────────────
	var FA = "۰۱۲۳۴۵۶۷۸۹";
	function fa(v) { return String(v).replace(/[0-9]/g, function (d) { return FA[d]; }); }
	function pad(n) { return (n < 10 ? "0" : "") + n; }
	// ساعت با رقمِ لاتین. در فونتِ مونو هم‌عرض است و ستون نمی‌لرزد.
	function clock(v) { return String(v); }

	// ── تاریخ شمسی ──────────────────────────────────────────────────
	var J_M = ["فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور",
		"مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"];
	var WD = ["یکشنبه", "دوشنبه", "سه‌شنبه", "چهارشنبه", "پنج‌شنبه", "جمعه", "شنبه"];
	var G_M = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

	function toJalali(gy, gm, gd) {
		var gdm = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
		var jy = (gy <= 1600) ? 0 : 979;
		gy -= (gy <= 1600) ? 621 : 1600;
		var gy2 = (gm > 2) ? gy + 1 : gy;
		var days = 365 * gy + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100)
			+ Math.floor((gy2 + 399) / 400) - 80 + gd + gdm[gm - 1];
		jy += 33 * Math.floor(days / 12053);
		days %= 12053;
		jy += 4 * Math.floor(days / 1461);
		days %= 1461;
		if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
		var jm = (days < 186) ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
		var jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
		return [jy, jm, jd];
	}
	function jalaliLabel(iso) {
		var p = iso.split("-").map(Number);
		var j = toJalali(p[0], p[1], p[2]);
		return WD[new Date(p[0], p[1] - 1, p[2]).getDay()] + " " + fa(j[2]) + " " + J_M[j[1] - 1];
	}
	function gregLabel(iso) {
		var p = iso.split("-").map(Number);
		return p[2] + " " + G_M[p[1] - 1] + " " + p[0];
	}

	// ── منطقه‌ی زمانی ───────────────────────────────────────────────
	var ZONES = [
		{ key: "tehran", name: "تهران", zone: "Asia/Tehran" },
		{ key: "gmt", name: "گرینویچ", zone: "UTC" },
		{ key: "london", name: "لندن", zone: "Europe/London" },
		{ key: "newyork", name: "نیویورک", zone: "America/New_York" },
		{ key: "tokyo", name: "توکیو", zone: "Asia/Tokyo" },
		{ key: "sydney", name: "سیدنی", zone: "Australia/Sydney" },
		{ key: "dubai", name: "دبی", zone: "Asia/Dubai" }
	];
	var VIEW_KEY = "econAppZone";
	var viewZone = ZONES[0];
	function VIEW() { return viewZone.zone; }

	function offsetLabel(zone, at) {
		var m = tzOffsetMinutes(at || new Date(), zone);
		if (m === 0) return "GMT";
		var sign = m > 0 ? "+" : "−";
		var a = Math.abs(m);
		return "GMT" + sign + Math.floor(a / 60) + (a % 60 ? ":" + pad(a % 60) : "");
	}
	function dayInZone(instant, zone) {
		try {
			return new Intl.DateTimeFormat("fa-IR", { timeZone: zone, weekday: "long" }).format(new Date(instant));
		} catch (e) { return ""; }
	}

	// دقیقه‌ی روز در یک منطقه - پایه‌ی هر چیزی که روی دیال کشیده می‌شود.
	function minutesInZone(instant, zone) {
		var p = tzParts(new Date(instant), zone);
		return Number(p.hour) * 60 + Number(p.minute);
	}

	// ── حالت ────────────────────────────────────────────────────────
	var LEVELS = [
		{ key: "high", fa: "مهم", en: "High impact", dot: "" },
		{ key: "medium", fa: "متوسط", en: "Medium impact", dot: "md" },
		{ key: "low", fa: "کم‌اهمیت", en: "Low impact", dot: "lo" }
	];
	var LEVELS_KEY = "econ.levels";
	var ROUTE_KEY = "econAppRoute";
	var RANGE_KEY = "econAppRange";

	var CURRENCIES = [
		{ code: "USD", fa: "دلار آمریکا" },
		{ code: "EUR", fa: "یورو" },
		{ code: "GBP", fa: "پوند انگلیس" },
		{ code: "JPY", fa: "ین ژاپن" },
		{ code: "AUD", fa: "دلار استرالیا" },
		{ code: "CAD", fa: "دلار کانادا" },
		{ code: "NZD", fa: "دلار نیوزیلند" },
		{ code: "CHF", fa: "فرانک سوئیس" }
	];
	var FLAG_BY_CCY = { USD: "us", GBP: "gb", JPY: "jp", AUD: "au" };
	var CUR_FA = {
		USD: "دلار", EUR: "یورو", GBP: "پوند", JPY: "ین",
		AUD: "دلار استرالیا", CAD: "دلار کانادا", NZD: "دلار نیوزیلند", CHF: "فرانک"
	};

	var state = {
		route: "now",
		range: "today",
		query: "",
		data: null,
		failure: null,
		lastOk: null,
		saving: false,
		savePending: false,
		levels: { high: true, medium: true, low: false },
		open: {}
	};

	function levelOn(imp) {
		if (!imp || !(imp in state.levels)) return true;
		return state.levels[imp];
	}
	function store(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ترجیح است، نه داده */ } }
	function recall(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

	function loadPrefs() {
		var z = recall(VIEW_KEY);
		ZONES.forEach(function (x) { if (x.key === z) viewZone = x; });
		var r = recall(ROUTE_KEY);
		if (r === "now" || r === "cal" || r === "me") state.route = r;
		var g = recall(RANGE_KEY);
		if (g === "today" || g === "week") state.range = g;
		try {
			var raw = recall(LEVELS_KEY);
			if (raw) {
				var v = JSON.parse(raw);
				LEVELS.forEach(function (l) {
					if (typeof v[l.key] === "boolean") state.levels[l.key] = v[l.key];
				});
			}
		} catch (e) { /* ترجیح است، نه داده */ }
	}

	// ── شبکه ────────────────────────────────────────────────────────
	function call(payload) {
		payload.initData = tg ? tg.initData : "";
		return fetch(API, {
			method: "POST",
			headers: { "Content-Type": "application/json" },
			body: JSON.stringify(payload)
		}).then(function (res) {
			return res.json().catch(function () { return {}; }).then(function (body) {
				if (!res.ok || body.success === false) {
					var err = new Error(body.error || ("خطای سرور (" + res.status + ")"));
					err.status = res.status;
					throw err;
				}
				return body;
			});
		});
	}

	function load() {
		return call({ action: "data" })
			.then(function (body) {
				state.data = body;
				state.failure = null;
				state.lastOk = Date.now();
				render();
			})
			.catch(function (err) {
				state.failure = err.status === 401
					? { msg: "تلگرام نتونست هویتت رو تأیید کنه. برنامه رو ببند و از دکمه‌ی داخل ربات دوباره بازش کن.", retry: false }
					: { msg: "دریافت اطلاعات ناموفق بود.", retry: true };
				render();
			});

	// ── داده‌ی رویداد ───────────────────────────────────────────────
	function atOf(e) { return e.at ? new Date(e.at).getTime() : null; }
	function isPast(e) { var t = atOf(e); return t !== null && t < Date.now(); }

	function todays() {
		if (!state.data) return [];
		var d = state.data.today;
		return state.data.events.filter(function (e) { return e.date === d; });
	}

	function matches(e) {
		var q = state.query.trim().toLowerCase();
		if (!q) return true;
		return ((e.en || "") + " " + (e.title || "") + " " + (e.short || "") + " " + (e.currency || ""))
			.toLowerCase().indexOf(q) !== -1;
	}

	function visible() {
		if (!state.data) return [];
		var today = state.data.today;
		var weekEnd = new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10);
		return state.data.events.filter(function (e) {
			if (!levelOn(e.importance)) return false;
			if (state.query) return matches(e);
			if (state.range === "today" && e.date !== today) return false;
			if (state.range === "week" && e.date > weekEnd) return false;
			return true;
		});
	}

	function nextEvent() {
		var now = Date.now();
		return todays().filter(function (e) {
			var t = atOf(e);
			return t !== null && t > now && levelOn(e.importance);
		}).sort(function (a, b) { return atOf(a) - atOf(b); })[0] || null;
	}

	// ── عدد ─────────────────────────────────────────────────────────
	function numOf(v) {
		var m = /^\s*([+-]?[\d.,]+)/.exec(String(v || ""));
		if (!m) return null;
		var n = parseFloat(m[1].replace(/,/g, ""));
		return isNaN(n) ? null : n;
	}
	function unitOf(v) {
		var m = /([%KMBT])\s*$/i.exec(String(v || ""));
		return m ? m[1].toUpperCase() : "";
	}
	function decOf(v) {
		var s = String(v || "").replace(/[^0-9.]/g, "").split(".")[1];
		return s ? s.length : 0;
	}

	/** اختلافِ واقعی با پیش‌بینی. رقمِ اعشار از خودِ ورودی می‌آید. */
	function deltaOf(e) {
		var a = numOf(e.actual), f = numOf(e.forecast);
		if (a === null || f === null) return null;
		var d = a - f;
		var dec = Math.max(decOf(e.actual), decOf(e.forecast));
		if (Math.abs(d) < Math.pow(10, -dec) / 2) return { flat: true, text: "مطابق پیش‌بینی" };
		var unit = unitOf(e.forecast) === "%" ? "" : unitOf(e.forecast);
		return { flat: false, text: (d > 0 ? "+" : "−") + fa(Math.abs(d).toFixed(dec)) + unit };
	}

	/** رنگِ عدد از قضاوتِ سرور می‌آید، نه بالا/پایینِ خام. */
	function tone(e) { return e.read ? (e.read.good ? "is-up" : "is-down") : ""; }

	function until(ms) {
		var m = Math.max(0, Math.round((ms - Date.now()) / 60000));
		if (m < 1) return "همین حالا";
		if (m < 60) return fa(m) + " دقیقه";
		var h = Math.floor(m / 60), r = m % 60;
		if (h < 24) return fa(h) + " ساعت" + (r ? " و " + fa(r) + " دقیقه" : "");
		return fa(Math.round(h / 24)) + " روز";
	}
	function countdown(ms) {
		var s = Math.max(0, Math.floor((ms - Date.now()) / 1000));
		var d = Math.floor(s / 86400);
		if (d > 0) return fa(d) + " روز " + pad(Math.floor(s % 86400 / 3600)) + ":" + pad(Math.floor(s % 3600 / 60));
		return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s % 3600 / 60)) + ":" + pad(s % 60);
	}

	function flagNode(ccy) {
		var id = FLAG_BY_CCY[String(ccy || "").toUpperCase()];
		var box = el("span", "fl");
		var svg = svgEl("svg", { viewBox: "0 0 512 512", "aria-hidden": "true" });
		if (id) {
			svg.appendChild(svgEl("use", { href: "#fi-" + id }));
		} else {
			svg.setAttribute("viewBox", "0 0 24 24");
			svg.setAttribute("fill", "none");
			svg.setAttribute("stroke", "currentColor");
			svg.setAttribute("stroke-width", "1.6");
			["M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18", "M3 12h18", "M12 3c2.6 2.4 2.6 15.6 0 18", "M12 3c-2.6 2.4-2.6 15.6 0 18"]
				.forEach(function (d) { svg.appendChild(svgEl("path", { d: d })); });
		}
		box.appendChild(svg);
		return box;
	}

	// ═══════════════════════════════════════════════════════════════
	// دیالِ ۲۴ ساعته
	//
	// چرا دیال و نه پنج نوارِ افقی: نوارها همان زبانِ تقویم‌های سنتی‌اند
	// و روی عرضِ گوشی هر کدام چند پیکسل می‌شوند. روز *دوره‌ای* است -
	// دایره شکلِ طبیعیِ آن است، هم‌پوشانی‌ها به‌شکلِ کمان‌های هم‌مرکز خودشان
	// را نشان می‌دهند، و عقربه بدونِ هیچ برچسبی می‌گوید کجای روزیم.
	// ═══════════════════════════════════════════════════════════════
	var DIAL = { size: 260, cx: 130, cy: 130, r0: 118 };

	function polar(min, r) {
		// دقیقه‌ی صفر بالای دیال، و ساعت‌ها ساعتگرد.
		var a = (min / 1440) * Math.PI * 2 - Math.PI / 2;
		return [DIAL.cx + r * Math.cos(a), DIAL.cy + r * Math.sin(a)];
	}
	function arcPath(from, to, r) {
		var span = to - from;
		if (span <= 0) return "";
		// کمانِ کامل با یک path کشیده نمی‌شود؛ کمی کوتاهش می‌کنیم.
		if (span >= 1439) span = 1438;
		var a = polar(from, r), b = polar(from + span, r);
		return "M" + a[0].toFixed(2) + " " + a[1].toFixed(2) +
			" A" + r + " " + r + " 0 " + (span > 720 ? 1 : 0) + " 1 " + b[0].toFixed(2) + " " + b[1].toFixed(2);
	}

	function buildDial(now) {
		var svg = svgEl("svg", {
			class: "dial", viewBox: "0 0 " + DIAL.size + " " + DIAL.size,
			role: "img", "aria-label": "دیال ۲۴ ساعته‌ی بازارها"
		});

		// حلقه‌ی بیرونی و نشانه‌ی هر شش ساعت.
		svg.appendChild(svgEl("circle", { class: "dial-ring", cx: DIAL.cx, cy: DIAL.cy, r: DIAL.r0 }));
		[0, 6, 12, 18].forEach(function (h) {
			var p1 = polar(h * 60, DIAL.r0 - 5), p2 = polar(h * 60, DIAL.r0 + 2);
			svg.appendChild(svgEl("line", { class: "dial-tick", x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1] }));
			var lp = polar(h * 60, DIAL.r0 + 11);
			var t = svgEl("text", { class: "dial-hour", x: lp[0], y: lp[1] });
			t.textContent = pad(h);
			svg.appendChild(t);
		});

		// خبرهای امروز روی حلقه‌ی بیرونی: هرچه مهم‌تر، بلندتر.
		todays().forEach(function (e) {
			if (!e.at || !levelOn(e.importance)) return;
			var m = minutesInZone(atOf(e), VIEW());
			var len = e.importance === "high" ? 11 : e.importance === "medium" ? 7 : 4;
			var w = e.importance === "high" ? 2.4 : 1.6;
			var p1 = polar(m, DIAL.r0 - 3), p2 = polar(m, DIAL.r0 - 3 - len);
			svg.appendChild(svgEl("line", {
				class: "dial-ev" + (e.importance === "high" ? " is-high" : "") + (isPast(e) ? " is-done" : ""),
				x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], "stroke-width": w
			}));
		});

		// یک کمان برای هر سشن، هرکدام روی شعاعِ خودش.
		var r = DIAL.r0 - 24;
		SESSIONS.forEach(function (s) {
			var st = sessionState(s, now);
			var hol = holidayToday(s);
			var ref = st.open ? { open: st.since, close: st.until }
				: (st.nextOpen ? { open: st.nextOpen, close: st.nextClose } : null);
			if (ref) {
				var from = minutesInZone(ref.open, VIEW());
				var span = Math.round((ref.close - ref.open) / 60000);
				var arc = svgEl("path", {
					class: "dial-arc" + (st.open && !hol ? " is-open" : ""),
					d: arcPath(from, from + span, r),
					stroke: "var(--k-" + s.key + ")",
					"stroke-width": st.open && !hol ? 7 : 5
				});
				svg.appendChild(arc);
			}
			r -= 12;
		});

		// عقربه‌ی «حالا».
		var nowMin = minutesInZone(now.getTime(), VIEW());
		var h1 = polar(nowMin, DIAL.r0 - 2), h2 = polar(nowMin, DIAL.r0 - 78);
		svg.appendChild(svgEl("line", { class: "dial-hand", x1: h1[0], y1: h1[1], x2: h2[0], y2: h2[1] }));
		svg.appendChild(svgEl("circle", { class: "dial-dot", cx: h1[0], cy: h1[1], r: 3.4 }));
		return svg;
	}

	function holidayToday(s) {
		if (!state.data || !state.data.holidays || !state.data.holidays.length) return null;
		// تعطیلیِ منتشرشده مالِ بازارهای آمریکاست؛ فید کشور نمی‌دهد.
		if (s.key !== "newyork" && s.key !== "nyse") return null;
		var d = state.data.today;
		for (var i = 0; i < state.data.holidays.length; i++) {
			if (state.data.holidays[i].date === d) return state.data.holidays[i];
		}
		return null;
	}

	// ═══════════════════════════════════════════════════════════════
	// صحنه‌ها
	// ═══════════════════════════════════════════════════════════════

	function render() {
		var stage = $("stage");
		stage.textContent = "";
		$("zoneName").textContent = viewZone.name;
		$("zoneOff").textContent = offsetLabel(VIEW());

		if (state.failure) { stage.appendChild(failureView()); return; }
		if (!state.data) { stage.appendChild(loadingView()); return; }

		if (state.route === "now") stage.appendChild(viewNow());
		else if (state.route === "cal") stage.appendChild(viewCal());
		else stage.appendChild(viewMe());

		syncDock();
	}

	function loadingView() {
		var w = el("div", null);
		w.style.paddingTop = "24px";
		for (var i = 0; i < 4; i++) w.appendChild(el("div", "skel"));
		return w;
	}

	function stateBlock(glyph, title, body, action) {
		var w = el("div", "state");
		var g = el("div", "state-glyph");
		var svg = svgEl("svg", { viewBox: "0 0 24 24", width: "20", height: "20", fill: "none", stroke: "currentColor", "stroke-width": "1.7", "stroke-linecap": "round" });
		(glyph || []).forEach(function (d) { svg.appendChild(svgEl("path", { d: d })); });
		g.appendChild(svg);
		w.appendChild(g);
		w.appendChild(el("h3", null, title));
		var p = el("p", null);
		p.innerHTML = body;
		w.appendChild(p);
		if (action) w.appendChild(action);
		return w;
	}

	function failureView() {
		var body = state.failure.msg;
		if (state.lastOk) {
			body += "<br>آخرین بروزرسانیِ موفق: " +
				'<span class="n">' + hhmmInZone(state.lastOk, VIEW()) + "</span>";
		}
		var btn = null;
		if (state.failure.retry) {
			btn = el("button", "btn", "تلاش دوباره");
			btn.type = "button";
			btn.addEventListener("click", function () { state.failure = null; render(); load(); });
		}
		return stateBlock(["M12 3v9", "M6.6 6.6a9 9 0 1 0 10.8 0"], "داده در دسترس نیست", body, btn);
	}

	// ── اکنون ───────────────────────────────────────────────────────
	var tickers = [];

	function viewNow() {
		tickers = [];
		var now = new Date();
		var market = marketState(now);
		var weekend = !market.open && !market.onBreak && !!market.nextOpen;

		var wrap = el("div", null);

		var dialBox = el("div", "now");
		dialBox.appendChild(buildDial(now));

		var read = el("div", "now-read");
		var t = el("div", "now-time n", hhmmInZone(now.getTime(), VIEW()));
		read.appendChild(t);
		tickers.push(function () { t.textContent = hhmmInZone(Date.now(), VIEW()); });
		var stateWord = market.onBreak ? "تسویه" : (market.open ? "باز" : (weekend ? "آخر هفته" : "بسته"));
		read.appendChild(el("div", "now-state" + (market.open ? "" : " is-shut"), stateWord));
		dialBox.appendChild(read);
		wrap.appendChild(dialBox);

		// یک جمله به‌جای پنج ردیف.
		var openNames = SESSIONS.filter(function (s) {
			return sessionState(s, now).open && !holidayToday(s);
		}).map(function (s) { return s.name; });
		var line = el("div", "now-line");
		line.style.marginInline = "auto";
		if (weekend && market.nextOpen) {
			line.innerHTML = "بازارها تا <b>" + dayInZone(market.nextOpen, VIEW()) + " " +
				'<span class="n">' + hhmmInZone(market.nextOpen, VIEW()) + "</span></b> بسته‌اند.";
		} else if (market.onBreak && market.resumesAt) {
			line.innerHTML = "تسویه‌ی روزانه — از سر گرفته می‌شود <b>" +
				'<span class="n">' + hhmmInZone(market.resumesAt, VIEW()) + "</span></b>";
		} else if (openNames.length >= 2) {
			line.innerHTML = "<b>" + openNames.join(" و ") + "</b> هم‌زمان باز — پرنوسان‌ترین ساعت‌های روز.";
		} else if (openNames.length === 1) {
			line.innerHTML = "<b>" + openNames[0] + "</b> باز است.";
		} else if (market.nextOpen) {
			line.innerHTML = "بازارِ بعدی <b>" + '<span class="n">' + hhmmInZone(market.nextOpen, VIEW()) + "</span></b> باز می‌شود.";
		}
		if (line.innerHTML) wrap.appendChild(line);

		// لژِ سشن‌ها: تراشه‌های کوچک، هرکدام درِ ورودیِ جزئیات.
		var lede = el("div", "lede");
		SESSIONS.forEach(function (s) {
			var st = sessionState(s, now);
			var hol = holidayToday(s);
			var b = el("button", "lede" + (st.open && !hol ? "" : ""));
			b.type = "button";
			b.className = (st.open && !hol ? "is-open" : "") + (hol ? " is-hol" : "");
			b.style.setProperty("--k", "var(--k-" + s.key + ")");
			b.appendChild(el("span", "kdot"));
			b.appendChild(el("span", null, s.name));
			b.addEventListener("click", function () { openSession(s); });
			lede.appendChild(b);
		});
		wrap.appendChild(lede);

		// رویدادِ بعدی — بزرگ‌ترین چیزِ صفحه بعد از ساعت.
		var nx = nextEvent();
		if (nx) {
			var card = el("div", "upnext");
			card.appendChild(el("div", "upnext-k", "رویداد بعدی"));
			var cd = el("div", "upnext-cd n", countdown(atOf(nx)));
			card.appendChild(cd);
			tickers.push(function () { cd.textContent = countdown(atOf(nx)); });
			card.appendChild(el("div", "upnext-name", nx.en || nx.title || nx.short || ""));
			if (nx.title) card.appendChild(el("div", "upnext-fa", nx.title));
			var meta = el("div", "upnext-meta");
			meta.appendChild(el("span", "n", hhmmInZone(atOf(nx), VIEW())));
			meta.appendChild(el("span", "node-cur", nx.currency || ""));
			meta.appendChild(el("span", null, impWord(nx.importance)));
			card.appendChild(meta);
			wrap.appendChild(card);
		}

		// جریانِ امروز.
		var h = el("div", "sec-h");
		h.appendChild(el("h2", null, "امروز"));
		var todayShown = todays().filter(function (e) { return levelOn(e.importance); });
		h.appendChild(el("span", "aside", state.data ? jalaliLabel(state.data.today) : ""));
		wrap.appendChild(h);

		if (todayShown.length) {
			wrap.appendChild(buildStream(todayShown, false));
		} else {
			wrap.appendChild(emptyToday(weekend, market));
		}

		// تحلیل.
		wrap.appendChild(aiBlock());
		return wrap;
	}

	function impWord(imp) {
		return imp === "high" ? "مهم" : imp === "medium" ? "متوسط" : "کم‌اهمیت";
	}

	function emptyToday(weekend, market) {
		var off = LEVELS.filter(function (l) { return !state.levels[l.key]; });
		if (weekend) {
			var msg = "بازارها بسته‌اند و داده‌ی تازه‌ای منتشر نمی‌شود.";
			if (market.nextOpen) {
				msg += "<br>دوباره " + dayInZone(market.nextOpen, VIEW()) + " ساعت " +
					'<span class="n">' + hhmmInZone(market.nextOpen, VIEW()) + "</span> باز می‌شوند.";
			}
			return stateBlock(["M12 3v2", "M12 19v2", "M5 12H3", "M21 12h-2", "M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8"],
				"آخر هفته", msg, null);
		}
		if (off.length) {
			var b = el("button", "btn", "باز کردن تنظیمات");
			b.type = "button";
			b.addEventListener("click", function () { go("me"); });
			return stateBlock(["M4 6h16", "M4 12h10", "M4 18h6"], "خبری در سطح‌های روشن نیست",
				"سطح " + off.map(function (l) { return l.fa; }).join(" و ") + " خاموش است.", b);
		}
		return stateBlock(["M4 6h16", "M4 12h10", "M4 18h6"], "امروز رویدادی نیست",
			"برای امروز چیزی در تقویم ثبت نشده.", null);
	}

	// ── تقویم ───────────────────────────────────────────────────────
	function viewCal() {
		tickers = [];
		var wrap = el("div", null);

		var bar = el("div", null);
		bar.style.cssText = "display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px";
		var seg = el("div", "seg");
		[["today", "امروز"], ["week", "هفته"]].forEach(function (r) {
			var b = el("button", null, r[1]);
			b.type = "button";
			b.setAttribute("aria-pressed", state.range === r[0] ? "true" : "false");
			b.addEventListener("click", function () {
				state.range = r[0];
				store(RANGE_KEY, r[0]);
				haptic("select");
				render();
			});
			seg.appendChild(b);
		});
		bar.appendChild(seg);
		var offCount = LEVELS.filter(function (l) { return !state.levels[l.key]; }).length;
		if (offCount) {
			var flt = el("button", null, fa(3 - offCount) + " از " + fa(3) + " سطح");
			flt.type = "button";
			flt.style.cssText = "appearance:none;border:0;background:none;font-family:inherit;font-size:12px;font-weight:600;color:var(--dim);cursor:pointer;min-height:36px";
			flt.addEventListener("click", function () { go("me"); });
			bar.appendChild(flt);
		}
		wrap.appendChild(bar);

		var find = el("label", "find");
		var svg = svgEl("svg", { viewBox: "0 0 24 24", width: "15", height: "15", fill: "none", stroke: "currentColor", "stroke-width": "2", "stroke-linecap": "round" });
		svg.appendChild(svgEl("circle", { cx: 11, cy: 11, r: 7 }));
		svg.appendChild(svgEl("path", { d: "m20 20-3.2-3.2" }));
		find.appendChild(svg);
		var inp = el("input", null);
		inp.type = "search";
		inp.id = "findInput";
		inp.autocomplete = "off";
		inp.placeholder = "جستجوی شاخص… مثلاً CPI یا تورم";
		inp.value = state.query;
		inp.addEventListener("input", function () {
			state.query = this.value;
			var host = $("calStream");
			if (!host) return;
			host.textContent = "";
			paintCal(host);
		});
		find.appendChild(inp);
		wrap.appendChild(find);

		var host = el("div", null);
		host.id = "calStream";
		wrap.appendChild(host);
		paintCal(host);
		return wrap;
	}

	function paintCal(host) {
		var rows = visible();
		if (!rows.length) {
			host.appendChild(stateBlock(["M4 6h16", "M4 12h10", "M4 18h6"],
				state.query ? "چیزی پیدا نشد" : "رویدادی نیست",
				state.query ? "برای این جستجو رویدادی در بازه‌ی بارگذاری‌شده نبود." : "برای این بازه چیزی ثبت نشده.",
				null));
			return;
		}
		// گروه‌بندی به روز، با سرصفحه‌ی سبک.
		var byDay = [];
		var seen = {};
		rows.forEach(function (e) {
			if (!seen[e.date]) { seen[e.date] = []; byDay.push(e.date); }
			seen[e.date].push(e);
		});
		byDay.forEach(function (d) {
			var head = el("div", "daymark");
			head.appendChild(el("span", null, jalaliLabel(d)));
			var g = el("span", "g", gregLabel(d));
			g.dir = "ltr";
			head.appendChild(g);
			if (state.data && d === state.data.today) head.appendChild(el("span", "today", "امروز"));
			host.appendChild(head);
			host.appendChild(buildStream(seen[d], true));
		});
	}

	// ── جریان و گره ─────────────────────────────────────────────────
	function buildStream(rows, compact) {
		var s = el("div", "stream");
		rows.slice().sort(function (a, b) {
			var x = atOf(a), y = atOf(b);
			if (x === null) return 1;
			if (y === null) return -1;
			return x - y;
		}).forEach(function (e) { s.appendChild(buildNode(e, compact)); });
		return s;
	}

	function buildNode(e, compact) {
		var imp = e.importance || "low";
		var at = atOf(e);
		var done = isPast(e);
		var live = !done && at !== null && at - Date.now() < 30 * 60000;

		var node = el("div", "node imp-" + imp +
			(done ? " is-done" : "") + (e.actual ? " has-actual" : "") + (live ? " is-live" : ""));

		node.appendChild(el("div", "node-t", e.time_tehran
			? clock(hhmmInZone(at, VIEW()))
			: "—"));

		var head = el("button", "node-head");
		head.type = "button";
		head.setAttribute("aria-expanded", state.open[e.event_id] ? "true" : "false");

		var top = el("div", "node-top");
		top.appendChild(flagChipSmall(e));
		top.appendChild(el("span", "node-cur", e.currency || ""));
		top.appendChild(el("span", "node-gap"));
		if (live) top.appendChild(el("span", "node-tag is-live", "تا " + until(at)));
		else if (!done && at !== null && !compact) top.appendChild(el("span", "node-tag", "تا " + until(at)));
		else if (done && !e.actual) top.appendChild(el("span", "node-tag", "منتشر شد"));
		head.appendChild(top);

		head.appendChild(el("div", "node-name", e.en || e.title || e.short || ""));
		if (e.title && e.title !== (e.en || "")) head.appendChild(el("div", "node-fa", e.title));

		if (e.actual) {
			var out = el("div", "node-out");
			out.appendChild(el("span", "node-actual n " + tone(e), fa(e.actual)));
			var d = deltaOf(e);
			if (d) out.appendChild(el("span", "node-delta", d.flat ? d.text : d.text));
			head.appendChild(out);
		}

		node.appendChild(head);

		var more = el("div", "node-more");
		more.hidden = !state.open[e.event_id];
		more.appendChild(detailBody(e));
		node.appendChild(more);

		head.addEventListener("click", function () {
			state.open[e.event_id] = !state.open[e.event_id];
			more.hidden = !state.open[e.event_id];
			head.setAttribute("aria-expanded", state.open[e.event_id] ? "true" : "false");
			haptic("select");
		});
		return node;
	}

	function flagChipSmall(e) {
		var f = flagNode(e.currency);

	/**
	 * بازشده‌ی یک رویداد.
	 *
	 * به‌جای جدولِ سه‌ستونیِ «قبلی / پیش‌بینی / واقعی» - که همان زبانِ
	 * تقویم‌های سنتی است - یک محور کشیده می‌شود: پیش‌بینی نقطه‌ی صفر، و
	 * واقعی از آن فاصله می‌گیرد. نسبت دیده می‌شود، نه فقط سه عدد.
	 */
	function detailBody(e) {
		var box = el("div", "node-body");

		var f = numOf(e.forecast), a = numOf(e.actual), p = numOf(e.previous);
		if (f !== null && a !== null) {
			box.appendChild(buildGauge(e, f, a, p));
		}

		var facts = el("div", "facts");
		function fact(k, v, extra) {
			var s = el("span", null);
			s.appendChild(document.createTextNode(k + " "));
			s.appendChild(el("b", null, v ? fa(v) : "—"));
			if (extra) s.appendChild(el("span", "rev", " " + extra));
			facts.appendChild(s);
		}
		fact("قبلی", e.previous, e.previous_before ? "(بازنگری از " + fa(e.previous_before) + ")" : "");
		fact("پیش‌بینی", e.forecast, "");
		if (!numOf(e.actual) && e.actual) fact("واقعی", e.actual, "");
		box.appendChild(facts);

		// خوانش: پس از انتشار قضاوت، پیش از آن قاعده‌ی کلی.
		var cur = CUR_FA[e.currency] || "ارز";
		if (e.read) {
			box.appendChild(el("div", "effect " + (e.read.good ? "is-good" : "is-bad"),
				(e.read.higher ? "بالاتر از پیش‌بینی — " : "پایین‌تر از پیش‌بینی — ") +
				(e.read.good ? "معمولاً مثبت برای " : "معمولاً منفی برای ") + cur));
		} else if (e.direction) {
			box.appendChild(el("div", "effect",
				e.direction === "inverse"
					? "معمولاً عددِ پایین‌تر از پیش‌بینی به نفعِ " + cur + " است"
					: "معمولاً عددِ بالاتر از پیش‌بینی به نفعِ " + cur + " است"));
		}

		var sp = sparkline(e);
		if (sp) box.appendChild(sp);
		return box;
	}

	function buildGauge(e, f, a, p) {
		var g = el("div", "gauge");
		// دامنه: پیش‌بینی وسط، و بزرگ‌ترین انحراف لبه را تعیین می‌کند.
		var spread = Math.max(Math.abs(a - f), p !== null ? Math.abs(p - f) : 0);
		if (!spread) spread = Math.abs(f) * .05 || 1;
		var span = spread * 2.4;
		function at(v) { return Math.max(4, Math.min(96, 50 + ((v - f) / span) * 100)); }

		g.appendChild(el("div", "gauge-rail"));
		var mid = at(f), av = at(a);
		var fill = el("div", "gauge-fill " + (e.read ? (e.read.good ? "is-up" : "is-down") : ""));
		fill.style.insetInlineStart = Math.min(mid, av) + "%";
		fill.style.width = Math.abs(av - mid) + "%";
		g.appendChild(fill);

		var pinF = el("div", "gauge-pin");
		pinF.style.insetInlineStart = mid + "%";
		g.appendChild(pinF);
		var labF = el("div", "gauge-lab", "پیش‌بینی");
		labF.style.insetInlineStart = mid + "%";
		g.appendChild(labF);

		if (p !== null) {
			var pinP = el("div", "gauge-pin");
			pinP.style.insetInlineStart = at(p) + "%";
			pinP.style.opacity = ".5";
			g.appendChild(pinP);
		}

		var val = el("div", "gauge-val " + (e.read ? (e.read.good ? "is-up" : "is-down") : ""), fa(e.actual));
		val.style.insetInlineStart = av + "%";
		val.style.color = e.read ? (e.read.good ? "var(--up)" : "var(--down)") : "var(--text)";
		g.appendChild(val);
		return g;
	}

	function sparkline(e) {
		var rows = (e.history || []).filter(function (h) { return typeof h.value === "number"; });
		if (rows.length < 3) return null;
		var ordered = rows.slice().reverse();
		var vals = ordered.map(function (h) { return h.value; });
		var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
		var span = hi - lo || 1;
		var wrap = el("div", null);
		var bars = el("div", "spark");
		ordered.forEach(function (h) {
			var good = e.direction === "inverse" ? !(h.beat > 0) : (h.beat > 0);
			var i = el("i", h.beat === 0 ? "" : (good ? "up" : "down"));
			i.style.height = (20 + ((h.value - lo) / span) * 80) + "%";
			bars.appendChild(i);
		});
		wrap.appendChild(bars);
		wrap.appendChild(el("div", "spark-k", fa(ordered.length) + " انتشار اخیر"));
		return wrap;
	}

	/**
	 * ذخیره‌ی ترجیح‌ها.
	 *
	 * اگر ذخیره‌ای در راه باشد، تغییرِ تازه *دور ریخته نمی‌شود* - علامت
	 * می‌خورد و بعد از برگشتِ اولی دوباره فرستاده می‌شود.
	 *
	 * نسخه‌ی قبلی در این حالت بی‌صدا return می‌کرد، و تستِ ناوبری همان را
	 * گرفت: وقتی کاربر سریع دو تنظیم را عوض می‌کند - مثلاً ارز و بعد
	 * دقیقه‌ی هشدار - دومی هرگز به سرور نمی‌رسید و صفحه هم چیزی نمی‌گفت.
	 */
	function save() {
		if (!state.data || !state.data.subscription) return;
		if (state.saving) { state.savePending = true; return; }
		state.saving = true;
		state.savePending = false;
		var s = state.data.subscription;
		call({
			action: "subscribe",
			subscribed: s.subscribed,
			alert_minutes: s.alert_minutes,
			show_low_importance: s.show_low_importance,
			currencies: s.currencies
		}).then(function (body) {
			// مقدارِ ذخیره‌شده مرجع است، نه چیزی که فرستادیم - سرور ممکن
			// است کدی را دور ریخته باشد.
			//
			// ولی *درجا* نوشته می‌شود، نه با جای‌گزینیِ خودِ شیء: کنترل‌های
			// تنظیمات به همین شیء ارجاع دارند، و عوض کردنِ مرجع یعنی هر
			// تغییرِ بعدیِ کاربر روی یک شیءِ جدامانده می‌نشیند و بی‌صدا گم
			// می‌شود. تستِ ناوبری همین را گرفت: دقیقه‌ی هشدار عوض می‌شد و
			// هیچ‌وقت به سرور نمی‌رسید.
			if (body && body.subscription) {
				var fresh = body.subscription;
				for (var k in fresh) if (Object.prototype.hasOwnProperty.call(fresh, k)) s[k] = fresh[k];
			}
		}).catch(function () { /* بی‌صدا: تلاشِ بعدی خودش می‌فرستد */ })
			.then(function () {
				state.saving = false;
				if (state.savePending) save();
			});
	}

			body.appendChild(head);

			var ref = st.open ? { open: st.since, close: st.until }
				: (st.nextOpen ? { open: st.nextOpen, close: st.nextClose } : null);

				fact("به وقت محلی",
					hhmmInZone(ref.open, s.zone) + "–" + hhmmInZone(ref.close, s.zone));

	// ── ناوبری ──────────────────────────────────────────────────────
	var ROUTES = [["navNow", "now"], ["navCal", "cal"], ["navMe", "me"]];

	function syncDock() {
		var idx = 0;
		ROUTES.forEach(function (p, i) {
			var on = p[1] === state.route;
			$(p[0]).setAttribute("aria-selected", on ? "true" : "false");
			if (on) idx = i;
		});
		// در راست‌به‌چپ، گزینه‌ی اول سمتِ راست است؛ نشانگر باید به چپ برود.
		$("dockPill").style.transform = "translateX(" + (-idx * 100) + "%)";
	}

	function go(route) {
		if (state.route === route) {
			window.scrollTo({ top: 0, behavior: "smooth" });
			return;
		}
		state.route = route;
		store(ROUTE_KEY, route);
		haptic("select");
		render();
		window.scrollTo({ top: 0 });
	}

	ROUTES.forEach(function (p) {
		$(p[0]).addEventListener("click", function () { go(p[1]); });
	});
	$("btnZone").addEventListener("click", openZones);
	$("scrim").addEventListener("click", closeSheet);
	$("sheetClose").addEventListener("click", closeSheet);
	document.addEventListener("keydown", function (ev) {
		if (ev.key === "Escape" && !$("sheet").hidden) closeSheet();
	});

	$("btnRefresh").addEventListener("click", function () {
		var b = this;
		if (b.classList.contains("is-busy")) return;
		b.classList.add("is-busy");
		haptic();
		load().then(function () { b.classList.remove("is-busy"); });
	});

	// ── تم ──────────────────────────────────────────────────────────
	function applyScheme() {
		if (!tg || !tg.colorScheme) return;
		document.documentElement.setAttribute("data-theme", tg.colorScheme === "dark" ? "dark" : "light");
		if (tg.setHeaderColor) {
			var st = getComputedStyle(document.documentElement);
			try { tg.setHeaderColor(st.getPropertyValue("--bg").trim()); } catch (e) { /* older clients */ }
		}
	}

	// ── راه‌اندازی ──────────────────────────────────────────────────
	loadPrefs();

	if (tg) {
		tg.ready();
		tg.expand();
		applyScheme();
		if (tg.onEvent) {
			try { tg.onEvent("themeChanged", applyScheme); } catch (e) { /* older clients */ }
		}
	}

	syncDock();

	if (!tg || !tg.initData) {
		state.failure = { msg: "این صفحه باید از داخل ربات تلگرام باز بشه.", retry: false };
		render();
	} else {
		render();
		load();
	}

	// ثانیه‌شمارها. یک تایمر برای همه، نه یکی برای هر عنصر.
	setInterval(function () {
		for (var i = 0; i < tickers.length; i++) {
			try { tickers[i](); } catch (e) { /* یک تیکِ خراب بقیه را نمی‌خواباند */ }
		}
	}, 1000);

	// هر پنج دقیقه داده تازه می‌شود، ولی فقط وقتی صفحه دیده می‌شود.
	setInterval(function () {
		if (document.visibilityState === "visible" && state.data && !state.failure) load();
	}, 5 * 60000);
})();
