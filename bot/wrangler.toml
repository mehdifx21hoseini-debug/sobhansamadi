name = "sobhansamadi"
main = "src/worker.js"
compatibility_date = "2026-08-25"

[[d1_databases]]
binding = "DB"
database_name = "sobhan-bot-db"
database_id = "6cf5fd65-8247-4688-9f17-f8c9887c87bd"

# آدرس‌ها اینجا هستند، نه در پنل کلادفلر.
#
# دلیلش یک رفتار مهم است: این پروژه با Workers Builds از روی همین فایل
# دیپلوی می‌شود، و هر دیپلوی تنظیمات ورکر را با محتوای همین فایل جای‌گزین
# می‌کند. یعنی هر متغیر متنی که در پنل اضافه شود، با اولین بیلد بعدی پاک
# می‌شود. یک‌بار دقیقاً همین اتفاق افتاد و تقویم بی‌صدا از کار افتاد.
#
# این سه تا محرمانه نیستند (فقط آدرس‌اند)، پس جایشان همین‌جاست و دیگر
# پاک نمی‌شوند. فقط دو کلید باید Secret بمانند - Secretها با دیپلوی پاک
# نمی‌شوند و هرگز نباید داخل این مخزنِ عمومی نوشته شوند:
#
#   ECON_EXPORT_KEY      کلید مشترک WF-Econ-Export و WF-Econ-Explain
#   CRM_LEAD_INTAKE_KEY  کلید WF-Bot-Lead-Intake
[vars]
ECON_EXPORT_URL = "https://96825.7host.cloud/webhook/econ/export"
ECON_EXPLAIN_URL = "https://96825.7host.cloud/webhook/econ/explain"
CRM_LEAD_INTAKE_URL = "https://96825.7host.cloud/webhook/crm/lead/bot-intake"

# آینه‌ی تقویم را هر ۱۰ دقیقه تازه می‌کند. زمان‌بندهای خود n8n داده را
# کندتر از این جمع می‌کنند، پس فاصله‌ی کوتاه‌تر چیزی به تازگی داده اضافه
# نمی‌کند و فقط بار بی‌مورد روی n8n می‌گذارد.
[triggers]
crons = ["*/10 * * * *"]
