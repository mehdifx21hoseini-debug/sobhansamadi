name = "sobhansamadi"
main = "src/worker.js"
compatibility_date = "2026-08-25"

[[d1_databases]]
binding = "DB"
database_name = "sobhan-bot-db"
database_id = "6cf5fd65-8247-4688-9f17-f8c9887c87bd"

# آینه‌ی تقویم را هر ۱۰ دقیقه تازه می‌کند. زمان‌بندهای خود n8n داده را
# کندتر از این جمع می‌کنند، پس فاصله‌ی کوتاه‌تر چیزی به تازگی داده اضافه
# نمی‌کند و فقط بار بی‌مورد روی n8n می‌گذارد.
[triggers]
crons = ["*/10 * * * *"]
