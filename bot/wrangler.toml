name = "sobhansamadi"
main = "src/worker.js"
compatibility_date = "2026-08-25"

[[d1_databases]]
binding = "DB"
database_name = "sobhan-bot-db"
database_id = "6cf5fd65-8247-4688-9f17-f8c9887c87bd"

# آدرس‌ها اینجا هستند، نه در پنل کلادفلر.
#
# دلیلش یک رفتار مهم است: این پروژه با Workers Builds از روی همین فایل
# دیپلوی می‌شود، و هر دیپلوی تنظیمات ورکر را با محتوای همین فایل جای‌گزین
# می‌کند. یعنی هر متغیر متنی که در پنل اضافه شود، با اولین بیلد بعدی پاک
# می‌شود. یک‌بار دقیقاً همین اتفاق افتاد و تقویم بی‌صدا از کار افتاد.
#
# این سه تا محرمانه نیستند (فقط آدرس‌اند)، پس جایشان همین‌جاست و دیگر
# پاک نمی‌شوند. فقط دو کلید باید Secret بمانند - Secretها با دیپلوی پاک
# نمی‌شوند و هرگز نباید داخل این مخزنِ عمومی نوشته شوند:
#
#   ECON_EXPORT_KEY      کلید مشترک WF-Econ-Export و WF-Econ-Explain
#   CRM_LEAD_INTAKE_KEY  کلید WF-Bot-Lead-Intake
#   MENTORING_INTAKE_KEY کلید فرم منتورینگ سایت - همان مقداری که همین
#                        حالا در bot_secrets n8n هست، تا سایت لازم نباشد
#                        کلیدش را عوض کند و فقط آدرس را عوض کند
[vars]
ECON_EXPORT_URL = "https://96825.7host.cloud/webhook/econ/export"
ECON_EXPLAIN_URL = "https://96825.7host.cloud/webhook/econ/explain"
# فقط برای تنظیمات هشدار استفاده می‌شود؛ داده‌ی تقویم از آینه‌ی D1 می‌آید.
ECON_MINIAPP_URL = "https://96825.7host.cloud/webhook/econ/miniapp"
CRM_LEAD_INTAKE_URL = "https://96825.7host.cloud/webhook/crm/lead/bot-intake"
# مقصدِ درخواست‌های فرم منتورینگ، بعد از اینکه ورکر ذخیره‌شان کرد.
CRM_MENTORING_INTAKE_URL = "https://96825.7host.cloud/webhook/crm/lead/mentoring-intake"
# خروجی فقط-خواندنی جدول‌های CRM، برای آینه‌ای که صفحه‌ها را با قطعی n8n
# خالی نمی‌گذارد. با همان ECON_EXPORT_KEY احراز هویت می‌شود تا کلید تازه‌ای
# لازم نباشد - هر دو یک مرز اعتمادند: ورکر که فقط می‌خواند.
CRM_EXPORT_URL = "https://96825.7host.cloud/webhook/crm/export"

# آینه‌ی تقویم را هر ۱۰ دقیقه تازه می‌کند. زمان‌بندهای خود n8n داده را
# کندتر از این جمع می‌کنند، پس فاصله‌ی کوتاه‌تر چیزی به تازگی داده اضافه
# نمی‌کند و فقط بار بی‌مورد روی n8n می‌گذارد.
#
# «30 4» خلاصه‌ی روزانه است: کرانِ کلادفلر همیشه UTC است و ایران تغییر
# ساعت تابستانی ندارد، پس ۴:۳۰ UTC تمام سال دقیقاً ۸:۰۰ صبح تهران است.
#
# «*/5» هشدار قبل از خبر و اعلام نتیجه. کوتاه‌ترین فاصله‌ای که کاربر
# می‌تواند انتخاب کند پنج دقیقه است و دفتر ارسال جلوی تکرار را می‌گیرد.
#
# هر سه رشته در src/worker.js هم نوشته شده‌اند (DIGEST_CRON و
# ALERT_CRON) - اگر اینجا عوض شد، آنجا هم باید عوض شود.
[triggers]
crons = ["*/10 * * * *", "30 4 * * *", "*/5 * * * *"]
